# Model roles used by the generation adapter.
#
# Each role has a base provider (fal.ai unless stated otherwise) and optional
# `alternatives` for other providers. When a project selects higgsfield or
# topview, the adapter uses `alternatives.<provider>` instead of the fal.ai slug.
#
# These are planning estimates. Before a paid run, verify the exact model slug
# and price at https://fal.ai or https://console.higgsfield.ai and update this
# file. The estimator refuses to run a paid batch when a role has no pricing
# entry for the selected provider.
#
# Higgsfield adapter options (stripped before the request is sent):
#   send_seed: true            send the generation seed to models that support it
#   send_negative_prompt: true send negative_prompt to models that support it
#   reference_field: <name>    body field for uploaded edit references
#   end_reference_field: <name> body field for the end frame (firstLastFrameToVideo)
#
# Topview (providers.image / video: topview) takes the same send_seed,
# send_negative_prompt, reference_field, and end_reference_field options, plus:
#   request_format: content    content[] request (Topview T1, Seedance, MiniMax)
#   request_format: wan        input + parameters request (Wan 3.0); params go
#                              into `parameters`, send_seed sets parameters.seed
#                              the default "flat" sends prompt + named image fields
# Edit references default to `images`, video start frames to `image`. Prices are
# the Topview column of https://platform.topview.ai/pricing.
#
# Clip length (fal.ai, Higgsfield, and Topview video roles): a batch item's
# `durationSeconds` wins and is rounded up to whole seconds; `params.duration`
# is only the fallback. Adapter options, stripped before the request is sent:
#   min_duration: 3            raise shorter requests to the model's minimum
#   durations: [5, 10]         snap to the next allowed length
#
# ComfyUI (local; providers.image / video / lipsync / audio: comfyui): `model`
# is the name of a workflow exported with "Export (API)" into
# comfyui/workflows/<model>.json. Local runs cost nothing, so comfyui entries
# need no pricing. Adapter params:
#   fps: 24            frame rate the workflow renders at (sets cs_fps if present)
#   frame_step: 8      round frame counts to step*n+1 (LTX needs 8n+1)
#   size_multiple: 64  round width/height to a multiple (LTX: 64)
#   megapixels: 0.8    scale the target size to this many megapixels, keeping the aspect
#                      (LTX: 0.8 for drafts, 1.9 for final renders)
#   width/height       override the project's master size
#   lyrics: "..."      lyrics for music workflows (cs_lyrics); empty means none
#   node_inputs        {"<node title or id>.<input>": value} for anything else
#   workflow: <name>   run one batch item (or a project role override) on another
#                      workflow, e.g. a slower -quality variant: qwen-t2i-quality,
#                      qwen-edit-quality, ltx-i2v-quality, ltx-t2v-quality,
#                      ltx-flf2v-quality, ltx25-lipsync-flf2v-quality. Ignored on
#                      cloud providers.
# See comfyui/README.md for the node titles.
version: 1
last_verified: "2026-11-08 (planning estimates; verify before paid use)"

roles:
  image.character_sheet:
    provider: fal
    model: google/nano-banana-2.1/edit
    params:
      num_images: 1
      output_format: png
      resolution: 2K
    pricing:
      unit: image
      usd: 0.15
    notes: Multi-reference character sheets. Requires reference images; text-only prompts are rejected.
    alternatives:
      topview:
        model: google/nano-banana-2.1/edit
        params:
          resolution: 2k
          aspect_ratio: "1:1"
        pricing:
          unit: image
          usd: 0.035
        notes: Nano Banana 2.1 edit, up to 14 references. $0.03 at 2k plus $0.001 per input image (Topview price 2026-11-15).
      higgsfield:
        model: alibaba/qwen-image-3/edit
        params:
          resolution: 2k
          aspect_ratio: 1:1
          prompt_extend: false
          enable_thinking: false
          reference_field: image_urls
        pricing:
          unit: image
          usd: 0.03
        notes: One to three reference images. Verify the current Qwen edit price.
      comfyui:
        model: qwen-edit
        notes: Local Qwen Image 2.1 Turbo edit. The first reference sets the output size; up to 16 references.
  image.keyframe:
    provider: fal
    model: fal-ai/flux-2-pro
    params:
      num_images: 1
      output_format: png
      resolution: 1080p
    pricing:
      unit: image
      usd: 0.05
    notes: Hero keyframes and look development.
    alternatives:
      topview:
        model: google/nano-banana-2.1/text-to-image
        params:
          resolution: 2k
          aspect_ratio: "16:9"
        pricing:
          unit: image
          usd: 0.03
        notes: Nano Banana 2.1 text-to-image at 2k. No seed parameter, so reruns are not reproducible on the provider side.
      higgsfield:
        model: higgsfield-ai/soul/v2/standard
        params:
          resolution: 1080p
          aspect_ratio: 16:9
          enhance_prompt: false
          batch_size: 1
          send_seed: true
          reference_field: image_reference_url
        pricing:
          unit: image
          usd: 0.006
        notes: Soul 2 text-to-image. Planning estimate for 1080p.
      comfyui:
        model: qwen-t2i
        params:
          megapixels: 1.5
          size_multiple: 16
        notes: Local Qwen Image 2.1 Turbo, about 1.5 MP in the master aspect.
  image.edit:
    provider: fal
    model: fal-ai/flux-2-pro/edit
    params:
      num_images: 1
      output_format: png
    pricing:
      unit: image
      usd: 0.05
    notes: Reference-preserving edits.
    alternatives:
      topview:
        model: google/nano-banana-2.1/edit
        params:
          resolution: 2k
          aspect_ratio: "16:9"
        pricing:
          unit: image
          usd: 0.035
        notes: Nano Banana 2.1 edit. $0.03 at 2k plus $0.001 per input image.
      higgsfield:
        model: alibaba/qwen-image-3/edit
        params:
          resolution: 2k
          aspect_ratio: 16:9
          prompt_extend: false
          enable_thinking: false
          send_seed: true
          reference_field: image_urls
        pricing:
          unit: image
          usd: 0.03
        notes: Up to three reference images. Verify the current Qwen edit price.
      comfyui:
        model: qwen-edit
        notes: Local Qwen Image 2.1 Turbo edit. The first reference is the image to edit.
  image.keyframe.budget:
    provider: fal
    model: fal-ai/flux-2
    params:
      num_images: 1
      output_format: png
    pricing:
      unit: image
      usd: 0.03
    notes: Cheaper drafts and background stills.
    alternatives:
      topview:
        model: google/nano-banana-2.1/text-to-image
        params:
          resolution: 1k
          aspect_ratio: "16:9"
        pricing:
          unit: image
          usd: 0.02
        notes: Nano Banana 2.1 at 1k.
      higgsfield:
        model: higgsfield-ai/soul/v2/standard
        params:
          resolution: 720p
          aspect_ratio: 16:9
          enhance_prompt: false
          batch_size: 1
          send_seed: true
          reference_field: image_reference_url
        pricing:
          unit: image
          usd: 0.0032
        notes: Soul 2 at 720p. Planning estimate.
      comfyui:
        model: qwen-t2i
        params:
          megapixels: 1
          size_multiple: 16
        notes: Local Qwen Image 2.1 Turbo at about 1 MP.
  image.background_removal:
    provider: comfyui
    model: qwen-bg-remove
    notes: >-
      editImage with one reference: cut a character or prop out for layering in
      Remotion. Prompt e.g. "Remove the background, and output a PNG image".
      Local Qwen workflow only.
    alternatives: {}

  video.image_to_video.quality:
    provider: fal
    model: kling/v4/image-to-video
    params:
      duration: 5
      resolution: 1080p
      reference_field: start_image_url
    pricing:
      unit: second
      usd: 0.17
    maxDuration: 30
    notes: 3-30 s, optional end frame for frame chaining. Kling v4 has no audio switch and may return clips with sound; MediaLayer mutes clips, so the song stays the only audio source.
    alternatives:
      topview:
        model: alibaba/wan-3.0/image-to-video
        params:
          request_format: wan
          duration: 5
          min_duration: 2
          resolution: 1080P
          ratio: adaptive
          audio: false
          prompt_extend: false
          watermark: false
          send_seed: true
        pricing:
          unit: second
          usd: 0.1235
        maxDuration: 30
        notes: >-
          Wan 3.0 at 1080P, 2-30 s, takes a seed. Chosen over Kling 4.0 (1080P,
          $0.2096/s) after a side-by-side test on 2026-11-15; switch with a project
          override (model kling/kling-4.0/image-to-video, reference_field: image,
          end_reference_field: last_image) for tighter continuity. Output is 30 fps.
          No PNG alpha channel in the start frame.
      higgsfield:
        model: kling-video/v3.0/std/image-to-video
        params:
          duration: 5
          min_duration: 3
          sound: "off"
          cfg_scale: 0.5
        pricing:
          unit: second
          usd: 0.063
        maxDuration: 15
        notes: >-
          Kling 3.0 Standard. Output is 1280x720 at 24 fps (observed 2026-11-09), so it is
          upscaled in a 1080p master; use the Pro variant for native 1080p. Verify the
          current price and duration limit.
      comfyui:
        model: ltx-i2v
        params:
          fps: 24
          frame_step: 8
          size_multiple: 64
          megapixels: 0.8
        maxDuration: 10
        notes: >-
          Official LTX 2.5 image-to-video template. 0.8 MP is the draft size; set
          megapixels: 1.9 in a project override for the final render. Clips of
          3-6 s, one clear action per shot.
  video.image_to_video.fast:
    provider: fal
    model: kling/v4/flash/image-to-video
    params:
      duration: 5
      resolution: 720p
      reference_field: start_image_url
    pricing:
      unit: second
      usd: 0.08
    maxDuration: 20
    notes: Cheap drafts and B-roll.
    alternatives:
      topview:
        model: minimax/minimax-h3/image-to-video
        params:
          request_format: content
          duration: 5
          min_duration: 5
          resolution: 768P
          ratio: adaptive
        pricing:
          unit: second
          usd: 0.0299
        maxDuration: 15
        notes: MiniMax H3 at 768P, 5-15 s; the aspect follows the start frame. Cheap drafts and B-roll.
      higgsfield:
        model: kling-video/v2.5-turbo/standard/image-to-video
        params:
          duration: 5
          durations: [5, 10]
        pricing:
          unit: second
          usd: 0.042
        maxDuration: 10
        notes: Kling 2.5 Turbo Standard. 5 s or 10 s only.
      comfyui:
        model: ltx-i2v
        params:
          fps: 24
          frame_step: 8
          size_multiple: 64
          megapixels: 0.8
        maxDuration: 10
        notes: >-
          Official LTX 2.5 image-to-video template. 0.8 MP is the draft size; set
          megapixels: 1.9 in a project override for the final render. Clips of
          3-6 s, one clear action per shot.
  video.image_to_video.premium:
    provider: fal
    model: bytedance/seedance-2.5/us/image-to-video
    params:
      duration: 5
      resolution: 1080p
      generate_audio: false
    pricing:
      unit: second
      usd: 0.30
    maxDuration: 30
    notes: Hero shots only.
    alternatives:
      topview:
        model: topview/topview-t1/image-to-video
        params:
          request_format: content
          duration: 5
          min_duration: 4
          resolution: 1080p
          ratio: adaptive
          generate_audio: false
        pricing:
          unit: second
          usd: 0.4265
        maxDuration: 30
        notes: Topview T1 at 1080p, 4-30 s, no audio track. Rejects seed and negative_prompt.
      higgsfield:
        model: bytedance/seedance-2.5/image-to-video
        params:
          duration: 5
          resolution: 1080p
          generate_audio: false
        pricing:
          unit: second
          usd: 0.207
        maxDuration: 30
        notes: Seedance 2.5 list price at 1080p; discounts may lower it.
      comfyui:
        model: ltx-i2v
        params:
          fps: 24
          frame_step: 8
          size_multiple: 64
          megapixels: 0.8
        maxDuration: 10
        notes: >-
          Official LTX 2.5 image-to-video template. 0.8 MP is the draft size; set
          megapixels: 1.9 in a project override for the final render. Clips of
          3-6 s, one clear action per shot.
  video.image_to_video.budget:
    provider: fal
    model: alibaba/wan-3.0/image-to-video
    params:
      duration: 5
      resolution: 720p
      generate_audio: false
    pricing:
      unit: second
      usd: 0.06
    notes: Lowest-cost motion pass.
    alternatives:
      topview:
        model: alibaba/wan-3.0/image-to-video
        params:
          request_format: wan
          duration: 5
          min_duration: 2
          resolution: 720P
          ratio: adaptive
          audio: false
          prompt_extend: false
          watermark: false
          send_seed: true
        pricing:
          unit: second
          usd: 0.0618
        maxDuration: 30
        notes: >-
          Wan 3.0 at 720P, 2-30 s, the same model as the fal.ai base. Takes a seed.
          No PNG alpha channel in the start frame. 1080P costs $0.1235/s.
      higgsfield:
        model: alibaba/wan-3.0/image-to-video
        params:
          duration: 5
          resolution: 720p
          aspect_ratio: 16:9
          generate_audio: false
          send_seed: true
        pricing:
          unit: second
          usd: 0.05
        maxDuration: 30
        notes: Wan 3.0 at 720p. Planning estimate.
      comfyui:
        model: ltx-i2v
        params:
          fps: 24
          frame_step: 8
          size_multiple: 64
          megapixels: 0.8
        maxDuration: 10
        notes: >-
          Official LTX 2.5 image-to-video template. 0.8 MP is the draft size; set
          megapixels: 1.9 in a project override for the final render. Clips of
          3-6 s, one clear action per shot.

  video.premium.veo:
    provider: fal
    model: fal-ai/veo3.1/image-to-video
    params:
      duration: 5
      resolution: 1080p
      generate_audio: false
    pricing:
      unit: second
      usd: 0.40
    maxDuration: 8
    notes: Expensive hero fallback; verify the current slug and price.
    alternatives:
      higgsfield:
        model: veo3.1/fast/image-to-video
        params:
          duration: 4
          durations: [4, 6, 8]
          resolution: 1080p
          aspect_ratio: 16:9
          generate_audio: false
        pricing:
          unit: second
          usd: 0.12
        maxDuration: 8
        notes: Veo 3.1 Fast supports 4, 6, or 8 second clips.
      comfyui:
        model: ltx-i2v
        params:
          fps: 24
          frame_step: 8
          size_multiple: 64
          megapixels: 0.8
        maxDuration: 10
        notes: >-
          Official LTX 2.5 image-to-video template. 0.8 MP is the draft size; set
          megapixels: 1.9 in a project override for the final render. Clips of
          3-6 s, one clear action per shot.

  video.text_to_video:
    provider: comfyui
    model: ltx-t2v
    params:
      fps: 24
      frame_step: 8
      size_multiple: 64
      megapixels: 0.8
    maxDuration: 10
    notes: >-
      Text-to-video for abstract B-roll and atmospheres without a keyframe. Local
      LTX workflow by default. Do not use it for character shots; they need a
      reference frame. Add alternatives.fal (model slug and pricing) to run it in
      the cloud.
    alternatives:
      topview:
        model: minimax/minimax-h3/text-to-video
        params:
          request_format: content
          duration: 5
          min_duration: 5
          resolution: 768P
          ratio: "16:9"
        pricing:
          unit: second
          usd: 0.0299
        maxDuration: 15
        notes: MiniMax H3 text-to-video. Text-only requests need an explicit ratio; set it per project format.
  video.first_last_frame:
    provider: comfyui
    model: ltx-flf2v
    params:
      fps: 24
      frame_step: 8
      size_multiple: 64
      megapixels: 0.8
    maxDuration: 10
    notes: >-
      Animate between a start and an end keyframe (firstLastFrameToVideo). Local
      LTX workflow by default. A cloud alternative needs end_reference_field set
      to the model's end-frame field.
    alternatives:
      topview:
        model: alibaba/wan-3.0/image-to-video
        params:
          request_format: wan
          duration: 5
          min_duration: 2
          resolution: 1080P
          ratio: adaptive
          audio: false
          prompt_extend: false
          watermark: false
          send_seed: true
        pricing:
          unit: second
          usd: 0.1235
        maxDuration: 30
        notes: Wan 3.0 with first_frame and last_frame media at 1080P. Output is 30 fps.

  video.wan:
    provider: comfyui
    model: wan22-i2v
    params:
      fps: 16
      frame_step: 4
      size_multiple: 16
    maxDuration: 10
    notes: >-
      Wan 2.2 14B image-to-video with RIFE x3 interpolation (16 fps native, saved
      at 48 fps, so a 24 fps edit takes every second frame). Not a shot role: a
      batch item keeps its imageToVideo role and sets params.video_model: wan.
      Size follows the start frame's aspect (draft 832x480, final 1280x720, multiples
      of 16); params.turbo (default true) switches the 4-step Lightning LoRAs. No
      sound, no lip-sync. Character names in the prompt are replaced by their
      characters.yaml description.
    alternatives: {}
  video.upscale:
    provider: comfyui
    model: seedvr2-upscale
    notes: >-
      SeedVR2 3B restore/upscale (upscaleVideo). Not a shot role: runs after a
      local clip with params.quality: final unless params.seedvr2 is "off".
      restore = scale 1 at full size; upscale = render at half size (LTX, multiples
      of 64) or 720p (Wan) and scale to the master. color_correction lab (default)
      or wavelet. Writes <clip>_upscaled.mp4 with the original audio copied back.
    alternatives: {}
  video.lipsync:
    provider: fal
    model: fal-ai/bytedance/omnihuman/v1.5
    params:
      resolution: 1080p
    pricing:
      unit: second
      usd: 0.16
    maxDuration: 30
    notes: >-
      Image + audio -> singing/talking clip (OmniHuman 1.5). Billed per second of
      driving audio. fal docs list $0.14/s (2026-11-08); third-party pages say
      $0.16/s, so the estimate is conservative. Audio max 30 s at 1080p.
      Higgsfield (Speak v2) and Topview (Avatar 4) have their own alternatives below.
    alternatives:
      higgsfield:
        model: higgsfield-ai/speak
        params:
          model_quality: high
          durations: [5, 10, 15]
          send_seed: true
        pricing:
          unit: second
          usd: 0.225
        maxDuration: 15
        notes: >-
          Higgsfield Speak v2 (Wan-based speech-to-video): image_url + audio_url +
          prompt, model_quality high|mid (sent as quality; a plain `quality` param
          is the local draft/final option), seed, duration 5|10|15 s. WAV audio
          only: MP3 is rejected with invalid_audio_format, so cut the segment with
          `audio-segment --format wav`. The clip follows the audio length (a 3 s
          segment gave a 3 s clip, 1280x704, 16 fps), but billing is per selected
          duration: a 3 s segment at high quality cost $1.125 (one 5 s
          generation, GET /models/usage, 2026-11-18), so the estimate snaps to
          5/10/15 s at $0.225/s. Speak is not on the public price list; mid
          quality is unpriced. Other Higgsfield lip-sync models via a project
          override of models.video.lipsync (model, params, pricing): Kling Avatar
          on the legacy route, model v1/speak/kling with params {request_format:
          job_set, mode: std|pro, send_duration: false} (price unverified);
          audio-driven Wan, model wan/v2.7/image-to-video with params
          {resolution: 720p, min_duration: 2, send_seed: true} at $0.075/s (720p,
          public price list) or wan/v2.6/image-to-video with {durations: [5, 10,
          15]} at $0.0752/s (both unpiloted for lip-sync). InfiniteTalk and a
          separate Wan 2.5 Speak route are not exposed on the API.
      topview:
        model: avatar4
        params: {}
        pricing:
          unit: second
          usd: 0.02
        maxDuration: 60
        notes: >-
          Topview Avatar 4 (photo avatar) on the Topview OpenAPI (api.topview.ai):
          needs TOPVIEW_UID and TOPVIEW_OPENAPI_KEY, not the platform key. The model
          is the mode: avatar4, avatar4Fast, or avatar2. The prompt becomes
          customMotion (max 600 characters); params.offPeak: true halves the credits
          (24 h fallback timeout). Billed in plan credits per generated second:
          avatar4 0.1, avatar4Fast 0.06, avatar2 0.4 credits/s (Topview API docs,
          2026-06-26). PRICE UNVERIFIED in USD: a credit costs about $0.10-0.16
          depending on the plan, so $0.02/s is a conservative planning estimate.
          maxDuration is a planning limit, not a documented one.
      comfyui:
        model: ltx25-lipsync-flf2v
        params:
          fps: 24
          frame_step: 8
          size_multiple: 64
          megapixels: 0.8
        maxDuration: 10
        notes: >-
          LTX 2.5 FLF2V lip-sync, single pass (providers.lipsync: comfyui). Start
          frame, end frame (the start frame again when there is only one), and the
          vocal stem cut by audioStartSeconds + durationSeconds. Frames round down
          to 8n+1, so end each segment in a pause with about 0.3 s of silence.
          0.8 MP draft, megapixels: 1.9 for the final render.

  audio.music:
    provider: comfyui
    model: music-minimax
    maxDuration: 360
    notes: >-
      generateAudio: a full track with vocals from a caption (prompt) and
      params.lyrics; durationSeconds is the maximum length. For teasers,
      intros, or demo tracks only; a video's song is always supplied by the user.
      Set models.audio.music.model to music-ace for ACE-Step 1.5 XL Turbo (faster;
      bpm, keyscale, and language via node_inputs, e.g. "cs_prompt.bpm": 120).
    alternatives: {}
  audio.sfx:
    provider: comfyui
    model: audio-stable
    maxDuration: 180
    notes: >-
      generateAudio: instrumentals, risers, stingers, and sound effects (Stable
      Audio 3 Medium). The workflow rewrites the prompt with its own LLM first.
    alternatives: {}
  audio.voice:
    provider: comfyui
    model: voxcpm-clone
    notes: >-
      generateAudio: speech in a cloned voice (VoxCPM2). The default for every
      voice-over. The batch item's audio is the reference WAV and
      params.transcript its exact text; the prompt is the text to speak, with all
      numbers, years, times, abbreviations, and symbols spelled out in German
      ("2077" -> "zweitausendsiebenundsiebzig"; generate rejects digits). Generate
      long texts sentence by sentence and join them; try up to 3 seeds on a
      misspoken or wrongly stressed take.
    alternatives: {}
  audio.voice_design:
    provider: comfyui
    model: voxcpm-design
    notes: >-
      generateAudio: a new voice from a description, written in brackets before
      the text: "(warm, low female voice)Text". Only for finding a voice; save a
      good take as the reference WAV for audio.voice.
    alternatives: {}
