    description: "The board wizard (POST /api/new/meme) or new <slug> --kind meme --idea … [--setting …]: project.yaml of kind meme, pitch.md, setup done; the chosen library characters are copied through CMD-UseLibraryCharacter; the wizard then shows /new-meme <slug>"
    rules:
      - The idea is required, the setting optional; both go into pitch.md in the user's words (user, 2026-11-22)
      - The master format is 9:16 and the only format (user, 2026-11-22)
      - The budget defaults to 10 USD and is at least the configured minimum (user, 2026-11-22)
      - Library characters are optional; none is a valid choice and the character bible invents them later (user, 2026-11-22)
  - id: CMD-AddLibrarySound
    name: Add a library sound
    actor: ACT-User
    aggregate: AGG-LibrarySound
    produces: [EVT-LibrarySoundAdded, EVT-LibrarySoundRefused]
