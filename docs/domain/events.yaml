    description: "new-series writes series.yaml, state.json, a starter style.yaml from the brand kit and bible.md from templates/series (packages/cli/src/new-series.ts:67-104)"
  - id: EVT-EpisodeCreated
    name: Episode created
    aggregate: AGG-Series
    pivotal: true
    data: [Episode slug, Episode number, Title, Episode budget, Uncommitted series budget]
    description: "new --kind episode or the board wizard: a project of kind episode with the series' formats, providers and brand and the title from the episode plan (packages/cli/src/new-project.ts:101-134,201-216)"
  - id: EVT-EpisodeRefused
