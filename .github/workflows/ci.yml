name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: TypeScript tests
        run: npm test

      - name: Python tests
        working-directory: scripts/audio-analysis
        run: |
          uv sync --group dev
          uv run pytest -q

      - name: Generate demo audio
        run: npm run demo:audio

      - name: Validate demo
        run: npm run cli -- validate projects/demo

      - name: Contact sheet
        run: npm run cli -- contact-sheet projects/demo

      - name: Short smoke test
        run: |
          mkdir -p projects/demo/renders
          ffmpeg -v error -y -f lavfi -i testsrc2=size=1080x1920:rate=30:duration=12 -f lavfi -i sine=frequency=440:duration=12 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest -threads 6 projects/demo/renders/9x16.mp4
          npm run cli -- short projects/demo --from section:verse_1 --to section:chorus_1:end --name D1-chorus
          test -s projects/demo/renders/shorts/D1-chorus-9x16.mp4
          rm -rf projects/demo/renders/9x16.mp4 projects/demo/renders/shorts

      - name: Cache Remotion browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Remotion still smoke test
        run: |
          npm run cli -- render projects/demo --still 130 --still-scale 0.25
          test -s projects/demo/renders/still-130.png

      - name: Thumbnail smoke test
        env:
          CORESLOPPER_RENDER_TESTS: "1"
        run: npx vitest run tests/thumbnail-render.test.ts

      - name: Demo episode (mock provider)
        run: |
          npm run demo:episode
          npm run cli -- validate projects/demo-episode
          npm run cli -- voice-track projects/demo-episode
          npm run cli -- episode-track projects/demo-episode
          git diff --exit-code projects/demo-episode/timing.json
          npm run cli -- subtitles projects/demo-episode
          test -s projects/demo-episode/renders/demo-episode.en.srt
          npm run cli -- render projects/demo-episode --still 160 --still-scale 0.25 --subtitles en
          test -s projects/demo-episode/renders/still-160.png

      - name: Build npm package and npx bundle
        run: npm run build

      - name: Package smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          npm pack --pack-destination "$RUNNER_TEMP/pkg"
          TARBALL=$(ls "$RUNNER_TEMP"/pkg/coreslopper-*.tgz)
          npx -y -p "$TARBALL" coreslopper init "$RUNNER_TEMP/coreslopper-npx" --yes --no-install --no-git --skip-project
          npx -y -p "$TARBALL" coreslopper doctor "$RUNNER_TEMP/coreslopper-npx"
          npx -y -p "$TARBALL" coreslopper update "$RUNNER_TEMP/coreslopper-npx" --no-install | tee "$RUNNER_TEMP/update.log"
          grep -q "already up to date" "$RUNNER_TEMP/update.log"
          test ! -e "$RUNNER_TEMP/coreslopper-npx/.github/workflows/release.yml"
          test ! -e "$RUNNER_TEMP/coreslopper-npx/release-please-config.json"
          test -f "$RUNNER_TEMP/coreslopper-npx/packages/cli/src/init.ts"

      - name: Upload demo artifacts
        uses: actions/upload-artifact@v7
        with:
          name: demo-artifacts
          path: |
            projects/demo/review/contact-sheet.svg
            projects/demo/renders/still-130.png
          if-no-files-found: error
