commands:
  - id: CMD-CreateProject
    name: Create project
    actor: ACT-SetupSkill
    aggregate: AGG-Project
    produces: [EVT-ProjectCreated]
    rules:
      - The slug is valid and no project folder with it exists
      - The budget is at least the configured minimum
      - An episode names its series and episode number, and its budget fits the uncommitted series budget
  - id: CMD-StartStage
    name: Start stage
    actor: ACT-Orchestrator
    aggregate: AGG-Project
    produces: [EVT-StageStarted]
    rules:
      - Only an autonomous stage, and only from pending or failed (confirmed 2026-11-21; not enforced in code)
  - id: CMD-CompleteStage
    name: Complete stage
    actor: ACT-Orchestrator
    aggregate: AGG-Project
    produces: [EVT-StageCompleted, EVT-ProjectCompleted]
    description: Autonomous stages only; the orchestrator completes them with the outputs the stage runner reported
    rules:
      - Only from running (confirmed 2026-11-21; not enforced in code)
      - Completing style-character takes the project's characters into the character library
  - id: CMD-CompleteInteractiveStage
    name: Complete interactive stage
    actor: ACT-SetupSkill
    aggregate: AGG-Project
    produces: [EVT-StageCompleted]
    description: The setup skill of the kind (new-video, new-episode) completes setup, brief, treatment or script; the board wizard may complete setup
    rules:
      - Only an interactive stage, from pending or failed; a setup skill does not start it first (confirmed 2026-11-21; not enforced in code)
  - id: CMD-FailStage
    name: Fail stage
    actor: ACT-Orchestrator
    aggregate: AGG-Project
    produces: [EVT-StageFailed]
    rules:
      - Only from running (confirmed 2026-11-21; not enforced in code)
  - id: CMD-SkipStage
    name: Skip stage
    actor: ACT-User
    aggregate: AGG-Project
    description: A manual decision of the user for a stage the project does not need; no skill or command skips
    rules:
      - Only from pending or failed (confirmed 2026-11-21; not enforced in code)
    produces: [EVT-StageSkipped, EVT-ProjectCompleted]
  - id: CMD-ResetStage
    name: Reset stage
    actor: ACT-User
    aggregate: AGG-Project
    produces: [EVT-StageReset]
    rules:
      - A running stage cannot be reset (confirmed 2026-11-21; the code accepts it)
      - Every later stage that is done or skipped returns to pending as well (confirmed 2026-11-21; the code resets one stage only)
      - The orchestrator resets qa-export after review fixes changed the picture
  - id: CMD-RecordSpend
    name: Record spend
    actor: ACT-StageRunner
    aggregate: AGG-Project
    produces: [EVT-SpendRecorded]
    rules:
      - Before a paid batch, its worst-case estimate fits the remaining budget and the batch cap (30 % of the remaining budget unless batch_cap_usd is set)
  - id: CMD-AddReviewNote
    name: Add review note
    actor: ACT-User
    aggregate: AGG-ProjectReview
    produces: [EVT-ReviewNoteAdded]
    rules:
      - The render is one of the project's renders; the note sits on a frame or a range of frames of it
  - id: CMD-ChangeReviewNote
    name: Change review note
    actor: ACT-User
    aggregate: AGG-ProjectReview
    produces: [EVT-ReviewNoteChanged]
  - id: CMD-DeleteReviewNote
    name: Delete review note
    actor: ACT-User
    aggregate: AGG-ProjectReview
    produces: [EVT-ReviewNoteDeleted]
  - id: CMD-SendReviewRound
    name: Send review round
    actor: ACT-User
    aggregate: AGG-ProjectReview
    produces: [EVT-ReviewRoundSent]
    rules:
      - Each note gets the shots on screen during it (a note on a cut belongs to both shots) and the section at its start
      - The round records the version of its render, so notes on a since-changed render can be shown as such (confirmed 2026-11-21; missing – gap register)
  - id: CMD-AnswerReviewRound
    name: Answer review round
    actor: ACT-StageRunner
    aggregate: AGG-ProjectReview
    produces: [EVT-ReviewRoundAnswered]
    rules:
      - Reply status is fixed, partly, not-fixed or question
  - id: CMD-AddQueueItem
    name: Add queue item
    actor: ACT-StageRunner
    aggregate: AGG-GenerationQueue
    produces: [EVT-QueueItemAdded, EVT-QueueItemReplaced]
    rules:
      - Items come from storyboard.yaml (keyframes, clips) or a hand-written batch with id and out; a known id is skipped unless replace is asked for
      - Replacing a passed item returns every passed item after it to pending, as a stage reset does (HS-38; missing – gap register)
      - A generating or reviewing item cannot be replaced (the code refuses, queue.ts:179)
  - id: CMD-RunQueue
    name: Run the queue
    actor: ACT-StageRunner
    aggregate: AGG-GenerationQueue
    produces: [EVT-AttemptGenerated, EVT-AttemptGenerationFailed, EVT-QueueRunStopped]
    rules:
      - Generates ready items lowest order first through generate (budget, cache, manifest, spend)
      - A budget or config error puts the item back to pending and stops the run; a validation error marks it error; other failures are tried again with a ComfyUI restart in between
      - A killed run's generating items go back to pending on the next run
  - id: CMD-GiveVerdict
    name: Give a verdict
    actor: ACT-ArtDirector
    produces: [EVT-VerdictGiven]
    rules:
      - Fail only for a blocking defect; any other issue is a verdict note and the verdict stays pass; a fail with verdict notes only becomes a pass – for every verdict, also outside the queue (HS-34)
      - A clip is judged by its first, middle and last frame; a first frame below 20 dB PSNR against its keyframe is pointed out for comparison
      - From attempt 2 on, the art director checks the focus and new blocking defects and raises no new verdict notes
  - id: CMD-ApplyVerdict
    name: Apply a verdict
    actor: ACT-QueueRun
    aggregate: AGG-GenerationQueue
    produces: [EVT-AttemptFiled, EVT-QueueItemRequeued, EVT-QueueItemNeedsFix]
    rules:
      - A pass files the attempt at out, which makes the items after it ready
      - A failed image with a usable fix prompt and fewer than max attempts is requeued with the fix prompt as its prompt, seed + 1, the blocking issues as focus and a new order
      - Any other fail – a clip, an audio item, a fix prompt "none", the limit reached – leaves the item needing a fix
  - id: CMD-RetryQueueItem
    name: Retry queue item
    actor: ACT-StageRunner
    aggregate: AGG-GenerationQueue
    produces: [EVT-QueueItemRequeued]
    description: "Requeue an item by hand; the command is spelled queue retry (HS-32)"
    rules:
      - Optional new prompt, changed item fields, a provider for one attempt (cloud fallback) or a seed
      - An unchanged item whose last attempt has no verdict is only judged again
      - Refused for a passed item; redo a filed item with a replace (HS-38; the code allows it – gap register)
      - The stage runner may give one attempt a cloud provider (cloud fallback) after 3 failed local attempts
  - id: CMD-AcceptAttempt
    name: Accept attempt
    actor: ACT-User
    aggregate: AGG-GenerationQueue
    produces: [EVT-AttemptAccepted, EVT-AttemptFiled]
    rules:
      - The given attempt, or the best one (highest score, the later on a tie), is filed at out and the item counts as passed
      - The user may accept any attempt; the stage runner only the best one after the cloud attempt failed, writing its last issues into the batch notes (HS-42)
  - id: CMD-DropQueueItem
    name: Drop queue item
    actor: ACT-StageRunner
    aggregate: AGG-GenerationQueue
    produces: [EVT-QueueItemDropped]
    rules:
      - Refused while generating or reviewing; the item's files stay
  - id: CMD-PatchRegion
    name: Patch a region
    actor: ACT-StageRunner
    aggregate: AGG-GenerationQueue
    produces: [EVT-RegionPatched]
    rules:
      - Crops the box, runs it as an image edit through generate (cache, manifest, budget), pastes it back with a soft edge; pixels outside the box do not change
      - The patched image is the next attempt of the image's queue item (HS-40; the code numbers it from verdicts.jsonl and leaves queue.json alone – gap register)
  - id: CMD-ImportSong
    name: Import song
    actor: ACT-SetupSkill
    produces: [EVT-SongImported]
    description: "import-song, run by the setup skill or by the board wizard's upload"
    rules:
      - One source per name, case-insensitive; a WAV already in place is kept as it is
      - A missing vocal stem only warns; the analysis then separates the vocals from the mix
  - id: CMD-NormalizeSongLoudness
    name: Normalize song loudness
    actor: ACT-SetupSkill
    produces: [EVT-SongLoudnessNormalized]
    rules:
      - Before the song analysis; a song changed after it makes the timing stale (HS-59)
  - id: CMD-WriteLyrics
    name: Write lyrics
    actor: ACT-User
    aggregate: AGG-Lyrics
    produces: [EVT-LyricsWritten]
    description: "lyrics --file or the board wizard; lyrics --propose and the wizard's preview propose section tags and write nothing (a block that repeats becomes [Chorus], the others numbered verses)"
    rules:
      - Not empty and at most 100,000 characters; line endings become LF
  - id: CMD-AnalyzeSong
    name: Analyze song
    actor: ACT-StageRunner
    aggregate: AGG-ProjectTiming
    produces: [EVT-SongAnalyzed]
    description: "analyze.py in the audio-analysis stage, run by the stage runner through the audio-analysis skill; no CLI command runs it"
    rules:
      - Analyzes the imported vocal stem from song.json; separates the vocals from the mix only when none was imported and never overwrites an imported stem (HS-56; without --vocals Demucs overwrites it today – gap register)
      - A missing separation or speech recognition model stops the analysis; it falls back to the mix or to energy-based sections only when asked to, and the report says which (HS-57; a missing Demucs and zero recognized words fall back silently today – gap register)
      - Validates timing.json against the generated schema before writing it (HS-58; skipped when run from scripts/audio-analysis – gap register)
      - Section ids follow the tag text – [Verse 2] is verse_2, a repeated unnumbered tag is numbered in order, a repeated numbered tag is refused; line ids are positional (HS-55; ids drift today – gap register)
      - Lists low-confidence boundaries (below 0.7), low-confidence lines (below 0.6), lines placed without a recognized word, and echo spans in the timing report
  - id: CMD-SeparateLeadStem
    name: Separate lead stem
    actor: ACT-StageRunner
    produces: [EVT-LeadStemSeparated]
    rules:
      - Optional; lip-sync segments of a music video are cut from the lead stem when it exists
  - id: CMD-OverrideTiming
    name: Override timing
    actor: ACT-User
    aggregate: AGG-ProjectTiming
    produces: [EVT-TimingOverridden]
    description: "The user tells the agent what sits wrong and the agent enters the override in timing.overrides.json (user, 2026-11-21, HS-66)"
    rules:
      - An entry is added or changed; the file is never replaced and no entry the user asked for is dropped
      - To change the sections themselves, change the lyrics and analyze again; an override moves times only
  - id: CMD-WriteStoryboard
    name: Write storyboard
    actor: ACT-StageRunner
    aggregate: AGG-Storyboard
    produces: [EVT-StoryboardWritten]
    description: "The storyboard stage through the storyboard skill, from the treatment (music video) or the script (episode), the effective timing, the style, character and set bibles, and the user references of kind storyboard and footage"
    rules:
      - Anchors are symbolic; a time anchor is the escape hatch and only warns (ADR 0005)
      - Shots the user drew or filmed (user references) keep their framing and timing unless the treatment changed them
      - Missing plates, props or character states are added to the bibles first; an episode only appends them to the canon (ADR 0025)
      - The storyboard table storyboard.md lists exactly the shots of storyboard.yaml (HS-78; written by hand today – gap register)
  - id: CMD-ReviseStoryboard
    name: Revise storyboard
    actor: ACT-Orchestrator
    aggregate: AGG-Storyboard
    produces: [EVT-StoryboardRevised]
    description: "The agent changes shots because the user asked in the chat or in a review note; the fix pass maps notes to shots (user, 2026-11-21, HS-77)"
    rules:
      - A revised shot's keyframe and clip are generated again; the generation cache keeps unchanged shots cheap
  - id: CMD-ValidateStoryboard
    name: Validate storyboard
    actor: ACT-StageRunner
    aggregate: AGG-Storyboard
    produces: [EVT-StoryboardValidated]
    description: "validate, the hook's validate-file, and every render, contact-sheet, qa, subtitles and board-review run validateProject first"
    rules:
      - Needs the effective timing, the style and character bibles, and in an episode the script and the series canon; the project kind, slug and budget must match state.json
      - The lip-sync maximum comes from video.lipsync of the project's provider (config/models.yaml)
      - Every consumer that builds from shots – queue items, QA, render, review – reads the validated storyboard (HS-79; the queue and QA read it unvalidated – gap register)
  - id: CMD-WriteContactSheet
    name: Write contact sheet
    actor: ACT-StageRunner
    aggregate: AGG-Storyboard
    produces: [EVT-ContactSheetWritten]
    description: "contact-sheet in the storyboard stage (skill step 5); validates first"
    rules:
      - The contact sheet belongs in the board's project view and shows each shot's keyframe once it exists (user, 2026-11-21, HS-71; today an SVG of text cards nobody opens – gap register)
  - id: CMD-RunGenerationBatch
    name: Run a generation batch
    actor: ACT-QueueRun
    aggregate: AGG-CachedGeneration
    produces: [EVT-GenerationBatchRefused, EVT-GenerationCompleted, EVT-GenerationReused, EVT-GenerationFailed, EVT-ClipRestored, EVT-GenerationFiled]
    description: "runBatch, reached through generate, the queue run (one item per batch), patch, voice-track and the bench; the stage runner writes the batches"
    rules:
      - Each item's provider comes from the project – providers.image, providers.video, providers.lipsync (fal when video is comfyui or topview), providers.audio (comfyui) – or from --provider; lip-sync follows only --lipsync-provider, reference-to-video always runs on ComfyUI (models.ts:87-98, generate.ts:299-304)
      - Before the first call, the batch's worst-case estimate – cache hits included – fits the remaining budget and the batch cap; otherwise nothing runs (cost.ts:21-38; decided 2026-11-21, HS-90)
      - The item's shape fits its operation – references, audio, duration, exactly one of prompt, Flex prompt or FL2VA prompt – and the provider's limits, checked before any call (generate.ts:63-169,287-594)
      - A cloud clip's length is rounded up to a length the model offers and billed at that length; a lip-sync clip's length comes from its audio (packages/providers/src/duration.ts:16-29; generate.ts:416-428,588-592)
      - Every generation – a new result, a reuse or a failure – adds one line to the project's or the series canon's manifest (runner.ts:97,158,191); a paid call that returns no file also leaves one (decided 2026-11-21, HS-92; today it leaves none – gap register)
      - A paid submission is never charged twice – a submission is retried only with an idempotency key the provider honours, or before the provider accepted it (decided 2026-11-21, HS-97; fal is retried without a key – gap register)
      - A final local clip gets the restore pass unless seedvr2 is off (generate.ts:556-569)
  - id: CMD-EstimateGeneration
    name: Estimate a generation
    actor: ACT-StageRunner
    aggregate: AGG-ModelRoles
    produces: [EVT-GenerationBatchRefused]
    description: "generate --dry-run for a batch, estimate for one role and a number of units"
    rules:
      - Uses the same provider, price and both budget limits as a run (decided 2026-11-21, HS-95; estimate checks only the batch cap and always succeeds – gap register)
  - id: CMD-ChangeModelRoles
    name: Change model roles
    actor: ACT-Orchestrator
    aggregate: AGG-ModelRoles
    produces: [EVT-ModelRolesChanged]
    description: "The agent edits config/models.yaml or a project's models overrides at the user's request, after a model bench where it is a switch"
    rules:
      - A model switch is a change of the model roles, not of code (ADR 0006; docs/providers.md)
  - id: CMD-RestartComfyUI
    name: Restart ComfyUI
    actor: ACT-QueueRun
    produces: [EVT-ComfyUIRestarted]
    description: "comfy restart, and the queue run between two tries of a failed or hung generation, through COMFYUI_RESTART_COMMAND (packages/cli/src/comfy.ts:62; queue.ts:641)"
  - id: CMD-RecordCanonSpend
    name: Record canon spend
    actor: ACT-SetupSkill
    aggregate: AGG-Series
    produces: [EVT-CanonSpendRecorded]
    description: "runBatch for generate --series records the planned cost of every new canon generation in the series' state.json (packages/cli/src/generate.ts:260-277)"
    rules:
      - Before a canon batch, its worst-case estimate fits the series total minus canon spend and the batch cap; episode budgets are not subtracted (generate.ts:260-277; HS-105 decided otherwise – gap register)
  - id: CMD-CreateSeries
    name: Create a series
    actor: ACT-SetupSkill
    aggregate: AGG-Series
    produces: [EVT-SeriesCreated]
    description: "new-series in the new-series skill, or the board wizard (POST /api/new/series)"
    rules:
      - A series budget is required (new-series.ts:72; HS-106)
      - The slug is not taken in projects/ (new-series.ts:77; ADR 0035)
  - id: CMD-CreateEpisode
    name: Create an episode
    actor: ACT-SetupSkill
    aggregate: AGG-Series
    produces: [EVT-EpisodeCreated, EVT-EpisodeRefused]
    description: "new --kind episode in the new-episode skill, or the board wizard (POST /api/new/episode)"
    rules:
      - The episode budget fits the uncommitted series budget – series budget minus canon spend minus every other episode's budget (new-project.ts:205-216)
      - The episode number is not taken in the series (decided 2026-11-22, HS-108; not checked today – gap register)
      - Formats, providers and brand are copied from series.yaml, the title from the episode plan (new-project.ts:101-134)
  - id: CMD-WriteScript
    name: Write the script
    actor: ACT-SetupSkill
    aggregate: AGG-Script
    produces: [EVT-ScriptWritten]
    description: "The new-episode skill grills the user against the bible, the episode plan and the canon and writes script.yaml in the script stage"
    rules:
      - A story that needs a character or set the canon lacks stops until the series canon has it; an episode cannot add one (new-episode skill step 2)
  - id: CMD-ReviseScript
    name: Revise the script
    actor: ACT-Orchestrator
    aggregate: AGG-Script
    produces: [EVT-ScriptRevised]
    description: "The agent changes script.yaml when the user asks for a different text, pause or line (user, 2026-11-22, HS-121); the voice track and the episode track run again"
  - id: CMD-ValidateScript
    name: Validate the script
    actor: ACT-StageRunner
    aggregate: AGG-Script
    produces: [EVT-ScriptValidated]
    description: "validate-file on every edit of script.yaml (the workspace hook), and validate for the whole episode"
  - id: CMD-GenerateTakes
    name: Generate the takes
    actor: ACT-StageRunner
    aggregate: AGG-TakeRegistry
    produces: [EVT-TakeGenerated, EVT-AmbienceGenerated, EVT-VoiceTrackStopped]
    description: "voice-track in the voice-track stage, with --dry-run for the estimate; one runBatch on the episode budget"
    rules:
      - Every blocking take is listed and nothing is generated until all are resolved (voice-track.ts)
      - Only missing and stale generated takes are generated; current takes are kept (voice-track.ts)
      - Speech needs a reference voice for its speaker or an imported take (voice-track.ts:55-60)
  - id: CMD-ImportTakes
    name: Import takes
    actor: ACT-User
    aggregate: AGG-TakeRegistry
    produces: [EVT-TakeImported]
    description: "import-takes [--lines] after the user put recordings into audio/lines/"
  - id: CMD-BuildEpisodeTrack
    name: Build the episode track
    actor: ACT-StageRunner
    aggregate: AGG-EpisodeTrack
    produces: [EVT-EpisodeTrackBuilt]
    description: "episode-track in the episode-track stage, and again after a script change or a timing override; deterministic, no speech recognition"
    rules:
      - An optional audio/music.wav is laid under the whole episode at a fixed gain, ambience at another (episode-track.ts:37-38,224-225)
  - id: CMD-WriteSubtitles
    name: Write subtitles
    actor: ACT-StageRunner
    aggregate: AGG-Script
    produces: [EVT-SubtitlesWritten]
    description: "subtitles in qa-export; cues from the subtitled lines and the sfx lines with on-screen text, in playing order, timed by the effective timing"
    rules:
      - Subtitles are English only today (render.ts:42-43; HS-113)
  - id: CMD-CutLipSyncAudio
    name: Cut lip-sync audio
    actor: ACT-StageRunner
    aggregate: AGG-EpisodeTrack
    produces: [EVT-LipSyncAudioCut]
    description: "audio-segment --character for a lip-sync shot of an episode, from the speaker stem; the lead-only muting of a music video never applies, because an episode's timing has no words"

policies:
  - id: POL-RunNextStage
    name: Run the next autonomous stage
    when: [EVT-StageCompleted, EVT-StageSkipped]
    then: [CMD-StartStage]
    description: "An orchestrator rule (/video-next). It never starts an interactive stage, and with review mode final it stops before qa-export for the final review; no code reads review_mode"
  - id: POL-HardStop
    name: A hard stop fails the stage and halts the pipeline
    when: [EVT-StageStarted]
    then: [CMD-FailStage]
    description: "Hard stop: the budget or batch cap would be exceeded; a real provider's credentials are missing; validation or QA fails after the stage's bounded retries; a user-owned file would be overwritten (timing.overrides.json, project.yaml, an imported take, an imported vocal stem (HS-56), the series canon)"
  - id: POL-AnswerOpenRounds
    name: Open review rounds are answered before the next autonomous stage
    when: [EVT-ReviewRoundSent]
    then: [CMD-AnswerReviewRound]
    description: An orchestrator rule (/video-next "Review rounds"); one fix pass per round, oldest first, after a running and an open interactive stage. With review mode final, the final review is done with review rounds before qa-export
  - id: POL-RebuildQaAfterFixes
    name: Fixes that change the picture reset qa-export
    when: [EVT-ReviewRoundAnswered]
    then: [CMD-ResetStage]
    description: An orchestrator rule (/video-next "Review rounds" step 4), only when the fix pass changed a render; ADR 0032's unconditional wording is a gap
  - id: POL-JudgeEveryAttempt
    name: Every attempt with a verdict target is judged
    when: [EVT-AttemptGenerated]
    then: [CMD-GiveVerdict]
    description: "In the background while the queue run generates on (at most --reviews, default 2, started at once); an item without a verdict target is filed directly"
  - id: POL-ApplyVerdict
    name: The queue run applies every verdict
    when: [EVT-VerdictGiven]
    then: [CMD-ApplyVerdict]
    description: A verdict on a queue attempt files it, requeues it, or leaves the item waiting for a fix
  - id: POL-ValidateEveryStoryboardEdit
    name: Every storyboard edit is validated
    when: [EVT-StoryboardWritten, EVT-StoryboardRevised]
    then: [CMD-ValidateStoryboard]
    description: "The workspace hook runs validate-file on every edit of storyboard.yaml under projects/ and blocks a failing edit (exit 2)"
  - id: POL-RecordPlannedSpend
    name: Every new generation is billed at its planned cost
    when: [EVT-GenerationCompleted]
    then: [CMD-RecordSpend, CMD-RecordCanonSpend]
    description: "runBatch records the planned cost of every result that is not a reuse and saves the state after each item (generate.ts:753-763); the provider's actual charge stays in the adapter's raw result (user and decided 2026-11-21, HS-92)"
  - id: POL-RestartComfyUIOnFailure
    name: A failed local generation restarts ComfyUI before the next try
    when: [EVT-GenerationFailed]
    then: [CMD-RestartComfyUI]
  - id: POL-ValidateEveryScriptEdit
    name: Every script edit is validated
    when: [EVT-ScriptWritten, EVT-ScriptRevised]
    then: [CMD-ValidateScript]
    description: "The workspace hook runs validate-file on every edit of script.yaml and blocks a failing edit; only the script is checked against the canon, because the timing is rebuilt from it (packages/cli/src/validate-file.ts:134-145)"

read_models:
  - id: RM-Status
