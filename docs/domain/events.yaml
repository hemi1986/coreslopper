    rules:
      - Facts come only from the project – spend from state.json, models from the manifest, credits from song.json and the brief (skill rule, ADR 0019)
      - The texts are in the project's language and the brief's tone, one per platform; the Instagram and TikTok captions differ (skill rule; the code refuses identical captions, packages/core/src/release.ts:307-309)
