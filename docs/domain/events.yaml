      - The navigation lists no project and no series; its entries are fixed, in two groups – work (Production, Projects, Release calendar) and library (Characters, Sets, Sounds) – with New, Guide and Refresh set apart (user, 2026-11-27, feature board-redesign; replaces the project list of HS-245)
      - The Projects view lists every project and series, an unreadable one with its error instead of hiding it (ADR 0030; moved from the navigation, user, 2026-11-27)
