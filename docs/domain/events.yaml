    description: "qa <project> in qa-export, beside the render checks (qa.ts:379-381; release-qa.ts:56)"
    rules:
      - A used library sound with an unknown licence, or one that needs a credit without its credit text, is a TODO; it never fails the release (user, 2026-11-22, HS-261)
      - A file whose hash differs from the manifest, a format that is not the current render, a bad WAV, cover or canvas, section tags in lyrics.txt, a missing text file, a broken limit, or an unmarked <ID> fails (the code does this, release-qa.ts:80-221)
      - A gap only the user can close is a TODO, in the release checks and in the upload checks alike; WARN is only for advice (decided 2026-11-22, HS-172; Upload text and Upload data use WARN – gap register)
      - QA expects the assets of the release shape – three thumbnails for a horizontal main video, one for a vertical one; for a short episode one 1080x1920 cover and one TikTok cover, and Thumbnails and Shorts are N/A (user, 2026-11-27, HS-266)

