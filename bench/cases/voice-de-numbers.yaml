id: voice-de-numbers
title: German TTS with written-out numbers
sets:
  - core
focus: "Speech generation: every word present (VoxCPM has dropped words), numbers spoken as written."
source:
  project: episodes
  note: New case; no source take.
operation: generateAudio
role: audio.voice_design
seed: 2077
expectText: Am dreiundzwanzigsten Mai um dreiundzwanzig Uhr fünfzehn kostet der Kredit
  zweitausendsiebenundsiebzig Euro, zum Beispiel für ein gebrauchtes Auto.
prompt: (ruhige, tiefe Männerstimme, deutlich, Nachrichtensprecher)Am dreiundzwanzigsten Mai um dreiundzwanzig
  Uhr fünfzehn kostet der Kredit zweitausendsiebenundsiebzig Euro, zum Beispiel für ein gebrauchtes Auto.
rubric:
  - id: complete
    check: Every word of the text is spoken, none dropped or repeated (use --transcribe for the word error rate).
    weight: 3
  - id: numbers
    check: The written-out numbers are spoken correctly with natural stress.
    weight: 2
  - id: voice
    check: Calm, deep, clear male voice as described.
  - id: clean
    check: No artifacts, clicks, or music.
