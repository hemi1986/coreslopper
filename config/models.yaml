# Model roles used by the generation adapter.
#
# Each role has a base provider (fal.ai unless stated otherwise) and optional
# `alternatives` for other providers. When a project selects higgsfield, the
# adapter uses `alternatives.higgsfield` instead of the fal.ai slug.
#
# These are planning estimates. Before a paid run, verify the exact model slug
# and price at https://fal.ai or https://console.higgsfield.ai and update this
# file. The estimator refuses to run a paid batch when a role has no pricing
# entry for the selected provider.
#
# Higgsfield adapter options (stripped before the request is sent):
#   send_seed: true            send the generation seed to models that support it
#   send_negative_prompt: true send negative_prompt to models that support it
#   reference_field: <name>    body field for uploaded edit references
#   end_reference_field: <name> body field for the end frame (firstLastFrameToVideo)
#
# Clip length (fal.ai and Higgsfield video roles): a batch item's
# `durationSeconds` wins and is rounded up to whole seconds; `params.duration`
# is only the fallback. Adapter options, stripped before the request is sent:
#   min_duration: 3            raise shorter requests to the model's minimum
#   durations: [5, 10]         snap to the next allowed length
#
# ComfyUI (local; providers.image / video / lipsync / audio: comfyui): `model`
# is the name of a workflow exported with "Export (API)" into
# comfyui/workflows/<model>.json. Local runs cost nothing, so comfyui entries
# need no pricing. Adapter params:
#   fps: 24            frame rate the workflow renders at (sets cs_fps if present)
#   frame_step: 8      round frame counts to step*n+1 (LTX needs 8n+1)
#   size_multiple: 32  round width/height to a multiple (LTX needs 32)
#   size_scale: 0.5    fraction of the output size for workflows that upscale the latent
#   megapixels: 1      scale the target size to this many megapixels, keeping the aspect
#   width/height       override the project's master size
#   audio_offset: 0    start of the driving audio in seconds (cs_audio_start)
#   lyrics: "..."      lyrics for music workflows (cs_lyrics); empty means none
#   node_inputs        {"<node title or id>.<input>": value} for anything else
# See comfyui/README.md for the node titles.
version: 1
last_verified: "2026-11-08 (planning estimates; verify before paid use)"

roles:
  image.character_sheet:
    provider: fal
    model: google/nano-banana-2.1/edit
    params:
      num_images: 1
      output_format: png
      resolution: 2K
    pricing:
      unit: image
      usd: 0.15
    notes: Multi-reference character sheets. Requires reference images; text-only prompts are rejected.
    alternatives:
      higgsfield:
        model: alibaba/qwen-image-3/edit
        params:
          resolution: 2k
          aspect_ratio: 1:1
          prompt_extend: false
          enable_thinking: false
          reference_field: image_urls
        pricing:
          unit: image
          usd: 0.03
        notes: One to three reference images. Verify the current Qwen edit price.
      comfyui:
        model: qwen-edit
        notes: Local Qwen Image 2.1 Turbo edit. The first reference sets the output size; up to 16 references.
  image.keyframe:
    provider: fal
    model: fal-ai/flux-2-pro
    params:
      num_images: 1
      output_format: png
      resolution: 1080p
    pricing:
      unit: image
      usd: 0.05
    notes: Hero keyframes and look development.
    alternatives:
      higgsfield:
        model: higgsfield-ai/soul/v2/standard
        params:
          resolution: 1080p
          aspect_ratio: 16:9
          enhance_prompt: false
          batch_size: 1
          send_seed: true
          reference_field: image_reference_url
        pricing:
          unit: image
          usd: 0.006
        notes: Soul 2 text-to-image. Planning estimate for 1080p.
      comfyui:
        model: qwen-t2i
        params:
          megapixels: 1.5
          size_multiple: 16
        notes: Local Qwen Image 2.1 Turbo, about 1.5 MP in the master aspect.
  image.edit:
    provider: fal
    model: fal-ai/flux-2-pro/edit
    params:
      num_images: 1
      output_format: png
    pricing:
      unit: image
      usd: 0.05
    notes: Reference-preserving edits.
    alternatives:
      higgsfield:
        model: alibaba/qwen-image-3/edit
        params:
          resolution: 2k
          aspect_ratio: 16:9
          prompt_extend: false
          enable_thinking: false
          send_seed: true
          reference_field: image_urls
        pricing:
          unit: image
          usd: 0.03
        notes: Up to three reference images. Verify the current Qwen edit price.
      comfyui:
        model: qwen-edit
        notes: Local Qwen Image 2.1 Turbo edit. The first reference is the image to edit.
  image.keyframe.budget:
    provider: fal
    model: fal-ai/flux-2
    params:
      num_images: 1
      output_format: png
    pricing:
      unit: image
      usd: 0.03
    notes: Cheaper drafts and background stills.
    alternatives:
      higgsfield:
        model: higgsfield-ai/soul/v2/standard
        params:
          resolution: 720p
          aspect_ratio: 16:9
          enhance_prompt: false
          batch_size: 1
          send_seed: true
          reference_field: image_reference_url
        pricing:
          unit: image
          usd: 0.0032
        notes: Soul 2 at 720p. Planning estimate.
      comfyui:
        model: qwen-t2i
        params:
          megapixels: 1
          size_multiple: 16
        notes: Local Qwen Image 2.1 Turbo at about 1 MP.
  image.background_removal:
    provider: comfyui
    model: qwen-bg-remove
    notes: >-
      editImage with one reference: cut a character or prop out for layering in
      Remotion. Prompt e.g. "Remove the background, and output a PNG image".
      Local Qwen workflow only.
    alternatives: {}

  video.image_to_video.quality:
    provider: fal
    model: kling/v4/image-to-video
    params:
      duration: 5
      resolution: 1080p
      reference_field: start_image_url
    pricing:
      unit: second
      usd: 0.17
    maxDuration: 30
    notes: 3-30 s, optional end frame for frame chaining. Kling v4 has no audio switch and may return clips with sound; MediaLayer mutes clips, so the song stays the only audio source.
    alternatives:
      higgsfield:
        model: kling-video/v3.0/std/image-to-video
        params:
          duration: 5
          min_duration: 3
          sound: "off"
          cfg_scale: 0.5
        pricing:
          unit: second
          usd: 0.063
        maxDuration: 15
        notes: >-
          Kling 3.0 Standard. Output is 1280x720 at 24 fps (observed 2026-11-09), so it is
          upscaled in a 1080p master; use the Pro variant for native 1080p. Verify the
          current price and duration limit.
      comfyui:
        model: ltx-av
        params:
          fps: 24
          frame_step: 8
          size_multiple: 32
          size_scale: 0.5
        maxDuration: 10
        notes: >-
          Local LTX 2.5 audio-video workflow in image-to-video mode (custom audio
          off). Set models.<role>.model to ltx-i2v to keep a plain LTX i2v
          workflow. Duration limit depends on VRAM.
  video.image_to_video.fast:
    provider: fal
    model: kling/v4/flash/image-to-video
    params:
      duration: 5
      resolution: 720p
      reference_field: start_image_url
    pricing:
      unit: second
      usd: 0.08
    maxDuration: 20
    notes: Cheap drafts and B-roll.
    alternatives:
      higgsfield:
        model: kling-video/v2.5-turbo/standard/image-to-video
        params:
          duration: 5
          durations: [5, 10]
        pricing:
          unit: second
          usd: 0.042
        maxDuration: 10
        notes: Kling 2.5 Turbo Standard. 5 s or 10 s only.
      comfyui:
        model: ltx-av
        params:
          fps: 24
          frame_step: 8
          size_multiple: 32
          size_scale: 0.5
        maxDuration: 10
        notes: >-
          Local LTX 2.5 audio-video workflow in image-to-video mode (custom audio
          off). Set models.<role>.model to ltx-i2v to keep a plain LTX i2v
          workflow. Duration limit depends on VRAM.
  video.image_to_video.premium:
    provider: fal
    model: bytedance/seedance-2.5/us/image-to-video
    params:
      duration: 5
      resolution: 1080p
      generate_audio: false
    pricing:
      unit: second
      usd: 0.30
    maxDuration: 30
    notes: Hero shots only.
    alternatives:
      higgsfield:
        model: bytedance/seedance-2.5/image-to-video
        params:
          duration: 5
          resolution: 1080p
          generate_audio: false
        pricing:
          unit: second
          usd: 0.207
        maxDuration: 30
        notes: Seedance 2.5 list price at 1080p; discounts may lower it.
      comfyui:
        model: ltx-av
        params:
          fps: 24
          frame_step: 8
          size_multiple: 32
          size_scale: 0.5
        maxDuration: 10
        notes: >-
          Local LTX 2.5 audio-video workflow in image-to-video mode (custom audio
          off). Set models.<role>.model to ltx-i2v to keep a plain LTX i2v
          workflow. Duration limit depends on VRAM.
  video.image_to_video.budget:
    provider: fal
    model: alibaba/wan-3.0/image-to-video
    params:
      duration: 5
      resolution: 720p
      generate_audio: false
    pricing:
      unit: second
      usd: 0.06
    notes: Lowest-cost motion pass.
    alternatives:
      higgsfield:
        model: alibaba/wan-3.0/image-to-video
        params:
          duration: 5
          resolution: 720p
          aspect_ratio: 16:9
          generate_audio: false
          send_seed: true
        pricing:
          unit: second
          usd: 0.05
        maxDuration: 30
        notes: Wan 3.0 at 720p. Planning estimate.
      comfyui:
        model: ltx-av
        params:
          fps: 24
          frame_step: 8
          size_multiple: 32
          size_scale: 0.5
        maxDuration: 10
        notes: >-
          Local LTX 2.5 audio-video workflow in image-to-video mode (custom audio
          off). Set models.<role>.model to ltx-i2v to keep a plain LTX i2v
          workflow. Duration limit depends on VRAM.

  video.premium.veo:
    provider: fal
    model: fal-ai/veo3.1/image-to-video
    params:
      duration: 5
      resolution: 1080p
      generate_audio: false
    pricing:
      unit: second
      usd: 0.40
    maxDuration: 8
    notes: Expensive hero fallback; verify the current slug and price.
    alternatives:
      higgsfield:
        model: veo3.1/fast/image-to-video
        params:
          duration: 4
          durations: [4, 6, 8]
          resolution: 1080p
          aspect_ratio: 16:9
          generate_audio: false
        pricing:
          unit: second
          usd: 0.12
        maxDuration: 8
        notes: Veo 3.1 Fast supports 4, 6, or 8 second clips.
      comfyui:
        model: ltx-av
        params:
          fps: 24
          frame_step: 8
          size_multiple: 32
          size_scale: 0.5
        maxDuration: 10
        notes: >-
          Local LTX 2.5 audio-video workflow in image-to-video mode (custom audio
          off). Set models.<role>.model to ltx-i2v to keep a plain LTX i2v
          workflow. Duration limit depends on VRAM.

  video.text_to_video:
    provider: comfyui
    model: ltx-t2v
    params:
      fps: 24
      frame_step: 8
      size_multiple: 32
    maxDuration: 10
    notes: >-
      Text-to-video for abstract B-roll and atmospheres without a keyframe. Local
      LTX workflow by default. Do not use it for character shots; they need a
      reference frame. Add alternatives.fal (model slug and pricing) to run it in
      the cloud.
    alternatives: {}
  video.first_last_frame:
    provider: comfyui
    model: ltx-flf2v
    params:
      fps: 24
      frame_step: 8
      size_multiple: 32
    maxDuration: 10
    notes: >-
      Animate between a start and an end keyframe (firstLastFrameToVideo). Local
      LTX workflow by default. A cloud alternative needs end_reference_field set
      to the model's end-frame field.
    alternatives: {}

  video.lipsync:
    provider: fal
    model: fal-ai/bytedance/omnihuman/v1.5
    params:
      resolution: 1080p
    pricing:
      unit: second
      usd: 0.16
    maxDuration: 30
    notes: >-
      Image + audio -> singing/talking clip (OmniHuman 1.5). Billed per second of
      driving audio. fal docs list $0.14/s (2026-11-08); third-party pages say
      $0.16/s, so the estimate is conservative. Audio max 30 s at 1080p.
      Higgsfield has no lip-sync adapter yet; set providers.lipsync to fal.
    alternatives:
      comfyui:
        model: ltx-av
        params:
          fps: 24
          frame_step: 8
          size_multiple: 32
          size_scale: 0.5
        maxDuration: 10
        notes: >-
          Local LTX 2.5 with custom audio on (providers.lipsync: comfyui). The
          clip length follows the vocal segment; split longer lines. Prompt the
          singing explicitly ("sings the supplied vocal audio with accurate lip
          sync").

  audio.music:
    provider: comfyui
    model: music-minimax
    maxDuration: 360
    notes: >-
      generateAudio: a full track with vocals from a caption (prompt) and
      params.lyrics; durationSeconds is the maximum length. For teasers,
      intros, or demo tracks only; a video's song is always supplied by the user.
    alternatives: {}
  audio.sfx:
    provider: comfyui
    model: audio-stable
    maxDuration: 180
    notes: >-
      generateAudio: instrumentals, risers, stingers, and sound effects (Stable
      Audio 3 Medium). The workflow rewrites the prompt with its own LLM first.
    alternatives: {}
