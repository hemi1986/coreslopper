    aggregate: AGG-TakeRegistry
    data: [Script line, Duration, Text hash, File hash]
    description: "Speech through audio.voice with the speaker's reference voice, effects through audio.sfx, converted to 48 kHz mono WAV in audio/lines/<line-id>.wav (packages/cli/src/voice-track.ts:52-200)"
  - id: EVT-AmbienceGenerated
