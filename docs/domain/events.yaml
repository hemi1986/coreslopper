    rules:
      - A failed install is a warning; non-interactive init sets exit code 1 when the install was wanted and failed (the code does this, init-command.ts:163; init.ts:326-337)
  - id: CMD-AddBenchCase
    name: Add a bench case
    actor: ACT-BenchSkill
    aggregate: AGG-BenchCase
    produces: [EVT-BenchCaseAdded]
    description: "Copy a case file and fill it from a scene that once broke or was hard (SKILL.md, Adding a case)"
    rules:
      - The focus names the failure in one sentence; 3-6 rubric criteria each catch one way the scene fails, weighted by what the failure costs (the skill says so, SKILL.md)
      - bench list validates the case, then bench import fetches its fixtures (the skill says so, SKILL.md)
  - id: CMD-AddBenchTarget
    name: Add a bench target
    actor: ACT-BenchSkill
    produces: [EVT-BenchTargetAdded]
    description: "A new workflow, checkpoint, server or paid model becomes one target in bench/targets.yaml; config/models.yaml stays untouched until a bench shows the switch is worth it (ADR 0020; SKILL.md step 1)"
    rules:
      - A target lists at least one operation; comfyui_url and comfyui_workflows_dir only for a ComfyUI target; the only swap is as referenceToVideo (the code does this, core/src/bench.ts:139,157-160)
      - A paid model without a price in config/models.yaml carries its pricing (the skill says so, SKILL.md step 1)
      - The current default is always a target of the comparison, as the baseline (the skill says so, SKILL.md step 1)
  - id: CMD-ImportBenchFixtures
    name: Import the bench fixtures
    actor: ACT-BenchSkill
    produces: [EVT-BenchFixturesImported]
    description: "bench import [--from <workspace>] [--cases <ids>] [--force] (bench.ts:170-211; index.ts:1394-1405)"
    rules:
      - The source is the workspace's own projects; --from names another workspace or its projects/ folder (the code does this, bench.ts:172; core/src/bench.ts:261-266; the help text says "this repository" – gap register)
      - An existing fixture is kept unless --force (the code does this, bench.ts:180-186)
  - id: CMD-RunBench
    name: Run the bench
    actor: ACT-BenchSkill
    aggregate: AGG-BenchRun
    produces: [EVT-BenchRunPlanned, EVT-BenchRunRefusedOverBudget, EVT-BenchResultRecorded, EVT-BenchResultRefused, EVT-BenchResultFailed, EVT-BenchResultSkipped, EVT-BenchSpendRecorded]
    description: "bench run --targets <a,b> [--set|--cases] [--seeds n] [--repeat] [--fresh] [--transcribe] [--id] [--dry-run] (bench.ts:495-705; index.ts:1407-1447)"
    rules:
      - Every input fixture of the selected cases is present before anything runs; a missing known good result is allowed (the code does this, bench.ts:512-521)
      - Params merge as role defaults, then case params, then target params; the target wins (the code does this, bench.ts:301-330)
      - A remote server's URL, --fresh's invocation and --repeat's second render each get their own cache key; otherwise the bench shares the workspace's generation cache (the code does this, bench.ts:617-625,678; generate.ts)
      - --repeat renders the first seed a second time without a cached result in the same invocation and compares the bytes (decided 2026-11-22, HS-229; the second render is cached across invocations – gap register)
      - A dry run lists the plan and its estimate also when the estimate exceeds the budget, and says so (decided 2026-11-22, HS-230; it throws – gap register)
      - A refusal is what the provider marks as a content refusal; a configuration error is never a refusal (decided 2026-11-22, HS-231; a pattern over the message – gap register)
      - VRAM is sampled from ComfyUI's /system_stats every 1.5 s and kept only for a fresh result (the code does this, bench.ts:90-118,645-646)
  - id: CMD-ScoreBenchCase
    name: Score a bench case
    actor: ACT-ArtDirector
    produces: [EVT-BenchCaseScored]
    description: "One art director per case, in parallel, scores every ok and refused result of the case against its rubric (SKILL.md step 6; scoring.md)"
    rules:
      - Per criterion 2 pass, 1 weak, 0 fail; a refusal scores 0 on every criterion; an error is not scored (the skill says so, scoring.md)
      - Pass when no criterion is 0 and the weighted score is at least 80 %; fail when a criterion of weight 2 or more is 0 or the score is below 50 %; otherwise weak (the skill says so, scoring.md; "weighted criterion" read as every criterion, HS-232)
      - The rubric replaces the art director's usual axes, the real-person rule included (decided 2026-11-22, HS-238; art-director.md says "instead of these axes" without naming it – gap register)
  - id: CMD-BuildBenchReport
