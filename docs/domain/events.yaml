  - id: CMD-InstallTimer
    name: Install the timer
    actor: ACT-User
    produces: [EVT-TimerInstalled]
    description: "release-timer show|install|remove|status [--every], for a computer without the board container (release-timer.ts:131-173; ADR 0031)"
    rules:
      - Install it again after a Node.js upgrade or a moved workspace – the script puts the installing Node.js on PATH (the code does this, release-timer.ts:48-60)
  - id: CMD-CreateWorkspace
    name: Create a workspace
    actor: ACT-User
    aggregate: AGG-WorkspaceMarker
    produces: [EVT-WorkspaceCreated, EVT-ProviderKeyStored, EVT-ToolInstalled, EVT-DependenciesInstalled]
    description: "npx coreslopper init [dir], interactive as onboarding on a terminal, or with --yes and flags (packages/cli/src/npx.ts:63-100; init-command.ts:62-164; onboarding.ts:353-536)"
    rules:
      - The target is a new or empty directory – not the filesystem root, the home directory, the package itself, the runtime or the upstream repository; --force merges into a non-empty one and overwrites what the runtime ships (the code does this, init.ts:280-304,111-128)
      - Provider keys are checked but never block; the first project needs a budget of at least $5 and a valid slug (the code does this, onboarding.ts:446-465; tools.ts:303-382)
      - Tools are installed only after the user confirmed the workspace (decided 2026-11-22, HS-217; installed before the last question – gap register)
  - id: CMD-UpdateWorkspace
    name: Update the workspace
    actor: ACT-User
    aggregate: AGG-WorkspaceMarker
    produces: [EVT-WorkspaceUpdated, EVT-ConflictCopyWritten]
    description: "npx coreslopper@latest update [dir] [--dry-run] [--force] [--no-install], from the npx CLI only (npx.ts:102-127; update.ts:192-353; ADR 0012)"
    rules:
      - Commit first, so git diff shows what the update changed – update warns about uncommitted changes but goes on (the code does this, update.ts:203,298-300; docs/onboarding.md)
      - A workspace without a baseline treats every differing file as a conflict; a plain update records the baseline (the code does this, update.ts:301-305,308)
      - Say when an update changed docker/ and the board image needs docker compose build (decided 2026-11-22, HS-212; only docs/board.md says it – gap register)
      - Name the workspace's own changes to workflow files, so the user can carry them upstream (decided 2026-11-22, HS-210; only counted – gap register)
  - id: CMD-MigrateLayout
    name: Migrate the layout
    actor: ACT-User
