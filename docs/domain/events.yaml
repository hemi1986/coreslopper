  - id: RM-BoardNavigation
    name: Board navigation
    fed_by: [EVT-ProjectCreated, EVT-StageStarted, EVT-StageCompleted, EVT-StageFailed, EVT-ReleaseCalendarPlanned, EVT-CalendarEventMarkedDone, EVT-BoardRefreshed]
