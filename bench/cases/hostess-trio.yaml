seed: 40012
prompt: "Replace this plain grey canvas with a new wide 16:9 photo, using the reference images only for the
  people's identity, face and costume: medium shot, camera at chest height, framed from mid-thigh up, faces
  clearly visible and fairly large, three different adult women aged 27 to 33 with clearly different faces:
  one with a round face and freckles, one with a long narrow face and strong dark brows, one with high
  cheekbones and a wider mouth, all in the identical uniform from the reference image: conference-blue pillbox
  hat sitting on top of the head in front of the platinum-blonde high bun, fitted conference-blue uniform
  jacket with stand collar and gold buttons, plain blank white satin sash running from the left shoulder down
  to the right hip on every woman, conference-blue skirt; standing in a tight row with small gaps, each
  holding a plain blank white sign board down at her side in one hand, on the dark conference stage of a big
  convention hall with a huge blank projector screen, a lectern with a microphone, rows of chairs and cold
  white-blue spot lights, light haze in the projector beam, group in the centre third of the frame. Natural
  relaxed eyes looking toward the camera, bored half-smiles. Tasteful, fully clothed, not sexual. Photoreal,
  cinematic music-video still, natural anatomy, natural hands with five fingers each, hands clearly visible
  and separated, no text, no letters, no logos. Main subject centred in the middle third of the frame so the
  shot survives a vertical 9:16 centre crop. All signs, screens, boards, badges and papers are plain and blank
  with no writing."
