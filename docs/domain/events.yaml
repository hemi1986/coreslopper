    status: resolved
    resolution: "Keep the rule (ADR 0016 stands): a sound line starts after the line before it, and a shot lands on the hit through the cue anchor (line:<id>:cue). An overlapping sound is a later story if punch sounds come too late (user, 2026-11-22)"
  - id: HS-258
    question: "A meme reuses the script, the take registry and the episode track, which belong to the Series context – but a meme is not part of a series. Does the Series context grow into a context for every scripted project, or do script and track move to their own context?"
