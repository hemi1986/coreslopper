hotspots:
  - id: HS-1
    question: "'Production phase' (setup/ready/running/failed/done) is a derived project status, but the glossary lists 'phase' under Avoid for Stage, and 'setup' is both a stage ID and a phase. Which word is the domain term?"
    refs: [RM-ProductionView, RM-NextAction]
    status: resolved
    resolution: "Production Phase is its own term: the coarse state of a whole project, derived from its stage states, shown on the board. 'phase' stays avoided for a stage. The phase value setup (an interactive stage is open) beside the stage ID setup is a gap candidate; nothing is renamed now. (user, 2026-11-21)"
  - id: HS-2
    question: "The stage's attempt counter clashes with the glossary's Attempt (a version of a queue item), and the next action reason 'retry' uses a word the glossary avoids. Which words apply to a stage?"
    refs: [EVT-StageStarted, RM-NextAction]
    status: resolved
    resolution: "Stage Attempt: one start of a stage; a failed stage resumes with a new stage attempt. The word for starting a failed stage again is resume; the code's next-action reason 'retry' is a gap candidate. Attempt alone stays the queue item version. (user, 2026-11-21)"
  - id: HS-3
    question: "Skipping a stage has a command but no actor and no documented reason. Who skips a stage, and when?"
    refs: [CMD-SkipStage, EVT-StageSkipped]
    status: resolved
    resolution: "Stage Skip is a manual decision of the user for a stage the project does not need; no skill or command skips (ADR 0013). Where the reason is stored is an implementation detail. (user, 2026-11-21)"
  - id: HS-4
    question: "Hard stop has three conditions in the glossary, four in docs/pipeline.md and docs/architecture.md, and six in /video-next. What is the one definition?"
    refs: [POL-HardStop]
    status: resolved
    resolution: "Four conditions: budget or batch cap would be exceeded; a real provider's credentials are missing; validation or QA fails after the stage's bounded retries; a user-owned file would be overwritten (timing.overrides.json, project.yaml, an imported take, the series canon). Divergent lists are gap candidates. (user, 2026-11-21)"
  - id: HS-5
    question: "The budget lives in project.yaml (budget_usd) and in state.json (budget.totalUsd), kept equal by validate-file. Which one is the source of truth?"
    refs: [AGG-Project]
    status: resolved
    resolution: "budget_usd in project.yaml is the source; state.json budget.totalUsd is a copy that must stay equal. No command changes a budget; that is a gap candidate. (user, 2026-11-21)"
  - id: HS-6
    question: "The board wizard completes the setup stage (finishSetup, board-wizard.ts:344), while ADR 0030 calls the production view read-only. Is the board a sanctioned writer of project state?"
    refs: [CMD-CompleteStage, AGG-Project]
    status: resolved
    resolution: "The board wizard is a sanctioned writer, for completing the setup stage only. Recorded in ADR 0037 (proposed), which amends ADR 0030. (user, 2026-11-21)"
  - id: HS-7
    question: "Both /video-next and seven stage skills call stage-done for the same stage. Who completes a stage: the orchestrator or the stage runner?"
    refs: [CMD-CompleteStage]
    status: resolved
    resolution: "The orchestrator completes autonomous stages; the setup skill (or the board wizard for setup) completes interactive stages. The stage-done lines in stage skills are drift, a gap candidate. (user, 2026-11-21)"
  - id: HS-8
    question: "review_mode: final is in the schema and the glossary, but only /video-next's instructions act on it, and new always writes auto. A supported setting, an instruction-only convention, or legacy?"
    refs: [EVT-ProjectCreated]
    status: resolved
    resolution: "A supported setting, enforced as an orchestrator rule (POL-RunNextStage): the pipeline stops before qa-export. That next action and board ignore it is a gap candidate. (user, 2026-11-21)"
  - id: HS-9
    question: "budget.reservedUsd is subtracted and shown as 'reserved', but nothing ever reserves money. Planned or dead?"
    refs: [AGG-Project, RM-ProductionView]
    status: resolved
    resolution: "Dead. Not part of the model; a removal candidate in the gap register. (user, 2026-11-21)"
  - id: HS-10
    question: "workspace/AGENTS.md says state.json tracks input hashes for resumability; inputHash can be stored but nothing passes or compares it. Is stale-stage detection part of the model?"
    refs: [EVT-StageCompleted]
    status: resolved
    resolution: "Stale-stage detection is not part of the model today. A stage reset is always an explicit decision. The claim in workspace/AGENTS.md is a contradiction for the gap register; whether detection is wanted is decided later. (user, 2026-11-21)"
  - id: HS-11
    question: "No transition is guarded: done → running, pending → done and starting an interactive stage are all accepted. Which transitions are legal?"
    refs: [AGG-Project, CMD-StartStage, CMD-CompleteStage]
    status: resolved
    resolution: "Start: autonomous stages only, from pending or failed, after every earlier stage is done or skipped. Complete (orchestrator) and fail: from running. Complete interactive stage: from pending or failed. Skip: from pending or failed. The code enforces none of it – gap register. (user, 2026-11-21)"
  - id: HS-12
    question: "Stage reset accepts any status (also running) and does not touch later stages, while the glossary limits it to done, failed or skipped stages. What does a reset do?"
    refs: [CMD-ResetStage, EVT-StageReset]
    status: resolved
    resolution: "A reset refuses a running stage and returns every later done or skipped stage to pending as well; the generation cache keeps unchanged shots cheap. The code resets one stage of any status – gap register. (user, 2026-11-21)"
  - id: HS-13
    question: "When every stage is done but no release exists, the board tells the user to run /video-next for qa-export, while status says done and /video-next stops. What is the next action?"
    refs: [RM-NextAction]
    status: resolved
    resolution: "The release folder is an output of qa-export, so the next action is: reset qa-export, then /video-next. The board's current advice is a gap. (user, 2026-11-21)"
  - id: HS-14
    question: "The next action puts an open interactive stage before open review rounds; /video-next answers review rounds before it checks for an interactive stage. Which comes first?"
    refs: [RM-NextAction]
    status: resolved
    resolution: "An open interactive stage comes before open review rounds, as projectNextAction and ADR 0030 say. /video-next answering rounds first is a gap. (user, 2026-11-21)"
  - id: HS-15
    question: "state.json has no write lock; a long generation batch saves after each item from the state it loaded at the start and can overwrite a parallel stage-* or spend write. Must project state be safe against concurrent writers?"
    refs: [AGG-Project, CMD-RecordSpend]
    status: resolved
    resolution: "Yes: no writer loses another writer's change and no recorded spend is lost (aggregate invariant). The missing lock and the stale state in long batches are a high-priority gap. (user, 2026-11-21)"
  - id: HS-16
    question: "The desktop review player deletes sent notes, takes no lock, rewrites the whole notes file from memory, and rounds frames differently than the board. What is its role: a full second writer bound by the same rules, a fallback with fewer rights, or retired?"
    refs: [AGG-ProjectReview, CMD-DeleteReviewNote]
    status: resolved
    resolution: "A fallback writer bound by the same invariants as the board: sent notes stay unchanged, no other writer's change is lost, frame = floor(seconds × format fps). Today's deviations are gap candidates, data loss with high priority. (user, 2026-11-21)"
  - id: HS-17
    question: "Desktop-player notes reach the agent with the next round (docs/board.md) or when the user asks in chat (assembly-render). Which is the one way?"
    refs: [CMD-SendReviewRound]
    status: resolved
    resolution: "One way: desktop-player notes become draft notes in the board and go out with the next round. The chat path in assembly-render is a gap. (user, 2026-11-21)"
  - id: HS-18
    question: "A round counts as answered once any replies file exists, even an incomplete one; completeness is checked only by the hook after the write. What answers a round?"
    refs: [EVT-ReviewRoundAnswered, RM-OpenReviewRounds]
    status: resolved
    resolution: "A round is answered only by a valid replies file that answers every note of it and no other; an invalid one leaves it open. Board and status count open rounds the same way; an unreadable round is open or an error, never nothing open. Gap register. (user, 2026-11-21)"
  - id: HS-19
    question: "After a reply 'question' or 'not-fixed' the round is closed and nothing is left open. Does the user continue only with a new note in a new round?"
    refs: [EVT-ReviewRoundAnswered]
    status: resolved
    resolution: "An answered round stays answered; there is no reopening. The user follows up with a new note in the next round. (user, 2026-11-21)"
  - id: HS-20
    question: "ADR 0032 resets qa-export after every fixed round; /video-next only when the fixes changed the picture. Which?"
    refs: [POL-RebuildQaAfterFixes]
    status: resolved
    resolution: "qa-export is reset only when the fix pass changed a render (/video-next's rule). ADR 0032's unconditional wording is a gap; the ADR is not edited. (user, 2026-11-21)"
  - id: HS-21
    question: "The UI, glossary and ADR say 'send'; the code says submit (submitRound, /submit, submitted_at). Which is the domain verb?"
    refs: [CMD-SendReviewRound]
    status: resolved
    resolution: "The domain verb is send: a round is sent, a note is sent. 'submit' in code is a gap (low); the glossary avoids 'submission'. (user, 2026-11-21)"
  - id: HS-22
    question: "'review' means the user's review of renders, the art director's verdicts (queue state 'reviewing', 'Art-director reviews', assets/review/verdicts.jsonl), and the review/ folder that also holds release and progress files. Which meanings keep the word?"
    refs: [BC-Review]
    status: resolved
    resolution: "'Review' in the domain is only the user's review of renders (BC-Review). The art director gives verdicts; its 'review' words are a gap for the art-director slice. The review/ folder is file layout, not a term; renaming it needs an ADR and is not planned. In BC-Review an unsent note is a draft note, unrelated to the publishing Draft. (user, 2026-11-21)"
  - id: HS-23
    question: "The fix work for a round is 'review-fix' (a runner label, no stage in state) and 'fix pass' (assembly-render). Is it a domain concept, and under which name?"
    refs: [CMD-AnswerReviewRound, POL-AnswerOpenRounds]
    status: resolved
    resolution: "Fix Pass: the agent's work on one review round, ending with the replies; review-fix is only the runner's label, not a stage. (user, 2026-11-21)"
  - id: HS-24
    question: "The consistency boundary in code is the board's lock over notes and rounds; the agent writes replies without it. Are the replies part of the same aggregate?"
    refs: [AGG-ProjectReview]
    status: resolved
    resolution: "Round, replies and notes are one aggregate (AGG-ProjectReview, as-is). Replies without the lock are fine as long as each round gets exactly one fix pass (invariant). (user, 2026-11-21)"
  - id: HS-25
    question: "'The agent never writes notes or rounds' is an instruction only; the hook validates replies and ignores notes and round files. Must it be enforced?"
    refs: [AGG-ProjectReview]
    status: resolved
    resolution: "Notes and rounds belong to the user (invariant); the cheapest enforcement is the workspace hook blocking agent edits to review/notes/ and review/rounds/<NNN>.json – product code, so a gap candidate. (user, 2026-11-21)"
  - id: HS-26
    question: "A note knows its render by file name only; a re-render under the same name moves old notes and rounds onto different frames without a trace. Must a note record which render version it was made on?"
    refs: [EVT-ReviewNoteAdded, EVT-ReviewRoundSent]
    status: resolved
    resolution: "Yes: a round records the version of its render at sending, so the board can mark notes on a since-changed render. Missing today – gap register. (user, 2026-11-21)"
  - id: HS-27
    question: "Review mode final stops for 'one final human review' before qa-export. Is that review done with review rounds?"
    refs: [POL-AnswerOpenRounds]
    status: resolved
    resolution: "Yes: the final review is the user's review in the board, with or without a round; the user releases qa-export with /video-next <slug> --stage qa-export. The missing release and the repeating stop are a gap. (user, 2026-11-21)"
  - id: HS-28
    question: "ADR 0032 speaks of offsetting notes on Shorts, but the board lists only renders/ top-level files, so Shorts can be reviewed only with the desktop player. Are Shorts reviewed?"
    refs: [CMD-AddReviewNote]
    status: resolved
    resolution: "Shorts are not reviewed in the board; the 9:16 render they are cut from is. Intended as is; the desktop player covers special cases. (user, 2026-11-21)"
  - id: HS-29
    question: "What is the context called – 'Generation queue' (the glossary term and the board's word) or 'Art direction' (the job: get every generated asset approved)?"
    refs: [BC-GenerationQueue]
    status: resolved
