[project]
name = "coreslopper-review-player"
version = "0.1.0"
description = "Frame-accurate review player for coreslopper renders: play, step, and write review notes per frame."
requires-python = ">=3.12"
dependencies = [
  "av>=14.0",
  "numpy>=2.0",
  "pygame-ce>=2.5",
  "sounddevice>=0.5",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
