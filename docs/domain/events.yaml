      - A refresh never restarts a playing video and never discards what the user is typing – it keeps a view with a playing video or an edited field and reloads only the navigation (decided 2026-11-22, HS-244; the code does this, app.js busy)
  - id: CMD-OpenBoardFile
    name: Open a file on the board
    actor: ACT-User
    produces: [EVT-BoardFileServed, EVT-BoardFileRefused]
    description: "GET /files/<project>/<path>, /series-files/<series>/<path>, /media/<project>/<path> (the release folder) or /library-files/<id>/<name>; the views embed them as images, players and links (release-board.ts:128-151,259-266,402-411,503)"
    rules:
      - A project serves only renders/, review/, assets/, characters/, sets/, props/ and its written documents; a series canon its characters/, sets/, props/, assets/, review/ and bible.md; never project.yaml, state.json or a dot file (the code does this, release-board.ts:66-68,402-408; tests/board-production.test.ts; ADR 0030)
