      - Instagram also needs FAL_KEY, because Instagram fetches its files from a public URL (the code does this, packages/cli/src/autopilot-state.ts:87-90)
  - id: CMD-PublishUploads
    name: Publish the uploads
    actor: ACT-User
    aggregate: AGG-PublishLog
    produces: [EVT-PublishPlanned, EVT-VideoUploaded, EVT-UploadFailed]
    description: "publish <project> [--platform] [--only] [--schedule] [--dry-run] [--force] [--mock]: the main video and the Shorts to YouTube, private or scheduled, and the Shorts to TikTok as drafts; a user command, never a stage (index.ts:449-479; ADR 0023). The user posts by hand today (user, 2026-11-22)"
    rules:
      - The upload data, files, platform limits and quota are checked before the first network call (the code does this, publish.ts:267-351)
      - --schedule is at least 15 minutes ahead (the code does this, publish.ts:256)
      - TikTok from the publish command is always an inbox draft (the code does this, index.ts:467-477)
  - id: CMD-RunAutopilotRound
    name: Run an autopilot round
    actor: ACT-Watchdog
    aggregate: AGG-AutopilotRound
    produces: [EVT-AutopilotRoundRun]
    description: "release-run [--project] [--dry-run] [--plan], run by every watchdog round (watch, from the board container or release-timer); stage runners, /video-next and agents never run it (ADR 0029). The user means to run the board container (user, 2026-11-22)"
    rules:
      - A round for a project whose approval does not hold does nothing and says why (the code does this, release-autopilot.ts:251-254)
      - A round leaves a project with distribution internal alone – it posts nothing of it, also with an approval from before it became internal, and its plan lists no event of it (user, 2026-11-22, ST-041)
      - The pending YouTube uploads are read first, so the posts that link to the main video follow in the same round; then the due events, earliest first (the code does this, release-autopilot.ts:256-302)
      - An error in the autopilot does not stop the production scan of the same watchdog round (the code does this, packages/cli/src/production-watch.ts:99-126)
      - "A round leaves a demo production alone as it leaves an internal project: it posts nothing of it and its plan lists no event of it (user, 2026-11-28, feature demo-projects)"
  - id: CMD-PostCalendarEvent
    name: Post a calendar event
    actor: ACT-Watchdog
    aggregate: AGG-AutopilotLog
    produces: [EVT-PostClaimed, EVT-CalendarEventPosted, EVT-CalendarEventUploaded, EVT-PostAttemptFailed, EVT-SpotifyLinkAppended, EVT-MicrositePageDeployed]
    description: "A due event, claimed and acted on by the round: YouTube and TikTok through the publish command's code, X, LinkedIn and Instagram through the post adapters, the links step and the microsite (release-autopilot.ts:345-505)"
    rules:
      - YouTube is scheduled only with youtube_audited and more than 20 minutes ahead, otherwise uploaded private (the code does this, release-autopilot.ts:385)
      - TikTok posts directly with tiktok_direct, otherwise it sends a draft – one switch, read the same way everywhere (decided 2026-11-22, HS-188; TIKTOK_DIRECT_POST is read two ways – gap register)
      - An upload the publish log already has is not uploaded again; the autopilot takes the earlier entry (the code does this, release-autopilot.ts:395; publish.ts:216-227)
      - The X post's price is recorded with the post, and the board shows what a release's posts cost, apart from the generation budget (decided 2026-11-22, HS-192; recorded, never shown – gap register)
  - id: CMD-CheckUploadStatus
