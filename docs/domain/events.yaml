  - id: CMD-BuildReleasePackage
    name: Build the release package
    actor: ACT-StageRunner
    aggregate: AGG-ReleasePackage
    produces: [EVT-ReleasePackageBuilt, EVT-ReleaseRulesBroken, EVT-ReleaseCalendarPlanned]
    description: "release <project> [--no-render] [--canvas-from <time>] [--canvas-seconds <n>] [--replan], in qa-export or by the user; the board runs it without renders and stills after a live URL or an approval (POL-RefreshAfterStatusChange) (packages/cli/src/index.ts:321-334; release.ts:207-447)"
    rules:
      - A project with distribution internal gets no release folder and no release calendar; release says so and exits cleanly, and an earlier folder or calendar is left alone (user, 2026-11-22, ST-036)
      - A meme's release folder holds its one 9:16 video, a 1080x1920 cover and the texts for TikTok, YouTube Shorts and Instagram Reels; no Shorts, WAV, canvas, lyrics or announcement – no announcement images and no announcement in the release calendar (user, 2026-11-22, feature meme)
      - Every used library sound that needs a credit gets its credit text into the platform texts (user, 2026-11-22)
      - A missing or stale format is rendered first; with --no-render it is a TODO (the code does this, release.ts:254-261)
      - The song goes into the folder as deliverable WAV (PCM, at least 44.1 kHz, stereo), converted once when it is not; more than 2 s of silence warns (the code does this, packages/cli/src/release-media.ts:108-192)
      - The canvas is a silent 3–8 s loop from the 9:16 render near the first chorus without lyrics on screen, or a TODO (the code does this, packages/core/src/release.ts:130-165)
      - The announcement, story and feed images are composed from the cover's recipe, again whenever the release day moves – by a full run only (the code does this, release.ts:455-549; HS-171)
      - Text files are laid out from the upload data with chapters, footer, credits and links; a live URL reaches every text that points to the main video, in the folder and on the board alike (decided 2026-11-22, HS-166; only the board fields get it – gap register)
      - The folder's files and the board's posts come from one layout of the release folder and one release context (decided 2026-11-22, HS-175; the layout is spelled in three files, the context twice – gap register)
      - The release shape is derived from the project – music video, meme, episode or short episode – and recorded in the manifest; an episode is a short episode when its master is at least as tall as wide and its episode track lasts at most 180 s (user, 2026-11-27, HS-266)
      - A short episode's folder holds its one master video, one 1080x1920 cover and one 1080x1440 TikTok cover; no main-video thumbnails, Shorts, streaming cover or feed image. Its posts go out on the release day to YouTube Shorts, TikTok, Instagram Reels, X and the microsite (user, 2026-11-27, HS-266)
      - A horizontal episode of at most 180 s keeps its main video and three thumbnails; instead of cut Shorts, its vertical version – the 9:16 render of the whole episode – is its one Short (user, 2026-11-27, HS-266)
      - A vertical episode over 180 s gets one main-video thumbnail; its Shorts are cut from its master (user, 2026-11-27, HS-266)
      - The main video goes to Instagram as a Reel only when it lasts at most 180 s; there is no image post in its place (user, 2026-11-27, feature platform-formats)
      - Once the release status holds a done mark or a live URL, a run whose release shape differs from the manifest's fails and changes nothing (user, 2026-11-27, HS-268)
