    description: "assets/manifest.jsonl of a project or series canon (bench: manifest.jsonl at the bench root), append-only, written only by the generation runner (runner.ts:209-226); the QA checker requires its cost sum to equal the recorded spend (packages/cli/src/qa.ts:230-262)"
