<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">coreslopper example mark</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05d9e8"/>
      <stop offset="100%" stop-color="#ff2a6d"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="#050510"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#ring)" stroke-width="18" filter="url(#glow)"/>
  <path d="M312 180c-28-22-76-20-100 12-28 36-18 92 20 114 30 17 66 10 88-14" fill="none" stroke="#f8f8ff" stroke-width="28" stroke-linecap="round"/>
  <path d="M330 326l58 58" stroke="#f9f002" stroke-width="20" stroke-linecap="round"/>
  <circle cx="330" cy="326" r="14" fill="#f9f002"/>
</svg>
