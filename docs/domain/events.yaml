    resolution: "No. The take in the meme stays current and voice-track only warns that its library sound is gone; a changed library sound makes the take stale and it is copied again (user, 2026-11-22)"
  - id: HS-261
    question: "Meme sounds are often someone else's material. Who decides whether one may be used?"
    refs: [AGG-LibrarySound, CMD-CheckRelease]
    status: resolved
    resolution: "The user. The licence is optional and unknown by default; the release check turns every used sound with an unknown licence, or one that needs a credit, into a TODO and writes the credit text into the platform texts; it never fails the release (user, 2026-11-22)"
  - id: HS-262
    question: "The script's invariant says every scene plays in a set of the canon and every speaker is a character of the canon. A meme has no canon, and its script is written before style-character writes its set bible and the characters it invents. What does a meme's script name as set and speaker when the hook validates it in the script stage – and when is it checked against the bibles?"
    refs: [AGG-Script, CMD-WriteMemeScript, CMD-ValidateScript]
    status: resolved
    resolution: "In the script stage the hook checks speakers and sets of a meme only as valid ids; validate checks them against the character and set bible once style-character is done. No placeholder characters or sets (user, 2026-11-22)"
  - id: HS-263
    question: "A meme gets German subtitles burned in, for German speech. The glossary defines subtitles as the translated text and avoids 'captions'; subtitles are English only today (HS-113, CMD-WriteSubtitles). Is a meme's burned-in text subtitles in the spoken language, and is the subtitle language a project setting or fixed per project kind?"
    refs: [CMD-WriteSubtitles, AGG-Script]
    status: resolved
    resolution: "The burned-in text is subtitles in the spoken language. The subtitle language becomes a project setting (de, en, off): de by default for a meme, en stays the default for an episode (user, 2026-11-22)"
  - id: HS-264
    question: "A meme lasts at most 30 seconds. The episode track checks an episode's length against the series' episode length (HS-114); a meme has no series. Is the 30 seconds a fixed rule of the project kind or a project limit, and is a longer track refused when it is built or only reported by QA?"
    refs: [AGG-EpisodeTrack, CMD-WriteMemeScript]
    status: resolved
    resolution: "A fixed rule of the project kind. episode-track refuses a meme track over 30 seconds as a hard stop; the script validation checks only the lengths it already knows (pauses, sound lengths); the skill estimates while it writes (user, 2026-11-22)"
  - id: HS-265
    question: "The release check writes a used library sound's credit text into the platform texts (HS-261), but no event or field of a library sound carries a credit text – only source and licence. Is the credit part of the licence, a field of its own, or written from source and licence?"
    refs: [AGG-LibrarySound, CMD-CheckRelease]
    status: resolved
    resolution: "A field of its own: an optional credit on the library sound, entered with sound add and sound edit; a licence that asks for attribution without a credit stays a release TODO (user, 2026-11-22)"
  - id: HS-266
    question: "An episode up to 3 minutes is to be released as one Short with no main video. YouTube counts only a square or vertical video up to 3 minutes as a Short; a 16:9 video stays long-form (F12 in docs/research/platform-video-formats.md). When is an episode a short episode, and what do the other episodes get?"
    refs: [CMD-BuildReleasePackage, CMD-PlanReleaseCalendar, AGG-ReleasePackage]
    status: resolved
    resolution: "A short episode has a master at least as tall as wide (9:16, 4:5, 1:1) and an episode track of at most 180 s, derived, not set. One video to YouTube Shorts (series playlist as a checklist line), TikTok, Instagram Reels, X and the microsite; one 9:16 cover and one 3:4 TikTok cover; optional announcement with a teaser from its master. A horizontal episode up to 180 s keeps its main video and posts its whole 9:16 render as its one Short. A vertical episode over 180 s gets one main-video thumbnail and Shorts cut from its master (user, 2026-11-27)"
  - id: HS-267
    question: "The upload data has a story text per Short and for the announcement, but Instagram stories have no text field, and no primary source names a limit for text added to a story (F7 in docs/research/platform-video-formats.md). What remains of the story text?"
    refs: [CMD-WriteUploadData]
    status: resolved
    resolution: "A story has no text of its own. A story that shows a video may carry a caption of at most 120 characters, the limit the user sees in the Instagram app; it is optional and never a TODO. An image story has no text (user, 2026-11-27)"
  - id: HS-268
    question: "The release shape follows the episode's length. A cut after the first posts can move an episode across 180 s, and a new release run would then remove files that posts already used. Does the shape follow the episode or stay?"
    refs: [CMD-BuildReleasePackage, AGG-ReleaseStatus]
    status: resolved
    resolution: "The shape is recorded in the manifest. Until the release status holds a done mark or a live URL it follows the project; after that, a run whose shape differs fails and changes nothing (user, 2026-11-27)"
  - id: HS-269
    question: "Does plain MiniMax H3 (no Pika LoRA) lip-sync a vocal anchored with MiniMaxH3AddGuide at frame 0 well enough to run lipSync on the vast provider?"
    refs: [CMD-RunGenerationBatch, AGG-GpuRental]
    status: resolved
    resolution: "Yes. The ST-070 spike ran three daily-um-9 shots (spoken, shouted, sung) on plain H3 with the vocal anchored at frame 0; the user judged them usable, so lip-sync runs on vast with providers.lipsync: vast (ST-076; user, 2026-11-28)"
  - id: HS-270
    question: "How does a client find the authenticated ComfyUI URL of a new rental through the API – Cloudflare tunnel URL or the mapped port – and does the MiniMax H3 template put ComfyUI behind the portal's token check?"
    refs: [CMD-RentGpu, AGG-GpuRental]
    status: resolved
    resolution: "ComfyUI sits behind the portal's Caddy token check (401 without, 200 with WEB_PASSWORD as bearer). The client reads public_ipaddr and ports from GET /instances/{id}/ and asks the portal (ports 1111/tcp) GET /get-all-quick-tunnels for the HTTPS tunnel URL of localhost:8188 (ST-070, research F11-F12, 2026-11-28)"
  - id: HS-271
    question: "Which template_hash_id, workflow templates, model files and boot time does vast's MiniMax H3 ComfyUI template have?"
    refs: [CMD-RentGpu, EXT-VastAi]
    status: resolved
    resolution: "template_hash_id 6c54167e40e8ceed220393d585126a1c, image vastai/comfy:v0.44.0-cuda-13.2-py312, disk >= 65 GB; three workflows (t2v, i2v with optional last frame, r2v); five model files downloaded at boot; ComfyUI ready after about 11.5 min (ST-070, research F10, F13-F14, 2026-11-28)"

