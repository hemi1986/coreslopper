id: lipsync-alisa
title: Lip-sync "Gefällt mir, gefällt mir, gefällt mir nicht"
sets:
  - core
focus: "A long 6.7 s take with a repeated phrase and a second line: drift over time and rhythm of repeated words."
source:
  project: gefaellt-mir-nicht
  shot: shot-022
  note: Reference from fal OmniHuman 1.5, which got a short prompt without the lyric.
operation: lipSync
role: video.lipsync
seed: 4102
prompt: 'She sings the supplied vocal audio with accurate lip sync, clearly mouthing the German lyrics:
  "Gefällt mir, gefällt mir, gefällt mir nicht. Tausend Herzen auf dem Screen". Every word and syllable is
  articulated visibly. Tight frontal selfie close-up of the same young woman from the input image: short black
  pixie-mullet hair with neon-green streaks, grey-silver cyber face markings under the eyes, silver ear piece,
  black tactical vest, neon magenta and cyan rim light, blurred neon city behind her. Confident, flirty
  energy, small head tilts, natural blinks, no hands in frame, static camera, one continuous take.'
fixtures:
  face:
    from: gefaellt-mir-nicht/assets/image/edit/10795c9b7a91722b-0.png
  vocal:
    from: gefaellt-mir-nicht/assets/audio-segments/shot-022.mp3
  golden:
    from: gefaellt-mir-nicht/assets/video/lipsync/0c3fb7a9b5975f42-0.mp4
inputs:
  references:
    - face
  audio: vocal
golden: golden
frames:
  - 0.05
  - 0.25
  - 0.45
  - 0.65
  - 0.85
  - 0.98
rubric:
  - id: visemes
    check: Each "gefällt mir" is a distinct cycle; "nicht" and "Screen" close the mouth.
    weight: 3
  - id: timing
    check: Mouth stays on the vocal through the whole take, also after 5 s.
    weight: 2
  - id: identity
    check: Face, hair streaks, and face markings hold to the last frame.
    weight: 2
  - id: no-hands
    check: No hands enter the frame.
  - id: camera
    check: The camera does what the prompt says (static means no push-in, zoom, or jump-zoom).
