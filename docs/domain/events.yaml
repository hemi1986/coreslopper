# Event storming model
#
# Single source of truth for events, commands, policies, read models, aggregates and bounded contexts.
# Format: .claude/skills/event-storming/templates/events.example.yaml
# Schema: .claude/skills/event-storming/schema/events.schema.json
#
# Written by /bootstrap, /adopt, /event-storming and /feature. Validated and rendered to
# docs/domain/event-storming.md after every write. An empty model is valid: it grows during discovery.
#
# Aggregates carry an optional status: target (default when missing), as-is (factual boundary, needs evidence),
# or unresolved (boundary unclear, needs an open hotspot and grilling; no story on it can be ready).
#
# Glossary: docs/glossary.md (ships to every workspace). CONTEXT.md points there.
#
# Slices adopted 2026-11-21: project and stage pipeline (confirmed); human review (confirmed); art-director verdicts and the
# generation queue (decided by recommendation, not reviewed by the user – see the adoption report).
# See docs/domain/adoption-report.md.

version: 1
domain: coreslopper

actors:
  - id: ACT-User
    name: User
  - id: ACT-Orchestrator
    name: Orchestrator
  - id: ACT-SetupSkill
    name: Setup skill
  - id: ACT-StageRunner
    name: Stage runner
  - id: ACT-BoardWizard
    name: Board wizard
    description: The board's + New form; it may complete the setup stage and nothing else (ADR 0037, proposed)
  - id: ACT-ArtDirector
    name: Art director
    description: The automated critic, run headless by review-image (claude -p --agent art-director) for every queue attempt and single verdicts
  - id: ACT-QueueRun
    name: Queue run
    description: The one queue run process per project (queue run) that generates ready items in order and hands every attempt to the art director

external_systems:
  - id: EXT-Provider
    name: Generation provider
  - id: EXT-ComfyUI
    name: ComfyUI server
    description: The local generation server; the queue run restarts it through COMFYUI_RESTART_COMMAND when a generation fails or hangs

bounded_contexts:
  - id: BC-Pipeline
    name: Pipeline
    purpose: Drives one project from setup to qa-export through the stages of its project kind and keeps its budget
  - id: BC-Review
    name: Review
    purpose: The user's frame-accurate notes on renders, sent to the agent in rounds and answered note by note
  - id: BC-GenerationQueue
    name: Generation queue
    purpose: Gets every generated image and clip of a project approved before anything derives from it – generate an attempt, give it a verdict, requeue it with the fix prompt, or file it

aggregates:
  - id: AGG-Project
    name: Project
    context: BC-Pipeline
    status: as-is
    evidence:
      - state.json per project, loaded and saved as one document (packages/core/src/project.ts:171-184,233-236)
      - stage transitions mutate one State (packages/core/src/state.ts:250-324)
      - budget ledger inside the same State (packages/core/src/state.ts:326-341)
    invariants:
      - Spend never exceeds the project budget total (the code enforces it in recordSpend, state.ts:330)
      - Every stage of the project kind's stage list has a stage state (the code adds missing ones in migrateState, state.ts:207)
      - The kind in state.json equals the kind in project.yaml (the code enforces it in validate-file, validate-file.ts:175)
      - The budget total in state.json equals budget_usd in project.yaml (the code enforces it in validate-file, validate-file.ts:164)
      - A stage is started, done or skipped only when every earlier stage of the kind's list is done or skipped (confirmed 2026-11-21; not enforced in code – gap register)
      - No writer loses another writer's change to the project state, and no recorded spend is lost (confirmed 2026-11-21; not enforced, state.json has no write lock – gap register)
      - The project's error history only grows; the current error of a stage is its last error (the code does this, state.ts:293)
  - id: AGG-ProjectReview
    name: Project review
    context: BC-Review
    status: as-is
    evidence:
      - one lock per project review folder, review/.notes.lock, around every note change and every send (packages/cli/src/board-review.ts:38,202,238)
      - round numbers from all rounds of the project (packages/core/src/review.ts:37; board-review.ts:242)
      - notes per render in review/notes/<video-stem>.json, rounds in review/rounds/<NNN>.json (board-review.ts:50,62-78)
    invariants:
      - A sent note never changes (the board enforces it, board-review.ts:213; the desktop player does not)
      - Round numbers are unique and ascending per project (the code takes the highest plus one under the lock)
      - A round holds every draft of one render at the time it was sent, at least one (board-review.ts:240-241)
      - A round's replies answer every note of the round and no other (validate-file, validate-file.ts:219-232; not checked when a round counts as answered)
      - A round is answered exactly once, by one fix pass (confirmed 2026-11-21; the code does not check it)
      - A note is sent in exactly one round (confirmed 2026-11-21; a crash between the two writes of a send breaks it – gap register)
      - A round is open until a valid replies file answers every note of it; an unreadable round counts as open, never as nothing open (confirmed 2026-11-21; the code counts any replies file – gap register)
      - Notes and rounds belong to the user; only the board and the desktop player write them, the agent writes only replies (confirmed 2026-11-21; an instruction only – gap register)
      - Every writer of notes – the board and the desktop player – keeps sent notes unchanged and loses no other writer's change; a note's frame is floor(seconds × format fps) (confirmed 2026-11-21; the desktop player breaks all three – gap register)
  - id: AGG-GenerationQueue
    name: Generation queue
    context: BC-GenerationQueue
    status: as-is
    evidence:
      - assets/queue.json per project, read, changed and written whole on every change (packages/cli/src/queue.ts:101-119)
      - an item waits for the items in its after list across the whole queue (queue.ts:524-529); order numbers are taken from the whole queue (queue.ts:127)
      - one queue run per project, pid lock assets/queue.lock (queue.ts:562-578,671-674)
    invariants:
      - Only an approved attempt is filed at the item's out path – a pass verdict, a hand accept, or an item without a verdict target (the code does this, queue.ts:689-693,493,775-782)
      - An item starts only when every item in its after list has passed or is not in the queue (the code does this, queue.ts:524-529)
      - Attempts of an item are numbered by the queue without gaps, region patches included; a replaced item keeps its attempts and keeps counting (decided 2026-11-21, HS-40; the code numbers patches separately – gap register)
      - At most one queue run works on a project at a time (decided 2026-11-21, HS-41; the pid lock is check-then-write, queue.ts:671-674 – gap register)
      - An item has at most 3 local attempts and one cloud attempt since its last replace, clips included (decided 2026-11-21, HS-39; only the automatic requeue of images is capped – gap register)
      - A user's accept is final; no automatic step undoes it (decided 2026-11-21, HS-42; a verdict that lands after an accept overwrites it today – gap register)
      - An item that is generating or reviewing is not accepted, requeued, replaced or dropped (decided 2026-11-21, HS-38; accept has no check – gap register)
      - No writer of queue.json loses another writer's change (decided 2026-11-21, HS-41; no lock around read-modify-write – gap register)

events:
  - id: EVT-ProjectCreated
    name: Project created
    aggregate: AGG-Project
    pivotal: true
    data: [Slug, Title, Project kind, Budget, Review mode, Series, Episode number]
  - id: EVT-StageStarted
    name: Stage started
    aggregate: AGG-Project
    data: [Stage, Started at, Stage attempts]
  - id: EVT-StageCompleted
    name: Stage completed
    aggregate: AGG-Project
    data: [Stage, Outputs, Input hash, Finished at]
  - id: EVT-StageFailed
    name: Stage failed
    aggregate: AGG-Project
    data: [Stage, Error, Finished at]
  - id: EVT-StageSkipped
    name: Stage skipped
    aggregate: AGG-Project
    data: [Stage, Reason]
  - id: EVT-StageReset
    name: Stage reset
    aggregate: AGG-Project
    data: [Stage]
  - id: EVT-SpendRecorded
    name: Spend recorded
    aggregate: AGG-Project
    data: [Amount, Spent total]
  - id: EVT-ProjectCompleted
    name: Project completed
    aggregate: AGG-Project
    pivotal: true
    data: [Finished at]
  - id: EVT-ReviewNoteAdded
    name: Review note added
    aggregate: AGG-ProjectReview
    data: [Render, Frame, End frame, Text, Created at]
  - id: EVT-ReviewNoteChanged
    name: Review note changed
    aggregate: AGG-ProjectReview
    data: [Note, Frame, End frame, Text]
  - id: EVT-ReviewNoteDeleted
    name: Review note deleted
    aggregate: AGG-ProjectReview
    data: [Note]
  - id: EVT-ReviewRoundSent
    name: Review round sent
    aggregate: AGG-ProjectReview
    pivotal: true
    data: [Round number, Render, Frame rate, Sent at, Notes with shots and section]
  - id: EVT-ReviewRoundAnswered
    name: Review round answered
    aggregate: AGG-ProjectReview
    pivotal: true
    data: [Round number, Answered at, Render with the fixes, Reply per note with status]
  - id: EVT-QueueItemAdded
    name: Queue item added
    aggregate: AGG-GenerationQueue
    data: [Item id, Kind, Generation item, Out path, Verdict target, After, Chain from, Order]
  - id: EVT-QueueItemReplaced
    name: Queue item replaced
    aggregate: AGG-GenerationQueue
    data: [Item id, Generation item, Next attempt number]
  - id: EVT-AttemptGenerated
    name: Attempt generated
    aggregate: AGG-GenerationQueue
    data: [Item id, Attempt number, Attempt file, Seed, Provider]
  - id: EVT-AttemptGenerationFailed
    name: Attempt generation failed
    aggregate: AGG-GenerationQueue
    data: [Item id, Attempt number, Error]
  - id: EVT-VerdictGiven
    name: Verdict given
    context: BC-GenerationQueue
    pivotal: true
    description: "Recorded in verdicts.jsonl (the record of every verdict, HS-36); a queue attempt holds a copy the queue run decides from"
    data: [Subject, Attempt number, Image, Clip, Verdict, Score, Issues, Fix prompt, Start frame PSNR, Judged at]
  - id: EVT-AttemptFiled
    name: Attempt filed
    aggregate: AGG-GenerationQueue
    pivotal: true
    data: [Item id, Attempt number, Out path]
  - id: EVT-QueueItemRequeued
    name: Queue item requeued
    aggregate: AGG-GenerationQueue
    data: [Item id, Next attempt number, Fix prompt, Seed, Focus, Order]
  - id: EVT-QueueItemNeedsFix
    name: Queue item needs a fix
    aggregate: AGG-GenerationQueue
    data: [Item id, Attempt number, Focus, Note]
  - id: EVT-AttemptAccepted
    name: Attempt accepted
    aggregate: AGG-GenerationQueue
    data: [Item id, Attempt number, Note]
  - id: EVT-QueueItemDropped
    name: Queue item dropped
    aggregate: AGG-GenerationQueue
    data: [Item id]
  - id: EVT-RegionPatched
    name: Region patched
    aggregate: AGG-GenerationQueue
    description: "An attempt of its queue item (HS-40); the code writes the attempt file and assets/review/patches.jsonl but not queue.json – gap register"
    data: [Image, Box, Prompt, References, Attempt number, Attempt file, Subject]
  - id: EVT-QueueRunStopped
    name: Queue run stopped
    aggregate: AGG-GenerationQueue
    data: [Reason, Items needing a fix]

commands:
  - id: CMD-CreateProject
    name: Create project
    actor: ACT-SetupSkill
    aggregate: AGG-Project
    produces: [EVT-ProjectCreated]
    rules:
      - The slug is valid and no project folder with it exists
      - The budget is at least the configured minimum
      - An episode names its series and episode number, and its budget fits the uncommitted series budget
  - id: CMD-StartStage
    name: Start stage
    actor: ACT-Orchestrator
    aggregate: AGG-Project
    produces: [EVT-StageStarted]
    rules:
      - Only an autonomous stage, and only from pending or failed (confirmed 2026-11-21; not enforced in code)
  - id: CMD-CompleteStage
    name: Complete stage
    actor: ACT-Orchestrator
    aggregate: AGG-Project
    produces: [EVT-StageCompleted, EVT-ProjectCompleted]
    description: Autonomous stages only; the orchestrator completes them with the outputs the stage runner reported
    rules:
      - Only from running (confirmed 2026-11-21; not enforced in code)
      - Completing style-character takes the project's characters into the character library
  - id: CMD-CompleteInteractiveStage
    name: Complete interactive stage
    actor: ACT-SetupSkill
    aggregate: AGG-Project
    produces: [EVT-StageCompleted]
    description: The setup skill of the kind (new-video, new-episode) completes setup, brief, treatment or script; the board wizard may complete setup
    rules:
      - Only an interactive stage, from pending or failed; a setup skill does not start it first (confirmed 2026-11-21; not enforced in code)
  - id: CMD-FailStage
    name: Fail stage
    actor: ACT-Orchestrator
    aggregate: AGG-Project
    produces: [EVT-StageFailed]
    rules:
      - Only from running (confirmed 2026-11-21; not enforced in code)
  - id: CMD-SkipStage
    name: Skip stage
    actor: ACT-User
    aggregate: AGG-Project
    description: A manual decision of the user for a stage the project does not need; no skill or command skips
    rules:
      - Only from pending or failed (confirmed 2026-11-21; not enforced in code)
    produces: [EVT-StageSkipped, EVT-ProjectCompleted]
  - id: CMD-ResetStage
    name: Reset stage
    actor: ACT-User
    aggregate: AGG-Project
    produces: [EVT-StageReset]
    rules:
      - A running stage cannot be reset (confirmed 2026-11-21; the code accepts it)
      - Every later stage that is done or skipped returns to pending as well (confirmed 2026-11-21; the code resets one stage only)
      - The orchestrator resets qa-export after review fixes changed the picture
  - id: CMD-RecordSpend
    name: Record spend
    actor: ACT-StageRunner
    aggregate: AGG-Project
    produces: [EVT-SpendRecorded]
    rules:
      - Before a paid batch, its worst-case estimate fits the remaining budget and the batch cap (30 % of the remaining budget unless batch_cap_usd is set)
  - id: CMD-AddReviewNote
    name: Add review note
    actor: ACT-User
    aggregate: AGG-ProjectReview
    produces: [EVT-ReviewNoteAdded]
    rules:
      - The render is one of the project's renders; the note sits on a frame or a range of frames of it
  - id: CMD-ChangeReviewNote
    name: Change review note
    actor: ACT-User
    aggregate: AGG-ProjectReview
    produces: [EVT-ReviewNoteChanged]
  - id: CMD-DeleteReviewNote
    name: Delete review note
    actor: ACT-User
    aggregate: AGG-ProjectReview
    produces: [EVT-ReviewNoteDeleted]
  - id: CMD-SendReviewRound
    name: Send review round
    actor: ACT-User
    aggregate: AGG-ProjectReview
    produces: [EVT-ReviewRoundSent]
    rules:
      - Each note gets the shots on screen during it (a note on a cut belongs to both shots) and the section at its start
      - The round records the version of its render, so notes on a since-changed render can be shown as such (confirmed 2026-11-21; missing – gap register)
  - id: CMD-AnswerReviewRound
    name: Answer review round
    actor: ACT-StageRunner
    aggregate: AGG-ProjectReview
    produces: [EVT-ReviewRoundAnswered]
    rules:
      - Reply status is fixed, partly, not-fixed or question
  - id: CMD-AddQueueItem
    name: Add queue item
    actor: ACT-StageRunner
    aggregate: AGG-GenerationQueue
    produces: [EVT-QueueItemAdded, EVT-QueueItemReplaced]
    rules:
      - Items come from storyboard.yaml (keyframes, clips) or a hand-written batch with id and out; a known id is skipped unless replace is asked for
      - Replacing a passed item returns every passed item after it to pending, as a stage reset does (HS-38; missing – gap register)
      - A generating or reviewing item cannot be replaced (the code refuses, queue.ts:179)
  - id: CMD-RunQueue
    name: Run the queue
    actor: ACT-StageRunner
    aggregate: AGG-GenerationQueue
    produces: [EVT-AttemptGenerated, EVT-AttemptGenerationFailed, EVT-QueueRunStopped]
    rules:
      - Generates ready items lowest order first through generate (budget, cache, manifest, spend)
      - A budget or config error puts the item back to pending and stops the run; a validation error marks it error; other failures are tried again with a ComfyUI restart in between
      - A killed run's generating items go back to pending on the next run
  - id: CMD-GiveVerdict
    name: Give a verdict
    actor: ACT-ArtDirector
    produces: [EVT-VerdictGiven]
    rules:
      - Fail only for a blocking defect; any other issue is a verdict note and the verdict stays pass; a fail with verdict notes only becomes a pass – for every verdict, also outside the queue (HS-34)
      - A clip is judged by its first, middle and last frame; a first frame below 20 dB PSNR against its keyframe is pointed out for comparison
      - From attempt 2 on, the art director checks the focus and new blocking defects and raises no new verdict notes
  - id: CMD-ApplyVerdict
    name: Apply a verdict
    actor: ACT-QueueRun
    aggregate: AGG-GenerationQueue
    produces: [EVT-AttemptFiled, EVT-QueueItemRequeued, EVT-QueueItemNeedsFix]
    rules:
      - A pass files the attempt at out, which makes the items after it ready
      - A failed image with a usable fix prompt and fewer than max attempts is requeued with the fix prompt as its prompt, seed + 1, the blocking issues as focus and a new order
      - Any other fail – a clip, an audio item, a fix prompt "none", the limit reached – leaves the item needing a fix
  - id: CMD-RetryQueueItem
    name: Retry queue item
    actor: ACT-StageRunner
    aggregate: AGG-GenerationQueue
    produces: [EVT-QueueItemRequeued]
    description: "Requeue an item by hand; the command is spelled queue retry (HS-32)"
    rules:
      - Optional new prompt, changed item fields, a provider for one attempt (cloud fallback) or a seed
      - An unchanged item whose last attempt has no verdict is only judged again
      - Refused for a passed item; redo a filed item with a replace (HS-38; the code allows it – gap register)
      - The stage runner may give one attempt a cloud provider (cloud fallback) after 3 failed local attempts
  - id: CMD-AcceptAttempt
    name: Accept attempt
    actor: ACT-User
    aggregate: AGG-GenerationQueue
    produces: [EVT-AttemptAccepted, EVT-AttemptFiled]
    rules:
      - The given attempt, or the best one (highest score, the later on a tie), is filed at out and the item counts as passed
      - The user may accept any attempt; the stage runner only the best one after the cloud attempt failed, writing its last issues into the batch notes (HS-42)
  - id: CMD-DropQueueItem
    name: Drop queue item
    actor: ACT-StageRunner
    aggregate: AGG-GenerationQueue
    produces: [EVT-QueueItemDropped]
    rules:
      - Refused while generating or reviewing; the item's files stay
  - id: CMD-PatchRegion
    name: Patch a region
    actor: ACT-StageRunner
    aggregate: AGG-GenerationQueue
    produces: [EVT-RegionPatched]
    rules:
      - Crops the box, runs it as an image edit through generate (cache, manifest, budget), pastes it back with a soft edge; pixels outside the box do not change
      - The patched image is the next attempt of the image's queue item (HS-40; the code numbers it from verdicts.jsonl and leaves queue.json alone – gap register)

policies:
  - id: POL-RunNextStage
    name: Run the next autonomous stage
    when: [EVT-StageCompleted, EVT-StageSkipped]
    then: [CMD-StartStage]
    description: "An orchestrator rule (/video-next). It never starts an interactive stage, and with review mode final it stops before qa-export for the final review; no code reads review_mode"
  - id: POL-HardStop
    name: A hard stop fails the stage and halts the pipeline
    when: [EVT-StageStarted]
    then: [CMD-FailStage]
    description: "Hard stop: the budget or batch cap would be exceeded; a real provider's credentials are missing; validation or QA fails after the stage's bounded retries; a user-owned file would be overwritten (timing.overrides.json, project.yaml, an imported take, the series canon)"
  - id: POL-AnswerOpenRounds
    name: Open review rounds are answered before the next autonomous stage
    when: [EVT-ReviewRoundSent]
    then: [CMD-AnswerReviewRound]
    description: An orchestrator rule (/video-next "Review rounds"); one fix pass per round, oldest first, after a running and an open interactive stage. With review mode final, the final review is done with review rounds before qa-export
  - id: POL-RebuildQaAfterFixes
    name: Fixes that change the picture reset qa-export
    when: [EVT-ReviewRoundAnswered]
    then: [CMD-ResetStage]
    description: An orchestrator rule (/video-next "Review rounds" step 4), only when the fix pass changed a render; ADR 0032's unconditional wording is a gap
  - id: POL-JudgeEveryAttempt
    name: Every attempt with a verdict target is judged
    when: [EVT-AttemptGenerated]
    then: [CMD-GiveVerdict]
    description: "In the background while the queue run generates on (at most --reviews, default 2, started at once); an item without a verdict target is filed directly"
  - id: POL-ApplyVerdict
    name: The queue run applies every verdict
    when: [EVT-VerdictGiven]
    then: [CMD-ApplyVerdict]
    description: A verdict on a queue attempt files it, requeues it, or leaves the item waiting for a fix

read_models:
  - id: RM-Status
    name: Status
    fed_by: [EVT-StageStarted, EVT-StageCompleted, EVT-StageFailed, EVT-StageSkipped, EVT-StageReset, EVT-SpendRecorded]
    used_by: [ACT-Orchestrator, ACT-User]
    fields: [Project kind, Stage, Stage status, Stage attempts, Outputs, Spent total, Remaining budget, Batch cap, Next stage]
  - id: RM-NextAction
    name: Next action
    fed_by: [EVT-StageStarted, EVT-StageCompleted, EVT-StageFailed, EVT-StageSkipped, EVT-StageReset]
    used_by: [ACT-User]
    fields: [Where, Command, Reason, Stage]
    description: "Precedence: a running stage (wait), an open interactive stage (setup skill), open review rounds, an open autonomous stage (/video-next, resume when failed); all stages done without a release folder means reset qa-export, then /video-next; then the release view"
  - id: RM-ProductionView
    name: Production view
    fed_by: [EVT-ProjectCreated, EVT-StageStarted, EVT-StageCompleted, EVT-StageFailed, EVT-StageSkipped, EVT-StageReset, EVT-SpendRecorded]
    used_by: [ACT-User]
    fields: [Project, Production phase, Stage status, Stage attempts, Spent total, Remaining budget, Next action]
  - id: RM-ReviewView
    name: Review view
    fed_by: [EVT-ReviewNoteAdded, EVT-ReviewNoteChanged, EVT-ReviewNoteDeleted, EVT-ReviewRoundSent, EVT-ReviewRoundAnswered]
    used_by: [ACT-User]
    fields: [Render, Sections, Shots, Notes with draft or sent state, Rounds, Reply per note]
  - id: RM-OpenReviewRounds
    name: Open review rounds
    fed_by: [EVT-ReviewRoundSent, EVT-ReviewRoundAnswered]
    used_by: [ACT-Orchestrator, ACT-User]
    fields: [Round number, Render, Note count, Round file, Replies file]
  - id: RM-QueueStatus
    name: Queue status
    fed_by: [EVT-QueueItemAdded, EVT-QueueItemReplaced, EVT-AttemptGenerated, EVT-AttemptGenerationFailed, EVT-AttemptFiled, EVT-QueueItemRequeued, EVT-QueueItemNeedsFix, EVT-AttemptAccepted, EVT-QueueItemDropped]
    used_by: [ACT-StageRunner, ACT-User]
    fields: [Item id, Queue item status, Attempt number, Blocked by, Note, Error, Blocking issues]
    description: queue status and queue wait; the board's queue counts and items and the watchdog's needs-fix pulse read the same file loosely
  - id: RM-LatestVerdicts
    name: Latest verdicts
    fed_by: [EVT-VerdictGiven, EVT-AttemptAccepted]
    used_by: [ACT-Orchestrator, ACT-StageRunner, ACT-User]
    fields: [Subject, Verdict, Score, Attempt number, Image or clip, Blocking issues]
    description: "verdicts [--failed] and the board's failed verdicts: the last verdict per subject, a clip apart from its keyframe; an accepted subject shows as accepted, not failed (HS-37; missing – gap register). Read twice today (verdicts.ts, board-production.ts)"

hotspots:
  - id: HS-1
    question: "'Production phase' (setup/ready/running/failed/done) is a derived project status, but the glossary lists 'phase' under Avoid for Stage, and 'setup' is both a stage ID and a phase. Which word is the domain term?"
    refs: [RM-ProductionView, RM-NextAction]
    status: resolved
    resolution: "Production Phase is its own term: the coarse state of a whole project, derived from its stage states, shown on the board. 'phase' stays avoided for a stage. The phase value setup (an interactive stage is open) beside the stage ID setup is a gap candidate; nothing is renamed now. (user, 2026-11-21)"
  - id: HS-2
    question: "The stage's attempt counter clashes with the glossary's Attempt (a version of a queue item), and the next action reason 'retry' uses a word the glossary avoids. Which words apply to a stage?"
    refs: [EVT-StageStarted, RM-NextAction]
    status: resolved
    resolution: "Stage Attempt: one start of a stage; a failed stage resumes with a new stage attempt. The word for starting a failed stage again is resume; the code's next-action reason 'retry' is a gap candidate. Attempt alone stays the queue item version. (user, 2026-11-21)"
  - id: HS-3
    question: "Skipping a stage has a command but no actor and no documented reason. Who skips a stage, and when?"
    refs: [CMD-SkipStage, EVT-StageSkipped]
    status: resolved
    resolution: "Stage Skip is a manual decision of the user for a stage the project does not need; no skill or command skips (ADR 0013). Where the reason is stored is an implementation detail. (user, 2026-11-21)"
  - id: HS-4
    question: "Hard stop has three conditions in the glossary, four in docs/pipeline.md and docs/architecture.md, and six in /video-next. What is the one definition?"
    refs: [POL-HardStop]
    status: resolved
    resolution: "Four conditions: budget or batch cap would be exceeded; a real provider's credentials are missing; validation or QA fails after the stage's bounded retries; a user-owned file would be overwritten (timing.overrides.json, project.yaml, an imported take, the series canon). Divergent lists are gap candidates. (user, 2026-11-21)"
  - id: HS-5
    question: "The budget lives in project.yaml (budget_usd) and in state.json (budget.totalUsd), kept equal by validate-file. Which one is the source of truth?"
    refs: [AGG-Project]
    status: resolved
    resolution: "budget_usd in project.yaml is the source; state.json budget.totalUsd is a copy that must stay equal. No command changes a budget; that is a gap candidate. (user, 2026-11-21)"
  - id: HS-6
    question: "The board wizard completes the setup stage (finishSetup, board-wizard.ts:344), while ADR 0030 calls the production view read-only. Is the board a sanctioned writer of project state?"
    refs: [CMD-CompleteStage, AGG-Project]
    status: resolved
    resolution: "The board wizard is a sanctioned writer, for completing the setup stage only. Recorded in ADR 0037 (proposed), which amends ADR 0030. (user, 2026-11-21)"
  - id: HS-7
    question: "Both /video-next and seven stage skills call stage-done for the same stage. Who completes a stage: the orchestrator or the stage runner?"
    refs: [CMD-CompleteStage]
    status: resolved
    resolution: "The orchestrator completes autonomous stages; the setup skill (or the board wizard for setup) completes interactive stages. The stage-done lines in stage skills are drift, a gap candidate. (user, 2026-11-21)"
  - id: HS-8
    question: "review_mode: final is in the schema and the glossary, but only /video-next's instructions act on it, and new always writes auto. A supported setting, an instruction-only convention, or legacy?"
    refs: [EVT-ProjectCreated]
    status: resolved
    resolution: "A supported setting, enforced as an orchestrator rule (POL-RunNextStage): the pipeline stops before qa-export. That next action and board ignore it is a gap candidate. (user, 2026-11-21)"
  - id: HS-9
    question: "budget.reservedUsd is subtracted and shown as 'reserved', but nothing ever reserves money. Planned or dead?"
    refs: [AGG-Project, RM-ProductionView]
    status: resolved
    resolution: "Dead. Not part of the model; a removal candidate in the gap register. (user, 2026-11-21)"
  - id: HS-10
    question: "workspace/AGENTS.md says state.json tracks input hashes for resumability; inputHash can be stored but nothing passes or compares it. Is stale-stage detection part of the model?"
    refs: [EVT-StageCompleted]
    status: resolved
    resolution: "Stale-stage detection is not part of the model today. A stage reset is always an explicit decision. The claim in workspace/AGENTS.md is a contradiction for the gap register; whether detection is wanted is decided later. (user, 2026-11-21)"
  - id: HS-11
    question: "No transition is guarded: done → running, pending → done and starting an interactive stage are all accepted. Which transitions are legal?"
    refs: [AGG-Project, CMD-StartStage, CMD-CompleteStage]
    status: resolved
    resolution: "Start: autonomous stages only, from pending or failed, after every earlier stage is done or skipped. Complete (orchestrator) and fail: from running. Complete interactive stage: from pending or failed. Skip: from pending or failed. The code enforces none of it – gap register. (user, 2026-11-21)"
  - id: HS-12
    question: "Stage reset accepts any status (also running) and does not touch later stages, while the glossary limits it to done, failed or skipped stages. What does a reset do?"
    refs: [CMD-ResetStage, EVT-StageReset]
    status: resolved
    resolution: "A reset refuses a running stage and returns every later done or skipped stage to pending as well; the generation cache keeps unchanged shots cheap. The code resets one stage of any status – gap register. (user, 2026-11-21)"
  - id: HS-13
    question: "When every stage is done but no release exists, the board tells the user to run /video-next for qa-export, while status says done and /video-next stops. What is the next action?"
    refs: [RM-NextAction]
    status: resolved
    resolution: "The release folder is an output of qa-export, so the next action is: reset qa-export, then /video-next. The board's current advice is a gap. (user, 2026-11-21)"
  - id: HS-14
    question: "The next action puts an open interactive stage before open review rounds; /video-next answers review rounds before it checks for an interactive stage. Which comes first?"
    refs: [RM-NextAction]
    status: resolved
    resolution: "An open interactive stage comes before open review rounds, as projectNextAction and ADR 0030 say. /video-next answering rounds first is a gap. (user, 2026-11-21)"
  - id: HS-15
    question: "state.json has no write lock; a long generation batch saves after each item from the state it loaded at the start and can overwrite a parallel stage-* or spend write. Must project state be safe against concurrent writers?"
    refs: [AGG-Project, CMD-RecordSpend]
    status: resolved
    resolution: "Yes: no writer loses another writer's change and no recorded spend is lost (aggregate invariant). The missing lock and the stale state in long batches are a high-priority gap. (user, 2026-11-21)"
  - id: HS-16
    question: "The desktop review player deletes sent notes, takes no lock, rewrites the whole notes file from memory, and rounds frames differently than the board. What is its role: a full second writer bound by the same rules, a fallback with fewer rights, or retired?"
    refs: [AGG-ProjectReview, CMD-DeleteReviewNote]
    status: resolved
    resolution: "A fallback writer bound by the same invariants as the board: sent notes stay unchanged, no other writer's change is lost, frame = floor(seconds × format fps). Today's deviations are gap candidates, data loss with high priority. (user, 2026-11-21)"
  - id: HS-17
    question: "Desktop-player notes reach the agent with the next round (docs/board.md) or when the user asks in chat (assembly-render). Which is the one way?"
    refs: [CMD-SendReviewRound]
    status: resolved
    resolution: "One way: desktop-player notes become draft notes in the board and go out with the next round. The chat path in assembly-render is a gap. (user, 2026-11-21)"
  - id: HS-18
    question: "A round counts as answered once any replies file exists, even an incomplete one; completeness is checked only by the hook after the write. What answers a round?"
    refs: [EVT-ReviewRoundAnswered, RM-OpenReviewRounds]
    status: resolved
    resolution: "A round is answered only by a valid replies file that answers every note of it and no other; an invalid one leaves it open. Board and status count open rounds the same way; an unreadable round is open or an error, never nothing open. Gap register. (user, 2026-11-21)"
  - id: HS-19
    question: "After a reply 'question' or 'not-fixed' the round is closed and nothing is left open. Does the user continue only with a new note in a new round?"
    refs: [EVT-ReviewRoundAnswered]
    status: resolved
    resolution: "An answered round stays answered; there is no reopening. The user follows up with a new note in the next round. (user, 2026-11-21)"
  - id: HS-20
    question: "ADR 0032 resets qa-export after every fixed round; /video-next only when the fixes changed the picture. Which?"
    refs: [POL-RebuildQaAfterFixes]
    status: resolved
    resolution: "qa-export is reset only when the fix pass changed a render (/video-next's rule). ADR 0032's unconditional wording is a gap; the ADR is not edited. (user, 2026-11-21)"
  - id: HS-21
    question: "The UI, glossary and ADR say 'send'; the code says submit (submitRound, /submit, submitted_at). Which is the domain verb?"
    refs: [CMD-SendReviewRound]
    status: resolved
    resolution: "The domain verb is send: a round is sent, a note is sent. 'submit' in code is a gap (low); the glossary avoids 'submission'. (user, 2026-11-21)"
  - id: HS-22
    question: "'review' means the user's review of renders, the art director's verdicts (queue state 'reviewing', 'Art-director reviews', assets/review/verdicts.jsonl), and the review/ folder that also holds release and progress files. Which meanings keep the word?"
    refs: [BC-Review]
    status: resolved
    resolution: "'Review' in the domain is only the user's review of renders (BC-Review). The art director gives verdicts; its 'review' words are a gap for the art-director slice. The review/ folder is file layout, not a term; renaming it needs an ADR and is not planned. In BC-Review an unsent note is a draft note, unrelated to the publishing Draft. (user, 2026-11-21)"
  - id: HS-23
    question: "The fix work for a round is 'review-fix' (a runner label, no stage in state) and 'fix pass' (assembly-render). Is it a domain concept, and under which name?"
    refs: [CMD-AnswerReviewRound, POL-AnswerOpenRounds]
    status: resolved
    resolution: "Fix Pass: the agent's work on one review round, ending with the replies; review-fix is only the runner's label, not a stage. (user, 2026-11-21)"
  - id: HS-24
    question: "The consistency boundary in code is the board's lock over notes and rounds; the agent writes replies without it. Are the replies part of the same aggregate?"
    refs: [AGG-ProjectReview]
    status: resolved
    resolution: "Round, replies and notes are one aggregate (AGG-ProjectReview, as-is). Replies without the lock are fine as long as each round gets exactly one fix pass (invariant). (user, 2026-11-21)"
  - id: HS-25
    question: "'The agent never writes notes or rounds' is an instruction only; the hook validates replies and ignores notes and round files. Must it be enforced?"
    refs: [AGG-ProjectReview]
    status: resolved
    resolution: "Notes and rounds belong to the user (invariant); the cheapest enforcement is the workspace hook blocking agent edits to review/notes/ and review/rounds/<NNN>.json – product code, so a gap candidate. (user, 2026-11-21)"
  - id: HS-26
    question: "A note knows its render by file name only; a re-render under the same name moves old notes and rounds onto different frames without a trace. Must a note record which render version it was made on?"
    refs: [EVT-ReviewNoteAdded, EVT-ReviewRoundSent]
    status: resolved
    resolution: "Yes: a round records the version of its render at sending, so the board can mark notes on a since-changed render. Missing today – gap register. (user, 2026-11-21)"
  - id: HS-27
    question: "Review mode final stops for 'one final human review' before qa-export. Is that review done with review rounds?"
    refs: [POL-AnswerOpenRounds]
    status: resolved
    resolution: "Yes: the final review is the user's review in the board, with or without a round; the user releases qa-export with /video-next <slug> --stage qa-export. The missing release and the repeating stop are a gap. (user, 2026-11-21)"
  - id: HS-28
    question: "ADR 0032 speaks of offsetting notes on Shorts, but the board lists only renders/ top-level files, so Shorts can be reviewed only with the desktop player. Are Shorts reviewed?"
    refs: [CMD-AddReviewNote]
    status: resolved
    resolution: "Shorts are not reviewed in the board; the 9:16 render they are cut from is. Intended as is; the desktop player covers special cases. (user, 2026-11-21)"
  - id: HS-29
    question: "What is the context called – 'Generation queue' (the glossary term and the board's word) or 'Art direction' (the job: get every generated asset approved)?"
    refs: [BC-GenerationQueue]
    status: resolved
    resolution: "The context is Generation queue (BC-GenerationQueue), after the glossary term and the board's word (recommendation, not reviewed by the user – delegated, 2026-11-21)"
  - id: HS-30
    question: "There is no glossary term for the art director's judgement. Is it a Verdict, with every 'review' word for the art director (review-image, status reviewing, the review target, failedReviews, 'reviewer') a code spelling and a gap?"
    refs: [EVT-VerdictGiven, CMD-GiveVerdict]
    status: resolved
    resolution: "Verdict is the term: one judgement of the art director on one attempt or image; the art director judges. Every review word for it in code and UI (review-image, status reviewing, the item field review, failedReviews, reviewer, \"Art-director reviews\") is a spelling and a gap (recommendation; the user agreed without reviewing it – delegated, 2026-11-21)"
  - id: HS-31
    question: "Only a blocking defect fails; everything else is an issue prefixed 'note:'. 'Note' collides with Review Note. What are the two kinds of issue called?"
    refs: [CMD-GiveVerdict]
    status: resolved
    resolution: "Blocking Defect (the fixed list that fails a verdict) and Verdict Note (any other issue; never fails). Avoid note alone and minor issue; the note: prefix is a spelling (recommendation; the user agreed without reviewing it – delegated, 2026-11-21)"
  - id: HS-32
    question: "'queue retry' and RetryOptions use 'retry', which the glossary avoids for Attempt; '--tries' is a third counter (provider calls inside one attempt). Which words apply?"
    refs: [CMD-RetryQueueItem, CMD-RunQueue]
    status: resolved
    resolution: "The verb is requeue: the queue run requeues a failed image, the stage runner requeues an item with queue retry (a spelling, gap). Tries inside one attempt are technical, no domain term (recommendation; the user agreed without reviewing it – delegated, 2026-11-21)"
  - id: HS-33
    question: "Status passed covers three cases: a pass verdict, an item without a verdict target, and a hand accept. The glossary says 'approved' and 'filed'. Which words, and must the three cases stay distinguishable?"
    refs: [EVT-AttemptFiled, EVT-AttemptAccepted]
    status: resolved
    resolution: "An approved attempt has a pass verdict or an accept; filed means copied to the item's out path; an item without a verdict target is filed unjudged. Status passed stays, but the three cases must stay distinguishable – today only an accept marks itself (gap) (recommendation; the user agreed without reviewing it – delegated, 2026-11-21)"
  - id: HS-34
    question: "art-director.md says 'any drift is a fail', 'fail it on any doubt', palette and light are axes, and answers in text; the queue's prompt fails only for a blocking defect and forces JSON. Which fail rule holds for every verdict?"
    refs: [CMD-GiveVerdict]
    status: resolved
    resolution: "The blocking-defect rule holds for every verdict, also when the art director runs as a subagent (thumbnails); art-director.md's strictness wording and text answer are a gap. Bench rubric scores are not verdicts (recommendation; the user agreed without reviewing it – delegated, 2026-11-21)"
  - id: HS-35
    question: "The glossary says the art director judges 'stills and keyframes'; it judges clips (by frames), sheets, states, plates, props, thumbnails and bench results too. Sharpen the definition?"
    refs: [ACT-ArtDirector]
    status: resolved
    resolution: "Sharpened: the art director judges every generated image and clip (by its frames), continuity references, thumbnails and covers, and scores bench results against a rubric (recommendation; the user agreed without reviewing it – delegated, 2026-11-21)"
  - id: HS-36
    question: "A verdict is written twice: the full line to verdicts.jsonl and verdict, score, issues, fix prompt into the queue attempt; verdicts outside the queue (review-image by hand, the series canon) exist only in the log. Which is the record?"
    refs: [EVT-VerdictGiven, RM-LatestVerdicts]
    status: resolved
    resolution: "verdicts.jsonl is the record of every verdict; the queue attempt holds a copy the queue run decides from (intended). The two readers of the log are a gap (recommendation; the user agreed without reviewing it – delegated, 2026-11-21)"
  - id: HS-37
    question: "An accept writes no verdict, so an accepted subject stays failed in 'verdicts --failed', which the orchestrator reads, and on the board. How must the read models show an accepted attempt?"
    refs: [EVT-AttemptAccepted, RM-LatestVerdicts]
    status: resolved
    resolution: "An accept is its own event; the latest-verdicts view shows an accepted subject as accepted, and verdicts --failed leaves it out. Missing today – gap (recommendation, not reviewed by the user – delegated, 2026-11-21)"
  - id: HS-38
    question: "Which transitions are legal? accept has no status check (a running review can later overwrite the accept); retry from passed regenerates a filed item; replace resets a passed item whose dependants may already be filed."
    refs: [CMD-AcceptAttempt, CMD-RetryQueueItem, CMD-AddQueueItem]
    status: resolved
    resolution: "accept, retry and drop are refused while an item is generating or reviewing; retry is refused for a passed item (redo it with add --replace); replacing a passed item returns every passed item after it to pending, as a stage reset does (recommendation, not reviewed by the user – delegated, 2026-11-21)"
  - id: HS-39
    question: "The instructions cap an item at 3 local attempts and one cloud attempt (clips 3); the code caps only the automatic requeue of images, retry has no limit, and attempts kept from before a replace count. What is the rule, and does a replace start the count again?"
    refs: [AGG-GenerationQueue, CMD-RetryQueueItem]
    status: resolved
    resolution: "At most 3 local attempts and one cloud attempt per item, clips included, counted since the item's last replace; the queue enforces it for the automatic requeue and for queue retry. Only the requeue of images is capped today – gap (recommendation, not reviewed by the user – delegated, 2026-11-21)"
  - id: HS-40
    question: "A region patch writes an attempt file but not into queue.json, numbering from verdicts.jsonl while the queue numbers from queue.json (the same -a<n> file can be written twice); for a series canon it reads the wrong log. Is a region patch an attempt of its queue item?"
    refs: [EVT-RegionPatched, CMD-PatchRegion]
    status: resolved
    resolution: "A region patch is an attempt of its queue item: recorded in queue.json and numbered by the queue, so there is one counter. The series canon reading the wrong verdict log is a bug – gap (recommendation, not reviewed by the user – delegated, 2026-11-21)"
  - id: HS-41
    question: "queue.json changes are read-modify-write without a lock between processes (add, retry, accept, drop during a run), and the run lock is check-then-write. Is 'no lost write, one run per project' an invariant as for state.json and review notes?"
    refs: [AGG-GenerationQueue]
    status: resolved
    resolution: "Invariant: no writer of queue.json loses another writer's change, and at most one queue run works on a project. Neither is enforced (no lock around read-modify-write; check-then-write run lock) – gap (recommendation; the user agreed without reviewing it – delegated, 2026-11-21)"
  - id: HS-42
    question: "Who may accept an attempt? ai-clips lets the stage runner accept the best attempt after the cloud attempt fails, and says 'the user's eye wins'."
    refs: [CMD-AcceptAttempt]
    status: resolved
    resolution: "The user may accept any attempt at any time, and a user's accept is never undone by the agent; the stage runner may accept the best attempt only after the cloud attempt failed, with its last issues in the batch notes (as ai-clips says) (recommendation, not reviewed by the user – delegated, 2026-11-21)"
  - id: HS-43
    question: "The series canon is judged with review-image and patch by hand; the new-series skill says the queue is for projects only. Intended, or a gap?"
    refs: [BC-GenerationQueue]
    status: resolved
    resolution: "Intended: the series canon is judged with review-image and patch by hand, since it is built interactively with the user; the queue is for projects (recommendation; the user agreed without reviewing it – delegated, 2026-11-21)"
  - id: HS-44
    question: "No ADR records the queue's decisions (headless art director with a JSON schema, one run per project, background verdicts, attempts as files, the one-attempt cloud fallback, the ComfyUI restart, notes never fail). Record them in one proposed ADR?"
    refs: [BC-GenerationQueue]
    status: resolved
    resolution: "One ADR records the queue's decisions: ADR 0038 (Proposed) (recommendation; the user agreed without reviewing it – delegated, 2026-11-21)"
  - id: HS-45
    question: "The slice's domain logic (queue states and transitions, verdict type and schema, the blocking-defect rule) lives in cli; core only counts statuses. Decision or accident?"
    refs: [AGG-GenerationQueue]
    status: resolved
    resolution: "Accident: queue states and transitions, the verdict type and schema, and the blocking-defect rule belong in core (schema.ts, ADR 0004); nothing moves now – gap (recommendation; the user agreed without reviewing it – delegated, 2026-11-21)"
  - id: HS-46
    question: "The consistency boundary in code is the whole queue.json of a project (dependencies and order across items), not one item. Keep the aggregate as recovered (as-is)?"
    refs: [AGG-GenerationQueue]
    status: resolved
    resolution: "The whole queue of a project stays the aggregate as recovered (as-is) (recommendation; the user agreed without reviewing it – delegated, 2026-11-21)"

flows:
  - id: FLOW-AutonomousStage
    name: One autonomous stage
    sequence: [ACT-Orchestrator, CMD-StartStage, EVT-StageStarted, ACT-StageRunner, CMD-CompleteStage, EVT-StageCompleted, POL-RunNextStage]
  - id: FLOW-ReviewRound
    name: From a note to its reply
    sequence: [ACT-User, CMD-AddReviewNote, EVT-ReviewNoteAdded, CMD-SendReviewRound, EVT-ReviewRoundSent, POL-AnswerOpenRounds, CMD-AnswerReviewRound, EVT-ReviewRoundAnswered, POL-RebuildQaAfterFixes]
  - id: FLOW-QueueItem
    name: From a queue item to a filed attempt
    sequence: [ACT-StageRunner, CMD-AddQueueItem, EVT-QueueItemAdded, CMD-RunQueue, EVT-AttemptGenerated, POL-JudgeEveryAttempt, CMD-GiveVerdict, EVT-VerdictGiven, POL-ApplyVerdict, CMD-ApplyVerdict, EVT-AttemptFiled]
