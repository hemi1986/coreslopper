    rules:
      - Without --id the id comes from the title; a taken id is refused (user, 2026-11-22)
      - Every format ffmpeg reads is stored as WAV; the loudness is measured, never normalised into the file (user, 2026-11-22)
      - The licence is unknown unless the user names one (user, 2026-11-22)
      - Only a local file; a download URL is out of scope (user, 2026-11-22)
  - id: CMD-UpdateLibrarySound
    name: Update a library sound
    actor: ACT-User
    aggregate: AGG-LibrarySound
    produces: [EVT-LibrarySoundUpdated]
    description: "sound edit <id> --… or the user's own edit of sound.yaml; only the metadata, never the file"
  - id: CMD-RemoveLibrarySound
    name: Remove a library sound
    actor: ACT-User
    aggregate: AGG-LibrarySound
    produces: [EVT-LibrarySoundRemoved]
    description: "sound remove <id>; takes already copied into memes stay"
  - id: CMD-CheckSoundLibrary
    name: Check the sound library
    actor: ACT-User
    produces: [EVT-SoundLibraryChecked, EVT-LibrarySoundRemeasured]
    description: "sound check; a file the user swapped is measured again, a file without an entry is reported and never turned into one"
  - id: CMD-ValidateLibrarySound
    name: Validate a library sound
    actor: ACT-StageRunner
    aggregate: AGG-LibrarySound
    produces: [EVT-LibrarySoundUpdated, EVT-LibrarySoundRefused]
    description: "validate-file on every edit of library/sounds/<id>/sound.yaml (the workspace hook); a failing edit is blocked"
  - id: CMD-WriteMemeScript
    name: Write a meme's script
    actor: ACT-SetupSkill
    aggregate: AGG-Script
    produces: [EVT-ScriptWritten]
    description: "The new-meme skill reads pitch.md, the chosen characters and the sound library, grills the user to the punchline and writes script.yaml in the script stage"
    rules:
      - A sound line names a library sound (sound) or a prompt to generate one, exactly one of the two; a library sound's length comes from its trim, so the line has no duration (user, 2026-11-22)
      - Per moment the skill proposes one to three library sounds by use when, tags, length and cue; the user picks; with none fitting it writes a generated sound line and notes it as a candidate for the library (user, 2026-11-22)
      - The track it implies lasts at most 30 seconds, about 15 as the aim (user, 2026-11-22)
      - Speakers are characters of the meme's own character bible or the library characters it uses (user, 2026-11-22)

policies:
  - id: POL-RunNextStage
    name: Run the next autonomous stage
    when: [EVT-StageCompleted, EVT-StageSkipped]
    then: [CMD-StartStage]
    description: "An orchestrator rule (/video-next). It never starts an interactive stage, and with review mode final it stops before qa-export for the final review; no code reads review_mode"
  - id: POL-HardStop
    name: A hard stop fails the stage and halts the pipeline
    when: [EVT-StageStarted]
    then: [CMD-FailStage]
    description: "Hard stop: the budget or batch cap would be exceeded; a real provider's credentials are missing; validation or QA fails after the stage's bounded retries; a user-owned file would be overwritten (timing.overrides.json, project.yaml, an imported take, an imported vocal stem (HS-56), the series canon)"
  - id: POL-AnswerOpenRounds
    name: Open review rounds are answered before the next autonomous stage
    when: [EVT-ReviewRoundSent]
    then: [CMD-AnswerReviewRound]
    description: An orchestrator rule (/video-next "Review rounds"); one fix pass per round, oldest first, after a running and an open interactive stage. With review mode final, the final review is done with review rounds before qa-export
  - id: POL-RebuildQaAfterFixes
    name: Fixes that change the picture reset qa-export
    when: [EVT-ReviewRoundAnswered]
    then: [CMD-ResetStage]
    description: An orchestrator rule (/video-next "Review rounds" step 4), only when the fix pass changed a render; ADR 0032's unconditional wording is a gap
  - id: POL-JudgeEveryAttempt
    name: Every attempt with a verdict target is judged
    when: [EVT-AttemptGenerated]
    then: [CMD-GiveVerdict]
    description: "In the background while the queue run generates on (at most --reviews, default 2, started at once); an item without a verdict target is filed directly"
  - id: POL-ApplyVerdict
    name: The queue run applies every verdict
    when: [EVT-VerdictGiven]
    then: [CMD-ApplyVerdict]
    description: A verdict on a queue attempt files it, requeues it, or leaves the item waiting for a fix
  - id: POL-ValidateEveryStoryboardEdit
    name: Every storyboard edit is validated
    when: [EVT-StoryboardWritten, EVT-StoryboardRevised]
    then: [CMD-ValidateStoryboard]
    description: "The workspace hook runs validate-file on every edit of storyboard.yaml under projects/ and blocks a failing edit (exit 2)"
  - id: POL-RecordPlannedSpend
    name: Every new generation is billed at its planned cost
    when: [EVT-GenerationCompleted]
    then: [CMD-RecordSpend, CMD-RecordCanonSpend]
    description: "runBatch records the planned cost of every result that is not a reuse and saves the state after each item (generate.ts:753-763); the provider's actual charge stays in the adapter's raw result (user and decided 2026-11-21, HS-92)"
  - id: POL-RestartComfyUIOnFailure
    name: A failed local generation restarts ComfyUI before the next try
    when: [EVT-GenerationFailed]
    then: [CMD-RestartComfyUI]
  - id: POL-ShutDownIdleGpu
    name: An idle or overdue GPU rental is shut down
    when: [EVT-GpuRentalOverdue]
    then: [CMD-ShutDownGpu]
    description: "The watchdog round shuts the rental down when no vast generation ran or waited for VAST_IDLE_MINUTES (30), or when it has run VAST_MAX_HOURS (8) (user, 2026-11-28, feature vast-gpu)"
  - id: POL-ValidateEveryScriptEdit
    name: Every script edit is validated
    when: [EVT-ScriptWritten, EVT-ScriptRevised]
    then: [CMD-ValidateScript]
    description: "The workspace hook runs validate-file on every edit of script.yaml and blocks a failing edit; only the script is checked against the canon, because the timing is rebuilt from it (packages/cli/src/validate-file.ts:134-145)"
  - id: POL-ImportFinishedCharacters
    name: The characters of a finished character bible go into the library
    when: [EVT-StageCompleted, EVT-CharacterBibleWritten]
    then: [CMD-ImportCharacters]
    description: "Code for a music video – stage-done style-character imports every character with a file, and a failure only warns (packages/cli/src/index.ts:786-794); for a series canon a step of the new-series skill (SKILL.md:70). Decided: code for both kinds (HS-131; gap register)"
  - id: POL-ImportFinishedSets
    name: The sets of a finished set bible go into the library
    when: [EVT-StageCompleted, EVT-SetBibleWritten]
    then: [CMD-ImportSets]
    description: "Where the characters come in: stage-done style-character for a music video, the canon once its references passed for a series; a failure only warns"
  - id: POL-LinkNewProjectMedia
    name: A new project's media go to the media directory
    when: [EVT-ProjectCreated]
    then: [CMD-LinkProjectMedia]
    description: "createProject links assets/ and renders/ when CORESLOPPER_MEDIA_DIR is set, for a music video and an episode (packages/cli/src/new-project.ts:182-186); new-series does not (HS-154)"
  - id: POL-RefreshAfterStatusChange
    name: The release folder follows a live URL and an approval
    when: [EVT-LiveUrlRecorded, EVT-ReleaseApproved]
    then: [CMD-BuildReleasePackage]
    description: "The board runs release in the background without renders and new stills, one at a time per project in its process (packages/cli/src/release-board.ts:37-40,158-167,448-462); a stale format keeps its earlier copy, a changed dated image leaves the folder (HS-167)"

  - id: POL-MarkPostedEventDone
    name: A posted calendar event is marked done
    when: [EVT-CalendarEventPosted, EVT-VideoWentPublic]
    then: [CMD-MarkCalendarEventDone]
    description: "The autopilot sets the done mark with by autopilot and the live URL through the release status's writer (release-autopilot.ts:306-308,357-358)"
  - id: POL-PostsWaitForMainVideo
    name: Posts that link to the main video follow it
    when: [EVT-VideoWentPublic]
    then: [CMD-PostCalendarEvent]
    description: "The X release post and LinkedIn are blocked until the main video is done with its URL, then due in the same round (packages/core/src/autopilot.ts:123,198-200; release-autopilot.ts:242-252)"
  - id: POL-CommentWhenPublic
    name: The main video gets its comment when it is public
    when: [EVT-VideoWentPublic, EVT-CalendarEventMarkedDone]
    then: [CMD-PostPinnedComment]
    description: "Also when the user switched the video public in Studio and ticked it off on the board (release-autopilot.ts:278-285,319-325)"
  - id: POL-InstallAfterUpdate
    name: An update that changed something installs the dependencies
    when: [EVT-WorkspaceUpdated]
    then: [CMD-InstallDependencies]
    description: "update runs npm install and uv sync when it changed a file and --no-install is not set; the board container installs again when package-lock.json changed (update.ts:317-327; docker/entrypoint.sh:19-26)"
  - id: POL-ScoreEveryBenchCase
    name: Every bench case of a run gets scored
    when: [EVT-BenchResultRecorded, EVT-BenchResultRefused]
    then: [CMD-ScoreBenchCase]
    description: "The model-bench skill dispatches one art director per case once the run is done; the main context never views the media (SKILL.md step 6)"
  - id: POL-ReportAfterBenchRun
    name: A bench run ends with its report
    when: [EVT-BenchResultRecorded, EVT-BenchResultRefused, EVT-BenchResultFailed, EVT-BenchResultSkipped]
    then: [CMD-BuildBenchReport]
    description: "bench run writes index.html after its last generation, and the skill rebuilds it after scoring; a budget error mid-run writes none (bench.ts:703; SKILL.md step 7)"

  - id: POL-ValidateEverySoundEntryEdit
    name: Every sound entry edit is validated
    when: [EVT-LibrarySoundUpdated]
    then: [CMD-ValidateLibrarySound]
    description: "The workspace hook runs validate-file on every edit of a sound.yaml"
  - id: POL-TakeChosenLibrarySounds
    name: A sound line with a library sound gets its take from the library
    when: [EVT-ScriptWritten, EVT-LibrarySoundUpdated, EVT-LibrarySoundRemeasured]
    then: [CMD-GenerateTakes]
    description: "voice-track copies the trimmed library sound as a take instead of generating; a changed trim or file makes the take stale and it is copied again on the next voice-track; a removed sound only warns"

