    resolution: "One context, Generation (BC-Generation): role resolution, the budget check per batch, the generation cache, the manifest and the provider adapters. The queue stays in BC-GenerationQueue, the budget ledger in AGG-Project (BC-Pipeline); the bench and the voice track are its callers (recommendation, not reviewed by the user – delegated, 2026-11-21)"
  - id: HS-88
    question: "Which consistency boundaries does generation have – a batch (not stored), the cache record per key, the manifest (an append-only log), config/models.yaml?"
    refs: [AGG-CachedGeneration, AGG-ModelRoles]
    status: resolved
    resolution: "Two as-is aggregates: the cached generation per cache key and the model roles file. The manifest is an append-only log outside them, like the verdict log; a batch is a command, not state. Only the agent changes the model roles (user, 2026-11-21) (recommendation, not reviewed by the user – delegated, 2026-11-21)"
  - id: HS-89
    question: "The cache is workspace-wide, so one project reuses another's result at $0, and its key hashes each reference's path, so the same file elsewhere misses. Intended?"
    refs: [AGG-CachedGeneration]
    status: resolved
    resolution: "Sharing the cache across the workspace is intended (a series' canon and its episodes reuse references); the key should depend on content, not on paths – gap, low (recommendation, not reviewed by the user – delegated, 2026-11-21)"
  - id: HS-90
    question: "The budget check before a batch counts cache hits at full price, so a batch that costs nothing can be refused. Count only the items that will run?"
    refs: [CMD-RunGenerationBatch]
    status: resolved
    resolution: "Keep the worst-case check: it is conservative, cheap, and the queue sends one item per batch, so it rarely refuses a free item. Documented as intended (recommendation, not reviewed by the user – delegated, 2026-11-21)"
  - id: HS-91
    question: "The queue run calls runBatch once per item, so the batch cap guards one item and nothing guards a whole run apart from the project budget; the per-call hook beforeGenerate is set by no caller. Rule?"
    refs: [CMD-RunGenerationBatch]
    status: resolved
    resolution: "The project budget is the hard limit of a queue run; the batch cap limits one batch. beforeGenerate is dead and goes – gap, low (recommendation, not reviewed by the user – delegated, 2026-11-21)"
  - id: HS-92
    question: "Spend is the planned estimate, not the provider's charge (Topview's charged_usd stays in the raw result). Does the recorded spend have to match the manifest?"
    refs: [AGG-Project, RM-Manifest]
    status: resolved
    resolution: "The recorded spend is the planned cost of every new generation, and it equals the manifest's cost sum (the QA checker's rule). The user reads spend on the board only and does not compare it with the providers' bills (user, 2026-11-21). A paid call without a manifest line, and the spend command without one, are gaps (recommendation, not reviewed by the user – delegated, 2026-11-21)"
  - id: HS-93
    question: "budget.reservedUsd is subtracted from the remaining budget and shown on the board, but nothing ever writes it. Reservation or dead?"
    refs: [AGG-Project]
    status: resolved
    resolution: "Dead: remove it from the state and the board – gap, low (recommendation, not reviewed by the user – delegated, 2026-11-21)"
  - id: HS-94
    question: "The spend command raises the recorded spend without a manifest line, which fails the QA checker. Keep it?"
    refs: [CMD-RecordSpend]
    status: resolved
    resolution: "Every recorded spend has a manifest line; the spend command writes one or goes. Low: the user runs no generation command by hand (user, 2026-11-21) (recommendation, not reviewed by the user – delegated, 2026-11-21)"
  - id: HS-95
    question: "estimate checks only the batch cap, prints a mark and exits 0; a missing price is a ValidationError there and a ConfigError in generate; providers.md documents an estimate flag --lipsync-provider that does not exist. Rule?"
    refs: [CMD-EstimateGeneration]
    status: resolved
    resolution: "estimate applies the same provider choice, both limits and the same errors as generate, and fails when a run would be refused – gap, low (recommendation, not reviewed by the user – delegated, 2026-11-21)"
  - id: HS-96
    question: "config/defaults.yaml has a retries block (4 attempts, 1000 ms, 600000 ms) that no adapter reads; every adapter has its own timeout and the HTTP helper its own backoff. Wire it or remove it?"
    refs: [BC-Generation]
    status: resolved
    resolution: "The adapters own their timeouts and backoff; the dead block goes – gap, low (recommendation, not reviewed by the user – delegated, 2026-11-21)"
  - id: HS-97
    question: "fal submissions are retried up to four times on 408, 409, 429, 5xx and network errors without an idempotency key; ADRs 0011 and 0021 derive the key from the request hash. Can a retry charge twice?"
    refs: [CMD-RunGenerationBatch]
    status: resolved
    resolution: "A paid submission is never charged twice: an adapter retries a submission only with an idempotency key the provider honours, or only while the provider cannot have accepted it – gap, medium (the user uses fal, Higgsfield and Topview) (recommendation, not reviewed by the user – delegated, 2026-11-21)"
  - id: HS-98
    question: "'provider', 'adapter' and 'backend' name one thing; 'model' is a cloud slug or a ComfyUI workflow name; roles, operations and single generations have no glossary entry. Terms?"
    refs: [BC-Generation]
    status: resolved
    resolution: "Provider is the selection per kind (providers.image, .video, .lipsync, .audio); Provider Adapter its implementation; 'backend' avoided. New glossary entries: Model Role, Generation Operation, Generation, Generation Cache, Project Budget, Batch Cap (recommendation, not reviewed by the user – delegated, 2026-11-21)"
  - id: HS-99
    question: "The glossary's Video Model says ltx is the default for every operation including lip-sync and calls it a 'clip backend', but Pika is the default for reference-to-video and local lip-sync, chosen by the role's workflow. Which holds?"
    refs: [BC-Generation]
    status: resolved
    resolution: "The code: Video Model (ltx or wan) chooses the workflow of image-to-video and first-last-frame clips on ComfyUI; Pika clips and local lip-sync come from the role's workflow. Glossary corrected (recommendation, not reviewed by the user – delegated, 2026-11-21)"
  - id: HS-100
    question: "Provider knowledge sits outside the adapters: about 280 lines of ComfyUI, Pika, LTX, Wan and SeedVR2 routing in generate.ts, the provider list four times in core and once in providers, 'local costs nothing' three times, the bench's workflow folder ignored by the Pika check. Rule?"
    refs: [BC-Generation]
    status: resolved
    resolution: "Provider-specific rules belong in the adapter or in the model roles, the provider list exists once, and adding a provider means an adapter and a list entry (ADR 0021) – gap, low (recommendation, not reviewed by the user – delegated, 2026-11-21)"
  - id: HS-101
    question: "Docs contradict the code on capabilities: the glossary and providers.md say the cloud adapters do every operation and ComfyUI only video and lip-sync; providers.md, comfyui/README.md and ADR 0017 name LTX as the local lip-sync, models.yaml and ADR 0027 Pika; providers.md says lip-sync defaults to the video provider. Which is right?"
    refs: [BC-Generation]
    status: resolved
    resolution: "The code and config/models.yaml: the cloud adapters have no reference-to-video, audio or restore; ComfyUI does stills, edits, clips, lip-sync (Pika first, LTX as fallback) and audio; lip-sync falls back to fal when video is comfyui or topview. Glossary corrected now; the other docs are a gap, medium, because the agent reads them when it changes the model roles (recommendation, not reviewed by the user – delegated, 2026-11-21)"
  - id: HS-102
    question: "No ADR records the generation funnel as it is – one runBatch for every caller, the worst-case budget check, a workspace-wide cache, planned spend, nine operations. ADR 0006 still says three operations and 'batch state is resumable'. Record it?"
    refs: [BC-Generation]
    status: resolved
    resolution: "ADR 0041, Proposed: one generation path, the budget check per batch, the workspace cache by content, planned spend equal to the manifest, no double charge, provider rules in adapters and model roles; amends 0006, 0014 and 0017 (recommendation, not reviewed by the user – delegated, 2026-11-21)"
  - id: HS-103
    question: "The slice holds the series' budget and episode plan and the episode's script, takes, episode track and subtitles. One context, or a canon context and an episode-audio context?"
    refs: [BC-Series]
    status: resolved
    resolution: "One context, Series (BC-Series): the series budget and episode plan, the creation of episodes, the script, the take registry, the episode track, subtitles and lip-sync audio. The canon files (characters, sets, plates, props, style) belong to the character slice; an episode's stages to BC-Pipeline; generation to BC-Generation (recommendation, not reviewed by the user – delegated, 2026-11-22)"
  - id: HS-104
    question: "Which consistency boundaries does the code show?"
    refs: [AGG-Series, AGG-Script, AGG-TakeRegistry, AGG-EpisodeTrack]
    status: resolved
    resolution: "Four as-is aggregates: the series (series.yaml and state.json with the commitment across its episodes), the script (validated whole), the take registry (takes.json with its files) and the episode track (timing, mix and stems written together) (recommendation, not reviewed by the user – delegated, 2026-11-22)"
  - id: HS-105
    question: "Canon generations are checked against the series total minus canon spend only; episode budgets are not subtracted, so the canon can spend money already promised to episodes, against the glossary's Series Budget. Which holds?"
    refs: [AGG-Series]
    status: resolved
    resolution: "The glossary: canon spend plus every episode budget fits in the series budget, also for a canon generation – gap, medium (recommendation, not reviewed by the user – delegated, 2026-11-22)"
  - id: HS-106
    question: "new-series, the skill and the glossary require a series budget; the schema makes budget_usd optional and a test pins that episodes are then unchecked. Is a series without a budget legal?"
    refs: [AGG-Series]
    status: resolved
    resolution: "No: every series has a budget; the schema follows the command. The demo series has one – gap, low (recommendation, not reviewed by the user – delegated, 2026-11-22)"
  - id: HS-107
    question: "The series budget lives in series.yaml (budget_usd) and in state.json (budget.totalUsd), and the skill tells the agent to change both by hand. Which is the source?"
    refs: [AGG-Series]
    status: resolved
    resolution: "As for a project (HS-5): budget_usd in series.yaml is the source, state.json a copy that must stay equal; no command changes a series budget – gap, low, beside G-13 (recommendation, not reviewed by the user – delegated, 2026-11-22)"
  - id: HS-108
    question: "new --kind episode accepts an episode number the series already has; series-status only reports the duplicate. Refuse it?"
    refs: [CMD-CreateEpisode]
    status: resolved
    resolution: "Yes: an episode number belongs to one episode; new and the wizard refuse a taken one. An episode outside the plan stays allowed – gap, low (recommendation, not reviewed by the user – delegated, 2026-11-22)"
  - id: HS-109
    question: "'unplanned' means a planned episode without a project in production.ts and an episode outside the plan in the series-status test. Terms?"
    refs: [RM-SeriesStatus]
    status: resolved
    resolution: "Planned episode for an entry of the episode plan; an episode outside the plan for a project the plan does not list; the code field unplanned is a spelling to avoid – gap, low (recommendation, not reviewed by the user – delegated, 2026-11-22)"
  - id: HS-110
    question: "Canon readiness counts a reference voice as a gap only when a listed file is missing; a character with no voice at all passes, and the comment says 'speaking characters without a reference voice'. Which holds?"
    refs: [RM-SeriesStatus]
    status: resolved
    resolution: "A character without a reference voice is a canon gap unless the series' audio provider is mock (every line recorded); voice-track still stops on a speaker without one – gap, low (recommendation, not reviewed by the user – delegated, 2026-11-22)"
  - id: HS-111
    question: "The take's text hash leaves out the speaker's reference voice, so a changed voice keeps every old take current. Should a voice change make takes stale?"
    refs: [AGG-TakeRegistry]
    status: resolved
    resolution: "Yes: the content hash of the reference voice and its transcript is part of a spoken take's source – gap, medium, because the user generates every voice (user, 2026-11-22: voices are generated on ComfyUI) (recommendation, not reviewed by the user – delegated, 2026-11-22)"
  - id: HS-112
    question: "direction ('Acting direction for the take') is written by the skill but never read: it does not reach the voice model and is not hashed. A leading voice description in brackets in the spoken text is the only way a direction reaches the model today. Wire it or drop it?"
    refs: [AGG-TakeRegistry]
    status: resolved
    resolution: "One mechanism: direction is the acting direction; voice-track sends it as the leading voice description and hashes it, and the bracket form in the spoken text stays accepted – gap, low (recommendation, not reviewed by the user – delegated, 2026-11-22)"
  - id: HS-113
    question: "The spoken text is text_de, the TTS rule's abbreviations and the audio.voice notes are German, subtitles are English only, while the new-series skill grills 'the languages of speech and subtitles' and the glossary calls subtitles 'translated text'. Decision or leftover?"
    refs: [AGG-Script, CMD-WriteSubtitles]
    status: resolved
    resolution: "German speech with English subtitles is how the product works today and how it is used (user, 2026-11-22); language-bound fields are a known lock-in. The spoken and subtitle language become series settings when a series in another language needs them; until then nothing is renamed – gap, low (recommendation, not reviewed by the user – delegated, 2026-11-22)"
  - id: HS-114
    question: "limits.episode_seconds is checked only in QA; series-status.md says the command checks the length against it. Where is the episode length checked?"
    refs: [AGG-EpisodeTrack]
    status: resolved
    resolution: "When the episode track is built, which is the first point that knows the length; QA keeps its check; series-status.md is corrected – gap, low (recommendation, not reviewed by the user – delegated, 2026-11-22)"
  - id: HS-115
    question: "Take status, the blocking rule and the series budget sit in cli, while the conventions put domain rules in core and name only the queue as an exception. Accident or decision?"
    refs: [AGG-TakeRegistry, AGG-Series]
    status: resolved
    resolution: "Accident: the take status and blocking rule and the series budget sum are domain rules and belong in core; file access stays in cli – gap, low (recommendation, not reviewed by the user – delegated, 2026-11-22)"
  - id: HS-116
    question: "SubtitleCue is defined in core (with id) and again in remotion (without). One definition?"
    refs: [EVT-SubtitlesWritten]
    status: resolved
    resolution: "One definition in core, which remotion may import – gap, low; the render slice owns the composition side (recommendation, not reviewed by the user – delegated, 2026-11-22)"
  - id: HS-117
    question: "ADR 0016 says an episode never writes the canon; ADR 0025 lets it append plates, props and states but never change an existing entry; generate lets an episode's out path reach any file of the canon folder, existing ones included. Which holds?"
    refs: [AGG-Series]
    status: resolved
    resolution: "ADR 0025: an episode adds new canon files and entries but never overwrites an existing one; the code refuses an episode's out path onto an existing canon file – gap, medium. The canon files' own rules belong to the character slice (recommendation, not reviewed by the user – delegated, 2026-11-22)"
  - id: HS-118
    question: "Terms: the glossary lists 'voice track' under Speaker Stem's Avoid, but Voice Track is the stage that makes takes and ambience; the schema calls the ambience prompt atmo; take statuses, the take registry, the uncommitted series budget, canon gaps and lip-sync audio have no glossary entry."
    refs: [BC-Series]
    status: resolved
    resolution: "Voice Track is the stage that makes the takes and ambience (glossary entry; removed from Speaker Stem's Avoid); Ambience stays the term and atmo its field spelling; new entries Take Registry, Take Status, Uncommitted Series Budget, Canon Gap, Planned Episode (recommendation, not reviewed by the user – delegated, 2026-11-22)"
  - id: HS-119
    question: "Code comments call a series 'a project of its own'; the glossary's Project is one music video or one episode. Is a series a project?"
    refs: [BC-Series]
    status: resolved
    resolution: "No: a project is what runs through stages (a music video or an episode, project.yaml); a series lives in projects/ beside its episodes (ADR 0035) but is not a project. The comments are a spelling to avoid (recommendation, not reviewed by the user – delegated, 2026-11-22)"
  - id: HS-120
    question: "ADR 0016 is out of date: 'first version' with a hand-written canon and new-series later (shipped the same day), takes.json without file_hash, 'never writes the canon', series/ paths (moved by ADR 0035). Record the slice as it is?"
    refs: [BC-Series]
    status: resolved
    resolution: "ADR 0042, Proposed: the series budget as a commitment, episode settings copied once, the canon append-only for episodes, the take registry and its staleness, the constructed episode track, the spoken language as it is; amends 0016 (recommendation, not reviewed by the user – delegated, 2026-11-22)"
  - id: HS-121
    question: "Who changes script.yaml after the script stage?"
    refs: [AGG-Script]
    status: resolved
    resolution: "Only the agent, when the user asks; the user never edits the file (user, 2026-11-22)"
  - id: HS-122
    question: "The series budget is checked only when an episode is created: a later change of an episode's budget_usd and two creations at once go unchecked, and nothing locks the files. Enough?"
    refs: [AGG-Series]
    status: resolved
    resolution: "The commitment holds whenever an episode budget changes too; the check runs where budgets change, once a budget command exists (G-13, G-107). Parallel creation stays unguarded: one setup skill or wizard runs at a time – gap, low (recommendation, not reviewed by the user – delegated, 2026-11-22)"

flows:
  - id: FLOW-AutonomousStage
    name: One autonomous stage
    sequence: [ACT-Orchestrator, CMD-StartStage, EVT-StageStarted, ACT-StageRunner, CMD-CompleteStage, EVT-StageCompleted, POL-RunNextStage]
  - id: FLOW-ReviewRound
    name: From a note to its reply
    sequence: [ACT-User, CMD-AddReviewNote, EVT-ReviewNoteAdded, CMD-SendReviewRound, EVT-ReviewRoundSent, POL-AnswerOpenRounds, CMD-AnswerReviewRound, EVT-ReviewRoundAnswered, POL-RebuildQaAfterFixes]
  - id: FLOW-QueueItem
    name: From a queue item to a filed attempt
    sequence: [ACT-StageRunner, CMD-AddQueueItem, EVT-QueueItemAdded, CMD-RunQueue, EVT-AttemptGenerated, POL-JudgeEveryAttempt, CMD-GiveVerdict, EVT-VerdictGiven, POL-ApplyVerdict, CMD-ApplyVerdict, EVT-AttemptFiled]
  - id: FLOW-SongTiming
    name: From the song to the effective timing
    sequence: [ACT-User, CMD-WriteLyrics, EVT-LyricsWritten, ACT-SetupSkill, CMD-ImportSong, EVT-SongImported, ACT-StageRunner, CMD-AnalyzeSong, EVT-SongAnalyzed, RM-TimingReport, CMD-OverrideTiming, EVT-TimingOverridden, RM-EffectiveTiming]
  - id: FLOW-Storyboard
    name: From the treatment to the resolved storyboard
    sequence: [ACT-StageRunner, CMD-WriteStoryboard, EVT-StoryboardWritten, POL-ValidateEveryStoryboardEdit, CMD-ValidateStoryboard, EVT-StoryboardValidated, RM-ResolvedStoryboard, CMD-WriteContactSheet, EVT-ContactSheetWritten, RM-ContactSheet]
  - id: FLOW-Generation
    name: From a batch item to a billed generation
    sequence: [ACT-QueueRun, CMD-RunGenerationBatch, EVT-GenerationCompleted, POL-RecordPlannedSpend, CMD-RecordSpend, EVT-SpendRecorded, RM-Manifest]
  - id: FLOW-Episode
    name: From a series to a created episode
    sequence: [ACT-SetupSkill, CMD-CreateSeries, EVT-SeriesCreated, CMD-CreateEpisode, EVT-EpisodeCreated, RM-SeriesStatus]
  - id: FLOW-EpisodeTrack
    name: From the script to the episode track
    sequence: [ACT-SetupSkill, CMD-WriteScript, EVT-ScriptWritten, POL-ValidateEveryScriptEdit, CMD-ValidateScript, EVT-ScriptValidated, ACT-StageRunner, CMD-GenerateTakes, EVT-TakeGenerated, CMD-BuildEpisodeTrack, EVT-EpisodeTrackBuilt, CMD-WriteSubtitles, EVT-SubtitlesWritten]
