# Event storming model
#
# Single source of truth for events, commands, policies, read models, aggregates and bounded contexts.
# Format: .claude/skills/event-storming/templates/events.example.yaml
# Schema: .claude/skills/event-storming/schema/events.schema.json
#
# Written by /bootstrap, /adopt, /event-storming and /feature. Validated and rendered to
# docs/domain/event-storming.md after every write. An empty model is valid: it grows during discovery.
#
# Aggregates carry an optional status: target (default when missing), as-is (factual boundary, needs evidence),
# or unresolved (boundary unclear, needs an open hotspot and grilling; no story on it can be ready).
#
# Glossary: docs/glossary.md (ships to every workspace). CONTEXT.md points there.
#
# Slices adopted 2026-11-21: project and stage pipeline (confirmed); human review (confirmed); art-director verdicts and the
# generation queue (decided by recommendation, not reviewed by the user – see the adoption report); song timing and lyrics
# (decided by recommendation, four answers from the user); storyboard and generation (decided by recommendation, four answers from the user each).
# See docs/domain/adoption-report.md.

version: 1
domain: coreslopper

actors:
  - id: ACT-User
    name: User
  - id: ACT-Orchestrator
    name: Orchestrator
  - id: ACT-SetupSkill
    name: Setup skill
  - id: ACT-StageRunner
    name: Stage runner
  - id: ACT-BoardWizard
    name: Board wizard
    description: The board's + New form; it may complete the setup stage and nothing else (ADR 0037, proposed)
  - id: ACT-ArtDirector
    name: Art director
    description: The automated critic, run headless by review-image (claude -p --agent art-director) for every queue attempt and single verdicts
  - id: ACT-QueueRun
    name: Queue run
    description: The one queue run process per project (queue run) that generates ready items in order and hands every attempt to the art director

external_systems:
  - id: EXT-Provider
    name: Generation provider
  - id: EXT-ComfyUI
    name: ComfyUI server
    description: The local generation server; the queue run restarts it through COMFYUI_RESTART_COMMAND when a generation fails or hangs
  - id: EXT-AudioModels
    name: Local audio models
    description: Demucs (vocal separation), WhisperX (speech recognition and word alignment), librosa (beats, onsets, energy) and the MelBand-Roformer karaoke model (lead stem), run locally by the song analysis (ADR 0008, 0026)
  - id: EXT-FFmpeg
    name: FFmpeg
    description: Converts recordings and generated audio to 48 kHz mono WAV, mixes the episode track and the speaker stems, raises the mix to the loudness target and cuts lip-sync audio segments (packages/cli/src/episode-track.ts, media.ts)

bounded_contexts:
  - id: BC-Pipeline
    name: Pipeline
    purpose: Drives one project from setup to qa-export through the stages of its project kind and keeps its budget
  - id: BC-Review
    name: Review
    purpose: The user's frame-accurate notes on renders, sent to the agent in rounds and answered note by note
  - id: BC-GenerationQueue
    name: Generation queue
    purpose: Gets every generated image and clip of a project approved before anything derives from it – generate an attempt, give it a verdict, requeue it with the fix prompt, or file it
  - id: BC-Timing
    name: Timing
    purpose: Turns the user's song and lyrics into a measured timing, merges the user's timing overrides into the effective timing, and resolves symbolic anchors to seconds for every later stage
  - id: BC-Storyboard
    name: Storyboard
    purpose: Turns the treatment or script, the effective timing and the bibles into an ordered list of shots that covers the song or episode track, checks every shot's source, continuity references and limits, and hands resolved shots to the queue, render, QA and review
  - id: BC-Generation
    name: Generation
    purpose: Turns the items of a generation batch into provider calls for a model role – each refused up front when the batch does not fit the budget, served from the generation cache when the same request ran before, recorded in the manifest, and billed to the project budget at its planned cost
  - id: BC-Series
    name: Series
    purpose: Keeps a series' umbrella budget and episode plan and creates its episodes, and turns an episode's script into takes, an episode track with speaker stems, subtitles and lip-sync audio – the episode's replacement for the song

aggregates:
  - id: AGG-Project
    name: Project
    context: BC-Pipeline
    status: as-is
    evidence:
      - state.json per project, loaded and saved as one document (packages/core/src/project.ts:171-184,233-236)
      - stage transitions mutate one State (packages/core/src/state.ts:250-324)
      - budget ledger inside the same State (packages/core/src/state.ts:326-341)
    invariants:
      - Spend never exceeds the project budget total (the code enforces it in recordSpend, state.ts:330)
      - Every stage of the project kind's stage list has a stage state (the code adds missing ones in migrateState, state.ts:207)
      - The kind in state.json equals the kind in project.yaml (the code enforces it in validate-file, validate-file.ts:175)
      - The budget total in state.json equals budget_usd in project.yaml (the code enforces it in validate-file, validate-file.ts:164)
      - A stage is started, done or skipped only when every earlier stage of the kind's list is done or skipped (confirmed 2026-11-21; not enforced in code – gap register)
      - No writer loses another writer's change to the project state, and no recorded spend is lost (confirmed 2026-11-21; not enforced, state.json has no write lock – gap register)
      - The project's error history only grows; the current error of a stage is its last error (the code does this, state.ts:293)
      - The recorded spend equals the cost sum of the project's manifest – the planned cost of every new generation (the QA checker checks it, packages/cli/src/qa.ts:230-262; decided 2026-11-21, HS-92 – the spend command and a paid call that returns no file break it, gap register)
  - id: AGG-ProjectReview
    name: Project review
    context: BC-Review
    status: as-is
    evidence:
      - one lock per project review folder, review/.notes.lock, around every note change and every send (packages/cli/src/board-review.ts:38,202,238)
      - round numbers from all rounds of the project (packages/core/src/review.ts:37; board-review.ts:242)
      - notes per render in review/notes/<video-stem>.json, rounds in review/rounds/<NNN>.json (board-review.ts:50,62-78)
    invariants:
      - A sent note never changes (the board enforces it, board-review.ts:213; the desktop player does not)
      - Round numbers are unique and ascending per project (the code takes the highest plus one under the lock)
      - A round holds every draft of one render at the time it was sent, at least one (board-review.ts:240-241)
      - A round's replies answer every note of the round and no other (validate-file, validate-file.ts:219-232; not checked when a round counts as answered)
      - A round is answered exactly once, by one fix pass (confirmed 2026-11-21; the code does not check it)
      - A note is sent in exactly one round (confirmed 2026-11-21; a crash between the two writes of a send breaks it – gap register)
      - A round is open until a valid replies file answers every note of it; an unreadable round counts as open, never as nothing open (confirmed 2026-11-21; the code counts any replies file – gap register)
      - Notes and rounds belong to the user; only the board and the desktop player write them, the agent writes only replies (confirmed 2026-11-21; an instruction only – gap register)
      - Every writer of notes – the board and the desktop player – keeps sent notes unchanged and loses no other writer's change; a note's frame is floor(seconds × format fps) (confirmed 2026-11-21; the desktop player breaks all three – gap register)
  - id: AGG-GenerationQueue
    name: Generation queue
    context: BC-GenerationQueue
    status: as-is
    evidence:
      - assets/queue.json per project, read, changed and written whole on every change (packages/cli/src/queue.ts:101-119)
      - an item waits for the items in its after list across the whole queue (queue.ts:524-529); order numbers are taken from the whole queue (queue.ts:127)
      - one queue run per project, pid lock assets/queue.lock (queue.ts:562-578,671-674)
    invariants:
      - Only an approved attempt is filed at the item's out path – a pass verdict, a hand accept, or an item without a verdict target (the code does this, queue.ts:689-693,493,775-782)
      - An item starts only when every item in its after list has passed or is not in the queue (the code does this, queue.ts:524-529)
      - Attempts of an item are numbered by the queue without gaps, region patches included; a replaced item keeps its attempts and keeps counting (decided 2026-11-21, HS-40; the code numbers patches separately – gap register)
      - At most one queue run works on a project at a time (decided 2026-11-21, HS-41; the pid lock is check-then-write, queue.ts:671-674 – gap register)
      - An item has at most 3 local attempts and one cloud attempt since its last replace, clips included (decided 2026-11-21, HS-39; only the automatic requeue of images is capped – gap register)
      - A user's accept is final; no automatic step undoes it (decided 2026-11-21, HS-42; a verdict that lands after an accept overwrites it today – gap register)
      - An item that is generating or reviewing is not accepted, requeued, replaced or dropped (decided 2026-11-21, HS-38; accept has no check – gap register)
      - No writer of queue.json loses another writer's change (decided 2026-11-21, HS-41; no lock around read-modify-write – gap register)
  - id: AGG-ProjectTiming
    name: Project timing
    context: BC-Timing
    status: as-is
    evidence:
      - timing.json and timing.overrides.json per project are parsed and merged into one effective timing on every project load, and the merge ends in one check of the whole timing (packages/core/src/project.ts:237-241; packages/core/src/timing.ts:61-94)
      - assertTiming checks sections, lines, words, beats and energy of the merged timing together, so one bad override fails the whole timing (timing.ts:96-165)
      - the analysis writes timing.json whole and never writes the overrides (scripts/audio-analysis/analyze.py:430-432, README.md:10)
    invariants:
      - Sections cover the audio from 0 to its duration without gaps or overlaps, within 0.05 s (the code does this, timing.ts:100-127)
      - Every line names an existing section and lies inside the audio; the words of a line are in order (the code does this, timing.ts:129-145)
      - Every line lies inside its section and every word inside its line (decided 2026-11-21, HS-53; not checked after a timing override – gap register)
      - A timing override changes only times – bpm, beats, downbeats, and the start and end of a section, line or word – and always wins over the measured timing (the code does this, timing.ts:61-90)
      - Every timing override refers to a section, line or word the measured timing has; one that does not is reported by name, and commands that do not read timing still work (decided 2026-11-21, HS-54; today every project load throws – gap register)
      - No tool replaces or regenerates timing.overrides.json; overrides are written only at the user's request (user and decided 2026-11-21, HS-66; the code only seeds an empty file, packages/cli/src/new-project.ts:157-162)
      - Word text and order come from the lyrics; speech recognition supplies only times (ADR 0008; the code does this, scripts/audio-analysis/timing_core.py:310-645)
      - Words in parentheses are backing vocals and are timed like any other word (user, 2026-11-21, HS-50; the analysis turns them into untimed cues or drops them – gap register)
      - The timing's audio duration matches the song it was measured from (decided 2026-11-21, HS-59; not checked – gap register)
  - id: AGG-Lyrics
    name: Lyrics
    context: BC-Timing
    status: as-is
    evidence:
      - writeLyrics checks the whole text for section tags and writes lyrics.txt atomically (packages/cli/src/board-wizard.ts:271-278), used by the lyrics command and the board wizard (packages/cli/src/index.ts:588-608; packages/cli/src/release-board.ts:206)
    invariants:
      - Every sung line sits under a section tag, and at least one tag has lines (the code does this for writeLyrics, board-wizard.ts:274-276; a hand edit of lyrics.txt bypasses it)
      - The lyrics are the authoritative word text and spelling; tags and lines keep the user's order (glossary; ADR 0008)
  - id: AGG-Storyboard
    name: Storyboard
    context: BC-Storyboard
    status: as-is
    evidence:
      - storyboard.yaml per project is parsed whole with StoryboardSchema, only by loadProject (packages/core/src/project.ts:242-243)
      - resolveStoryboard checks all shots together – unique ids, order, coverage, chaining – against the effective timing and the bibles, in one call whose only caller is validateProject (packages/core/src/timing.ts:455-577; packages/cli/src/validate.ts:106)
      - the hook validates the whole project on every edit of storyboard.yaml and blocks a failing edit (workspace/.claude/hooks/validate-artifacts.mjs:13-15; packages/cli/src/validate-file.ts:124-127)
    invariants:
      - Shots cover the song or episode track from frame 0 to its duration with no gap or overlap, each within one frame (the code does this, timing.ts:519-554)
      - Shots are in start order with unique ids shot-NNN, each at least one frame long, and each names a section of the effective timing (the code does this, timing.ts:471-502,515-517; schema.ts:293)
      - Every shot has what its source needs – a known motion component; a keyframe and a video prompt for an AI clip; an asset for footage; two or more renderable layers for a mixed shot (the code does this, timing.ts:396-439); a lip-sync shot needs no video prompt and a chained shot no keyframe prompt (decided 2026-11-21, HS-73; the code requires both prompts – gap register)
      - Every layer of a mixed shot can be rendered – an AI-clip layer has an asset (decided 2026-11-21, HS-82; a video prompt alone passes and renders empty – gap register)
      - Every continuity reference exists – style token, character, set, plate, prop, character state – a plate belongs to one of the shot's sets, and a character state belongs to a character on screen in the shot (the code does this, timing.ts:226-366)
      - In an episode a shot's set and plate are the set of its scene, and a ChatWindow shows chat lines of the shot's own scene (the code does this, timing.ts:296-321,374-393)
      - A lip-sync shot is an AI clip of an existing character who shows a face, no longer than the lip-sync model's maximum and, in an episode, the series' limit – in a music video as in an episode (user and decided 2026-11-21, HS-72; the code checks episodes only – gap register)
      - A highlight is a word of the shot's text (decided 2026-11-21, HS-81; the code accepts any substring the renderer never shows – gap register)
      - A chained shot chains from an existing shot that ends before it starts (the code does this, timing.ts:556-569)
      - Only the agent writes storyboard.yaml, in the storyboard stage and when the user asks for a change (user, 2026-11-21, HS-77)
  - id: AGG-CachedGeneration
    name: Cached generation
    context: BC-Generation
    status: as-is
    evidence:
      - one record per cache key, .cache/generations/<key>/result.json with the provider's files, shared by every project and series of the workspace (packages/providers/src/runner.ts:86-87,167-195; packages/cli/src/generate.ts:711)
      - the key is the SHA-256 of the canonical request – operation, provider, model, prompt, negative prompt, seed, size, duration, params, each reference's path and content hash, the audio hash and start, the workflow fingerprint (runner.ts:53-84; packages/core/src/hash.ts:25-45)
      - runBatch is the one path every generation takes – generate, the queue, region patches, the voice track and the bench (generate.ts:667-672; queue.ts:628; patch.ts:96; voice-track.ts:137,191; bench.ts:577,634,675)
    invariants:
      - A request with the same cache key reuses the cached result instead of calling the provider; a reuse costs nothing (the code does this, runner.ts:86-99)
      - A cached result is reused only while every one of its files exists (the code does this, runner.ts:195-207)
      - A cached result is written once, after the provider returned at least one existing file (the code does this, runner.ts:167-189)
      - The cache key depends on what the provider is sent and on the files' content, not on where a reference file lies (decided 2026-11-21, HS-89; the key also hashes the path – gap register)
      - The cache is shared by every project and series of a workspace (decided 2026-11-21, HS-89; generate.ts:711)
  - id: AGG-ModelRoles
    name: Model roles
    context: BC-Generation
    status: as-is
    evidence:
      - config/models.yaml is parsed whole with ModelsConfigSchema on every batch and estimate (packages/core/src/schema.ts:714-762; packages/cli/src/generate.ts:678)
      - resolveModelRole and providerForRole pick a role's model, params and price for the project's provider in one place (packages/core/src/models.ts:26-98)
    invariants:
      - Every model role names a base provider and model; a role runs on another provider only through its provider alternative or a project's model override (the code does this, models.ts:39-68)
      - A paid provider runs a role only with a known price; a local or mock generation costs nothing (the code does this at resolution, models.ts:62-68, generate.ts:372-380,689 – not when the file is loaded)
      - A Pika workflow loads only the model files its family's lock allows (the code does this, packages/providers/src/comfyui.ts:374-405)
      - Only the agent changes the model roles and a project's model overrides, at the user's request (user, 2026-11-21, HS-88)
  - id: AGG-Series
    name: Series
    context: BC-Series
    status: as-is
    evidence:
      - series.yaml and state.json of projects/<slug>/, loaded together by loadSeries (packages/core/src/project.ts:380-416), created together by new-series (packages/cli/src/new-series.ts:67-104)
      - the uncommitted series budget is computed in one place from the series state and the project.yaml of every episode that names the series (packages/cli/src/series.ts:43-74) and checked by createProject for the CLI and the board wizard (packages/cli/src/new-project.ts:205-216; board-wizard.ts:394)
      - canon generations are booked in the series' own state.json and manifest (packages/cli/src/generate.ts:260-277)
    invariants:
      - The canon's spend plus every episode's budget fits in the series budget, whenever an episode is created, an episode budget changes or the canon generates (decided 2026-11-22, HS-105, HS-122; the code checks it only when an episode is created, and canon generations only against total minus canon spend – gap register)
      - Every series has a budget (decided 2026-11-22, HS-106; new-series requires it, the schema leaves it optional – gap register)
      - budget_usd in series.yaml is the source; state.json budget.totalUsd is a copy that must stay equal (the code enforces it, packages/cli/src/validate-file.ts:50-62, generate.ts:265; HS-107)
      - A series and a project never share a slug (the code does this, new-series.ts:77; ADR 0035)
      - An episode number belongs to one episode of the series (decided 2026-11-22, HS-108; series-status only reports a duplicate – gap register)
      - An episode copies formats, providers and brand from series.yaml once, when it is created; nothing is inherited later (the code does this, new-project.ts:101-134; ADR 0016)
      - An episode may add files to the canon but never overwrites an existing one (decided 2026-11-22, HS-117; generate lets an episode's out path reach any canon file – gap register; the canon files themselves belong to the character slice)
  - id: AGG-Script
    name: Script
    context: BC-Series
    status: as-is
    evidence:
      - script.yaml of an episode, parsed whole with ScriptSchema by loadProject (packages/core/src/project.ts:262; schema.ts:587-657)
      - validateScript checks the whole script against the series canon and throws one error listing every issue (packages/core/src/episode.ts:59-104); the workspace hook runs it on every edit (packages/cli/src/validate-file.ts:134-145)
    invariants:
      - Scene and script line ids are unique; every scene plays in a set of the canon and every speaker is a character of the canon (the code does this, episode.ts:59-104)
      - Every spoken and chat line has a subtitle text; a script with chat lines has a typing speed and a hold (the code does this)
      - Spoken text follows the TTS rule – numbers, symbols and abbreviations spelled out; a leading voice description in brackets is not spoken and not checked (the code does this, episode.ts:29-41; ADR 0015)
      - Script lines play strictly one after another; an overlapping line (with) is refused (the code does this; ADR 0016)
      - Only the agent writes script.yaml, in the script stage and when the user asks for a change (user, 2026-11-22, HS-121)
  - id: AGG-TakeRegistry
    name: Take registry
    context: BC-Series
    status: as-is
    evidence:
      - takes.json of an episode, written whole and sorted by saveTakes (packages/cli/src/takes.ts:51-57); its writers are voice-track and import-takes (packages/cli/src/voice-track.ts:99-200; media.ts:395-460)
      - every take's status follows from its file, the registered file hash and the text hash of its script line (takes.ts:65-87; packages/core/src/episode.ts:139-153)
    invariants:
      - Every audible script line (spoken and sfx) has one take and every scene with an ambience prompt one ambience; chat and pause lines have none (the code does this, episode.ts:135-137; voice-track.ts)
      - A take is current while its file is the registered one and its line's kind, speaker and spoken text – or the effect's prompt and length – are unchanged; an ambience while its prompt is unchanged (the code does this, takes.ts:70-76, episode.ts:139-153)
      - A take also goes stale when its speaker's reference voice or its acting direction changes (decided 2026-11-22, HS-111, HS-112; the text hash leaves both out and direction is never read – gap register)
      - An imported take is never generated over; a replaced or unregistered file, or a stale imported take, stops the voice track until the user imports or deletes it (the code does this, takes.ts:79-87)
      - A stale or missing generated take is generated again without a stop; a current take comes from the registry (the code does this, voice-track.ts)
      - One recording per script line (the code does this, media.ts:395-460)
  - id: AGG-EpisodeTrack
    name: Episode track
    context: BC-Series
    status: as-is
    evidence:
      - episodeTrack places the lines from the take durations and writes timing.json, timing.effective.json, audio/episode.wav and audio/stems/<character>.wav together in one run from the effective timing (packages/cli/src/episode-track.ts:148-253)
    invariants:
      - Every audible line has a current take before the track is built (the code does this, episode-track.ts:157)
      - A spoken line lasts as long as its take, an sfx or pause line its duration, a chat line its characters at the typing speed plus the hold, each followed by its pause; scenes cover the episode from 0 without gaps (the code does this, packages/core/src/episode.ts:156-206)
      - The mix and every speaker stem follow the effective timing, so a timing override moves sound and picture together (the code does this; ADR 0016)
      - The episode track and every speaker stem last exactly the timing's duration, and the mix meets the project's loudness target (the code does this, episode-track.ts:224-253)
      - The timing has no tempo, no beats, downbeats or onsets; its energy is the RMS envelope of the mix (the code does this; ADR 0016)
      - The episode's length stays within the series' episode length, checked when the track is built (decided 2026-11-22, HS-114; only QA checks it – gap register)

events:
  - id: EVT-ProjectCreated
    name: Project created
    aggregate: AGG-Project
    pivotal: true
    data: [Slug, Title, Project kind, Budget, Review mode, Series, Episode number]
  - id: EVT-StageStarted
    name: Stage started
    aggregate: AGG-Project
    data: [Stage, Started at, Stage attempts]
  - id: EVT-StageCompleted
    name: Stage completed
    aggregate: AGG-Project
    data: [Stage, Outputs, Input hash, Finished at]
  - id: EVT-StageFailed
    name: Stage failed
    aggregate: AGG-Project
    data: [Stage, Error, Finished at]
  - id: EVT-StageSkipped
    name: Stage skipped
    aggregate: AGG-Project
    data: [Stage, Reason]
  - id: EVT-StageReset
    name: Stage reset
    aggregate: AGG-Project
    data: [Stage]
  - id: EVT-SpendRecorded
    name: Spend recorded
    aggregate: AGG-Project
    data: [Amount, Spent total]
  - id: EVT-ProjectCompleted
    name: Project completed
    aggregate: AGG-Project
    pivotal: true
    data: [Finished at]
  - id: EVT-ReviewNoteAdded
    name: Review note added
    aggregate: AGG-ProjectReview
    data: [Render, Frame, End frame, Text, Created at]
  - id: EVT-ReviewNoteChanged
    name: Review note changed
    aggregate: AGG-ProjectReview
    data: [Note, Frame, End frame, Text]
  - id: EVT-ReviewNoteDeleted
    name: Review note deleted
    aggregate: AGG-ProjectReview
    data: [Note]
  - id: EVT-ReviewRoundSent
    name: Review round sent
    aggregate: AGG-ProjectReview
    pivotal: true
    data: [Round number, Render, Frame rate, Sent at, Notes with shots and section]
  - id: EVT-ReviewRoundAnswered
    name: Review round answered
    aggregate: AGG-ProjectReview
    pivotal: true
    data: [Round number, Answered at, Render with the fixes, Reply per note with status]
  - id: EVT-QueueItemAdded
    name: Queue item added
    aggregate: AGG-GenerationQueue
    data: [Item id, Kind, Generation item, Out path, Verdict target, After, Chain from, Order]
  - id: EVT-QueueItemReplaced
    name: Queue item replaced
    aggregate: AGG-GenerationQueue
    data: [Item id, Generation item, Next attempt number]
  - id: EVT-AttemptGenerated
    name: Attempt generated
    aggregate: AGG-GenerationQueue
    data: [Item id, Attempt number, Attempt file, Seed, Provider]
  - id: EVT-AttemptGenerationFailed
    name: Attempt generation failed
    aggregate: AGG-GenerationQueue
    data: [Item id, Attempt number, Error]
  - id: EVT-VerdictGiven
    name: Verdict given
    context: BC-GenerationQueue
    pivotal: true
    description: "Recorded in verdicts.jsonl (the record of every verdict, HS-36); a queue attempt holds a copy the queue run decides from"
    data: [Subject, Attempt number, Image, Clip, Verdict, Score, Issues, Fix prompt, Start frame PSNR, Judged at]
  - id: EVT-AttemptFiled
    name: Attempt filed
    aggregate: AGG-GenerationQueue
    pivotal: true
    data: [Item id, Attempt number, Out path]
  - id: EVT-QueueItemRequeued
    name: Queue item requeued
    aggregate: AGG-GenerationQueue
    data: [Item id, Next attempt number, Fix prompt, Seed, Focus, Order]
  - id: EVT-QueueItemNeedsFix
    name: Queue item needs a fix
    aggregate: AGG-GenerationQueue
    data: [Item id, Attempt number, Focus, Note]
  - id: EVT-AttemptAccepted
    name: Attempt accepted
    aggregate: AGG-GenerationQueue
    data: [Item id, Attempt number, Note]
  - id: EVT-QueueItemDropped
    name: Queue item dropped
    aggregate: AGG-GenerationQueue
    data: [Item id]
  - id: EVT-RegionPatched
    name: Region patched
    aggregate: AGG-GenerationQueue
    description: "An attempt of its queue item (HS-40); the code writes the attempt file and assets/review/patches.jsonl but not queue.json – gap register"
    data: [Image, Box, Prompt, References, Attempt number, Attempt file, Subject]
  - id: EVT-QueueRunStopped
    name: Queue run stopped
    aggregate: AGG-GenerationQueue
    data: [Reason, Items needing a fix]
  - id: EVT-SongImported
    name: Song imported
    context: BC-Timing
    description: "audio/song.wav and audio/stems/vocals.wav registered in song.json, other formats converted to 48 kHz WAV; a stem whose length differs from the mix by more than 0.5 s only warns (packages/cli/src/media.ts:252-312)"
    data: [Song file, Vocal stem, Duration, Source files]
  - id: EVT-SongLoudnessNormalized
    name: Song loudness normalized
    context: BC-Timing
    description: "normalize-audio writes audio/song.wav at -14 LUFS / -1 dBTP; song.json is not updated (media.ts:169-194)"
    data: [Song file, Source file]
  - id: EVT-LyricsWritten
    name: Lyrics written
    aggregate: AGG-Lyrics
