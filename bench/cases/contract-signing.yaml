prompt: "Replace this plain grey canvas with a new wide 16:9 photo, using the reference images only for the
  people's identity, face and costume: a bright glass-walled meeting room in cold daylight, straight-on
  frontal medium shot at seated eye level from across a plain white table. The white table runs horizontally
  across the whole lower third of the frame, parallel to the camera; its straight front edge is the bottom of
  the frame and its far edge is a clean horizontal line at waist height of the two people. Behind the far edge
  of the table two people sit side by side on two separate black high-backed office chairs, with a clear gap
  of about one metre between them: on the left the manager from the third reference image (same face, hair,
  navy suit, tie), on the right the agency woman from the second reference image (same face, dark hair tied
  back, thick black glasses, grey hoodie under a grey blazer). Both are seated behind the table, the table
  edge in front of their waists, their lower bodies hidden behind the table, the black chair backs clearly
  visible behind their shoulders. Both forearms of each person rest on the tabletop. The manager's right hand
  holds a pen over a blank sheet of paper lying on the tabletop in front of him, his left hand lies flat on
  the tabletop beside the paper; the woman's hands rest flat on the tabletop, she beams with a too-bright
  smile. Behind them the glass wall of the room. Natural relaxed eyes. Photoreal, cinematic music-video still,
  natural anatomy, natural hands with five fingers each, hands clearly visible and separated, no text, no
  letters, no logos. Both people inside the centre half of the frame so the shot survives a vertical 9:16
  centre crop. All papers are plain and blank with no writing."
