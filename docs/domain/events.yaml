  - id: RM-LatestVerdicts
    name: Latest verdicts
    fed_by: [EVT-VerdictGiven, EVT-AttemptAccepted]
    used_by: [ACT-Orchestrator, ACT-StageRunner, ACT-User]
    fields: [Subject, Verdict, Score, Attempt number, Image or clip, Blocking issues]
    description: "verdicts [--failed] and the board's failed verdicts: the last verdict per subject, a clip apart from its keyframe; an accepted subject shows as accepted, not failed (HS-37; missing – gap register). Read twice today (verdicts.ts, board-production.ts)"
  - id: RM-EffectiveTiming
    name: Effective timing
    fed_by: [EVT-SongAnalyzed, EVT-TimingOverridden]
    used_by: [ACT-StageRunner, ACT-Orchestrator, ACT-User]
    fields: [Audio, Duration, BPM, Beats, Downbeats, Onsets, Energy, Sections, Lines, Words]
    description: "The merge of timing.json and timing.overrides.json, made on every project load; the renderer, storyboard, review, queue, Shorts and release read it (HS-49). validate writes a snapshot, timing.effective.json, for agents and scripts; release falls back to the measured timing – gap register"
  - id: RM-TimingReport
    name: Timing report
    fed_by: [EVT-SongAnalyzed]
    used_by: [ACT-StageRunner, ACT-User]
    fields: [Duration, BPM, Speech recognition used, Vocals source, Overrides present, Sections, Low-confidence boundaries, Low-confidence lines, Lines placed without a match, Echo spans]
