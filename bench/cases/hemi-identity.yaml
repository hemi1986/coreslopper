prompt: "Turn this photo into a cinematic film still: the same bald man with the full dark beard with grey
  strands, keep his face, eyes, nose, beard shape and identity exactly identical. Fill the dark grey side bars
  by extending the scene naturally so the frame is one continuous image. He sits at a desk, chest-up, centred,
  facing a monitor just below the camera, staring at it with a puzzled frown, eyebrows pulled together, mouth
  closed. Replace his shirt with a plain black crew-neck t-shirt with NO print, no text, no logo, no graphic;
  remove the necklace completely, bare neck. The room is now a cold, grey open-plan office at night: grey
  cubicle partitions, empty desks, rows of long white fluorescent neon tubes on the ceiling behind him, softly
  out of focus. His face and beard are lit from the front and below by the harsh red glow of a computer
  monitor showing an error; the rest of the office is cold blue-white from the neon tubes. No shelves, no
  posters, no masks, no figures, no bottles, no ceiling spotlights, no recognisable objects, no brand items.
  Realistic, photographic, cinematic, one person only, no text, no letters, no logos"
