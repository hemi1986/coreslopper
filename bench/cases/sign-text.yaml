id: sign-text
title: Poster with a readable word
sets:
  - core
focus: "Text rendering: one German word spelled correctly and legibly in the image."
source:
  project: kriegsrendite
  note: New prompt in the poster style of the project (FRIEDEN / KAUFEN were Remotion text there).
operation: generateImage
role: image.keyframe
seed: 8642
prompt: 'Vintage 1915-1935 propaganda poster lithograph pasted on a weathered grey concrete wall, photographed
  straight on in flat overcast daylight. The poster shows a lone faceless soldier silhouette in a gas mask,
  and across the top in huge bold condensed capital letters the single German word "FRIEDEN", and along the
  bottom in smaller bold capitals the word "KAUFEN". Limited palette: poster red, ink black, beige paper. Flat
  screen-printed colour planes, halftone dots, slight plate misregistration, torn paper edges. Photoreal photo
  of the poster, no other text, no logos, no symbols, no flags.'
rubric:
  - id: spelling
    check: '"FRIEDEN" and "KAUFEN" are spelled exactly, every letter correct.'
    weight: 3
  - id: legibility
    check: Both words read at thumbnail size; letters are clean, not melted.
  - id: no-extra-text
    check: No other words, pseudo-glyphs, logos, or symbols.
  - id: style
    check: Propaganda lithograph look in red, black, and beige on a concrete wall.
