  - id: EVT-VoiceTrackStopped
    name: Voice track stopped
    context: BC-Series
    data: [Script line, Take status, Reason]
    description: "A replaced, unregistered or stale imported take, a speaker without a reference voice, or an effect longer than the role's maximum; nothing is generated (packages/cli/src/takes.ts:79-87; voice-track.ts:55-60,125-128)"
  - id: EVT-EpisodeTrackBuilt
    name: Episode track built
