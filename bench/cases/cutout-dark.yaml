id: cutout-dark
title: Background removal on a dark scene
sets:
  - core
focus: Cutout on a low-light, low-contrast keyframe, where Qwen background removal has returned fully
  transparent images.
source:
  project: ich-tu-dir-nichts
  shot: shot-075
  note: New case on an existing keyframe.
operation: editImage
role: image.background_removal
seed: 1
prompt: Remove the background, and output a PNG image
fixtures:
  image:
    from: ich-tu-dir-nichts/assets/keyframes/shot-075.png
inputs:
  references:
    - image
rubric:
  - id: not-empty
    check: The subject is present; the output is not fully transparent or empty.
    weight: 3
  - id: edges
    check: Clean edges around hair (ponytail) and fingers, no halo.
  - id: complete
    check: Nothing of the person is cut off; nothing of the background remains.
  - id: alpha
    check: The file has real transparency, not a painted checkerboard or a flat colour.
