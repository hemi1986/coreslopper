  - id: CMD-StartBoard
    name: Start the board
    actor: ACT-User
    produces: [EVT-BoardStarted]
    description: "npm run cli -- board [--port] [--host] [--watch <minutes>], or the board container (docker compose up -d, which runs board --host 0.0.0.0 --port 4848 --watch 5) (index.ts:352-378; docker/Dockerfile; docs/board.md)"
    rules:
      - The board listens on the computer's loopback by default; --host 0.0.0.0 only inside the board container, whose port is published on the loopback (the code does this, index.ts:352-378; compose.yaml:11; ADR 0030)
      - The user uses the board only on the computer it runs on (user, 2026-11-22)
      - Every request other than a read passes the write guard, so only the board's own page writes (the code does this, release-board.ts:102-126,343-346)
      - Every request, reads included, needs a loopback Host (decided 2026-11-22, HS-247; reads answer any Host – gap register)
      - The board writes nothing itself; every write goes to the module of the context that owns it – release status, approval and autopilot marks, review notes and rounds, the wizard's projects and references, the character library (the code does this, release-board.ts:176-320,379-474)
      - --watch takes whole minutes, at least 1, checked before the server listens (decided 2026-11-22, HS-249; checked after it listens – gap register)
  - id: CMD-OpenBoardView
