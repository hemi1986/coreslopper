# Model bench (ADR 0020). Spend from bench runs is tracked in bench/state.json
# against this budget; it is separate from every project budget.
version: 1
budget_usd: 15
# Most a single `bench run` may cost; default: the whole remaining budget.
batch_cap_usd: 5
# Output size for cases without their own width/height.
master:
  width: 1920
  height: 1080
sets:
  core:
    description: Every case; the full comparison of a new model or server
  portrait:
    description: 9:16 episode shots (seite-b robot scenes) for reference-to-video and image-to-video in portrait
  smoke:
    description: Four quick cases (still, edit, i2v, lip-sync) to check that a target works at all
