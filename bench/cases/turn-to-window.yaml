prompt: "Medium close-up at a huge night window over the foggy glittering city: the same young woman from the
  start frame faces the lens with a calm face, then slowly turns her head and shoulders to her left toward the
  window and looks out at the city lights for a moment, calm and thoughtful, then slowly turns back toward the
  lens. Her ponytail moves softly with the turn. Her face, light freckles, hazel-green eyes, glossy pink lips,
  mint-green high ponytail with soft straight bangs, the black long-sleeve turtleneck mini dress and the small
  glowing green LED heart at the collar stay exactly as in the start frame. Static locked-off camera, no zoom,
  one continuous take, slow smooth natural motion, photoreal live-action, one person only, no text, no logos."
