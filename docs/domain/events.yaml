  - id: EVT-StoryboardRevised
    name: Storyboard revised
    aggregate: AGG-Storyboard
    description: "Shots added, removed, re-timed or rewritten by the agent at the user's request, in the chat or in a fix pass (user, 2026-11-21, HS-77)"
    data: [Changed shots, Removed shots, Reason]
  - id: EVT-StoryboardValidated
    name: Storyboard validated
    aggregate: AGG-Storyboard
    description: "validateProject resolved every shot to seconds and frames and found no violation; a failure throws and records nothing. Unless --no-write it also writes the timing snapshot timing.effective.json (packages/cli/src/validate.ts:117-119)"
    data: [Shot count, Duration, Duration in frames, Frame rate, Warnings]
  - id: EVT-ContactSheetWritten
    name: Contact sheet written
    aggregate: AGG-Storyboard
    description: "contact-sheet writes review/contact-sheet.svg from the validated storyboard: text cards, no images (packages/cli/src/contact-sheet.ts; HS-71)"
    data: [Shots, Duration, BPM]
  - id: EVT-GenerationBatchRefused
    name: Generation batch refused
    context: BC-Generation
    data: [Worst-case estimate, Remaining budget, Batch cap]
    description: "Before the first call, also for a dry run: the batch's worst-case estimate, cache hits included, exceeds the remaining budget or the batch cap (packages/core/src/cost.ts:21-38)"
  - id: EVT-GenerationCompleted
    name: Generation completed
    aggregate: AGG-CachedGeneration
    pivotal: true
    data: [Cache key, Operation, Model role, Provider, Model, Prompt, Seed, References, Params, Planned cost, Files]
  - id: EVT-GenerationReused
    name: Generation reused from the cache
    aggregate: AGG-CachedGeneration
    data: [Cache key, Files]
  - id: EVT-GenerationFailed
    name: Generation failed
    context: BC-Generation
    data: [Cache key, Operation, Model role, Provider, Model, Error]
  - id: EVT-ClipRestored
    name: Clip restored
    aggregate: AGG-CachedGeneration
    data: [Clip, Restored clip, Mode, Scale, Color correction]
    description: "The restore pass of a final local clip, a generation of its own (upscaleVideo) whose result is <clip>_upscaled.mp4 with the clip's audio (packages/cli/src/generate.ts:779-810)"
  - id: EVT-GenerationFiled
    name: Generation filed
    context: BC-Generation
    data: [Out path, File]
    description: "A batch item's out copies the result into the project or the series canon (generate.ts:742-751)"
  - id: EVT-ModelRolesChanged
    name: Model roles changed
    aggregate: AGG-ModelRoles
    data: [Model role, Provider, Model, Params, Pricing]
  - id: EVT-ComfyUIRestarted
