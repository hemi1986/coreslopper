[project]
name = "coreslopper-audio-analysis"
version = "0.1.0"
description = "Local audio analysis for coreslopper: Demucs, WhisperX, librosa, and timing.json."
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23",
  "librosa>=0.11",
  "numpy>=2.0",
  "PyYAML>=6.0",
  "soundfile>=0.12",
]

[project.optional-dependencies]
stems = [
  "demucs>=4.0.1",
  "torch>=2.6",
  "torchaudio>=2.6",
]
asr = [
  "faster-whisper>=1.1",
  "whisperx>=3.3",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
