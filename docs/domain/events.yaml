    description: "publish-auth youtube|tiktok|x|linkedin|instagram [--redirect-uri], once per platform; doctor and the board show which are ready (packages/cli/src/index.ts:481-491). The user will set it up later, in their own workspace (user, 2026-11-22)"
    rules:
