      - Every round that is not a dry run records when it ran and how often a round is due; the board calls the autopilot stale after max(15, 3 × interval) minutes (the code does this, release-autopilot.ts:209-212; packages/cli/src/board/release.js:103-106)
      - One mechanism runs the round, the board container or the timer – the other one says so and does not start (decided 2026-11-22, HS-195; only printed – gap register)
  - id: AGG-PlatformCredentials
    name: Platform credentials
    context: BC-Publish
    status: as-is
    evidence:
      - the workspace's .env (mode 0600), written by saveEnvValue from publish-auth and from the adapters when a token rotates (packages/cli/src/publish-auth.ts:24-34; packages/cli/src/social-auth.ts:51-127; packages/providers/src/publish/x.ts:227-232; tiktok.ts:253-257); readiness from autopilotReadiness (packages/cli/src/autopilot-state.ts:68-91)
    invariants:
      - Tokens live only in .env and in memory – never printed, never written unmasked into a log, never shown on the board (the code does this, packages/providers/src/publish/http.ts:4-13; publish.ts:389-393,460; packages/cli/src/release-board-data.ts:719-752)
      - A rotated refresh token is saved at once – X's is single-use (the code does this, x.ts:227-232)
      - A long-running watchdog reads .env again before every round, so a token renewed on the computer reaches the container (the code does this, packages/cli/src/production-watch.ts:129-152)
      - A platform is ready by one rule, the same for doctor, the board and the plan, and a token that can be refreshed counts as ready (decided 2026-11-22, HS-196; doctor and the plan differ, LinkedIn with a refresh token is blocked – gap register)
      - Every write of .env is atomic and under a lock (decided 2026-11-22, HS-189; the code does this – saveEnvValue, lock file .env.lock)
  - id: AGG-WorkspaceMarker
    name: Workspace marker
    context: BC-Workspace
    status: as-is
    evidence:
      - coreslopper.workspace.json at the workspace root – version, runtime version, created, the first project, the last update and the baseline (SHA-256 per runtime file) – written whole by init and by every update that is not a dry run (packages/cli/src/workspace.ts:6-17; packages/cli/src/init.ts:167-176,324; packages/cli/src/update.ts:96-99,308-315)
      - updateWorkspace classifies every runtime file against the baseline and the workspace in one pass, then writes the new baseline (update.ts:192-353)
    invariants:
      - The baseline holds upstream's hash of every file of the runtime last installed or offered – also of a file kept as a conflict, a local change or a local deletion (the code does this, update.ts:232; glossary fixed, HS-208)
      - Every runtime file is decided by three states – baseline, workspace, new runtime – updated when untouched, kept when only the user changed it, removed when upstream dropped an untouched file, a conflict copy when both changed; a file identical to upstream needs nothing (the code does this, update.ts:241-292)
      - .env and every .env.* but .env.example, .mcp.json, GETTING_STARTED.md and the marker itself are never written by update; under projects/, series/ and library/ update only adds missing files; package-lock.json always follows upstream (the code does this, update.ts:36-56,229-239)
      - No upstream copy of a series canon goes into projects/<slug>/ while the canon is still in series/<slug>/ (the code does this, update.ts:229-235)
      - A downgrade, and an overwrite of a locally changed file, happen only with --force; a dry run writes nothing (the code does this, update.ts:207-211,252-262,306)
      - A conflict stays visible until the user resolved it – every update and doctor name each conflict copy left in the workspace (decided 2026-11-22, HS-209; reported once, then kept silently – gap register)
      - The runtime version recorded is the runtime's own, at init as at update (decided 2026-11-22, HS-215; init records the CLI's version – gap register)
      - A directory is a workspace when it holds the marker; the upstream repository is not a workspace (decided 2026-11-22, HS-213; a package named coreslopper with a project template counts too – gap register)
  - id: AGG-RuntimeSnapshot
    name: Runtime snapshot
    context: BC-Workspace
    status: as-is
    evidence:
      - runtime/, built whole from the tracked files by build-runtime.mjs through planRuntime, which classifies every tracked path as shipped, shipped from workspace/ or not shipped (scripts/runtime-files.mjs:20-149; scripts/build-runtime.mjs:19-80)
      - the npm package carries dist/cli.js and runtime/ (package.json bin and files; tsup.config.ts)
    invariants:
      - Every tracked file is classified; an unclassified file or two sources for one runtime path stop the build (the code does this, runtime-files.mjs:130-149; tests/runtime-files.test.ts)
      - workspace/ becomes the workspace root; the engineering layer and every AGENTS.md or CLAUDE.md outside workspace/ never ship (the code does this, runtime-files.mjs:113-124; ADR 0036)
      - The runtime's package.json is private and has no bin, files, publish settings or build scripts (the code does this, build-runtime.mjs:61-79)
      - The npx CLI carries no render stack – Remotion and React stay development dependencies the workspace installs (the code does this, package.json; tsup.config.ts:14-16; guarded only by the CI pack smoke test – gap register)
      - Only what a workspace can run ships into it – the upstream CI does not (decided 2026-11-22, HS-211; ci.yml ships and runs a build the workspace lacks – gap register)
  - id: AGG-BenchCase
    name: Bench case
    context: BC-Bench
    status: as-is
    evidence:
      - bench/cases/<id>.yaml, one file per case, parsed whole by BenchCaseSchema with its cross-field rules; a case is valid or not loaded (packages/core/src/bench.ts:17-129,245-258)
    invariants:
      - Every input and the known good result name one of the case's fixtures (the code does this, core/src/bench.ts:102-108)
      - An operation gets the inputs it needs – references for edits, image-to-video, lip-sync and reference-to-video, exactly two for first-last-frame, none for text-to-image, text-to-video and audio, an audio input for lip-sync, a flex prompt for reference-to-video (the code does this, core/src/bench.ts:109-125)
      - Rubric criteria have unique ids and a weight of at least 1 (the code does this, core/src/bench.ts:45-49,126-128)
      - A case's id is its file name (the code does this, core/src/bench.ts:252-254)
      - Params in a case are portable; ComfyUI node ids belong in a target (the code does this for the tracked cases only, tests/bench.test.ts:115-129; ADR 0020)
      - A case names its source project by slug, and its fixtures by paths inside that project – so it belongs to the workspace that holds the project (decided 2026-11-22, HS-226; the code does this – upstream tracks only the example-* cases, which need no fixtures)
  - id: AGG-BenchRun
    name: Bench run
    context: BC-Bench
    status: as-is
    evidence:
      - bench/runs/<id>/run.json, the run's cases, targets, seeds and results keyed by <case>/<target>/<seed index>, loaded once and written whole and atomically after every result (packages/cli/src/bench.ts:127-136,523-539,698-700)
    invariants:
      - One result per result key; a later result for the same key replaces the earlier one (the code does this, bench.ts:140,489-493)
      - The n-th seed of a case is the case's seed plus n times 101 (the code does this, bench.ts:145-147)
      - A target that does not run a case's operation, or a reference-to-video target for a case without a flex prompt, gives a skipped result, never a failed one (the code does this, bench.ts:293-299,563-569)
      - A refusal by the provider is a result, not an error; an error is never scored (the code does this for the status, bench.ts:686-691; the report counts a scored error – gap register)
      - Running again with a run's id fills the gaps – ok and refused results stay, unless --fresh, and the estimate counts only what is left (decided 2026-11-22, HS-228; every planned item runs again – gap register)
      - Every generation goes through the generation funnel with the target's provider, workflow folder and server (the code does this for runBatch, bench.ts:577,634,675; ADR 0041; Pika classification and reference-to-video ignore the target – gap register)
  - id: AGG-BenchBudget
    name: Bench budget
    context: BC-Bench
    status: as-is
    evidence:
      - bench/state.json, the bench's spend, its total overwritten from bench/bench.yaml budget_usd on every load and saved atomically by the generation funnel's recordSpend (packages/cli/src/bench.ts:268-277,354-360; packages/cli/src/generate.ts:756-759)
    invariants:
      - The bench budget is separate from every project budget; a bench run never bills a project (the code does this, bench.ts:347-361)
      - A bench run's whole estimate fits the remaining bench budget and its batch cap before the first call (the code does this, bench.ts:600; tests/bench.test.ts:254)
      - One batch cap holds for the whole run and for each of its generations – batch_cap_usd, or the whole remaining bench budget when it is not set (decided 2026-11-22, HS-230; each generation falls back to 30 % – gap register)
      - No bench run loses another's spend, and no charged generation goes unrecorded (decided 2026-11-22, HS-237; state.json has no lock, and spend above the estimate is thrown before it is saved – gap register)

  - id: AGG-LibrarySound
    name: Library sound
    context: BC-SoundLibrary
    status: target
    invariants:
      - The entry's id is its folder's name, and its one audio file is a WAV of that folder and exists (user, 2026-11-22, feature meme)
      - Title and use when are never empty; length and loudness are measured from the file, never typed (user, 2026-11-22)
      - A cue and a trim lie inside the sound's length, and a cue inside the trim (user, 2026-11-22)
      - One sound, one entry – the same file content is never stored under a second id (user, 2026-11-22)
      - The library belongs to the user – update and init never overwrite it; its audio files are gitignored and sound.yaml stays tracked (user, 2026-11-22)
      - The credit is optional; a licence that asks for attribution without a credit is allowed and becomes a release TODO (user, 2026-11-22, HS-265)

